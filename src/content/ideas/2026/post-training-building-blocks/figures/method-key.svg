<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 330" width="2000" height="330" role="img" aria-labelledby="title">
  <title id="title">Key to the method diagrams</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8e8e8"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9fa7"/>
    </marker>
    <style>
      .bg { fill: #0f1115; }
      .box { fill: #0f1115; stroke: #e8e8e8; stroke-width: 2.5; }
      .trained { fill: #161a22; stroke: #e8e8e8; stroke-width: 4.5; }
      .frozen { fill: #14161b; stroke: #8c919a; stroke-width: 2.5; }
      .data { fill: #0f1115; stroke: #b8bcc3; stroke-width: 2; }
      .data-back { fill: #0f1115; stroke: #4a4f57; stroke-width: 2; }
      .dash { stroke-dasharray: 12 8; }
      .group { fill: none; stroke: #6b7079; stroke-width: 2; stroke-dasharray: 6 8; }
      .inner { fill: none; stroke: #4a4f57; stroke-width: 2; }
      .rule { stroke: #2a2e35; stroke-width: 2; }
      .rl { stroke: #8c919a; stroke-width: 3; stroke-linecap: round; }
      .line { fill: none; stroke: #e8e8e8; stroke-width: 2.5; }
      .line-dash { fill: none; stroke: #e8e8e8; stroke-width: 2.5; stroke-dasharray: 12 8; }
      .line-dim { fill: none; stroke: #9a9fa7; stroke-width: 2; stroke-dasharray: 6 6; }
      .title { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 29px; fill: #f2f2f2; text-anchor: middle; }
      .sub { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 22px; fill: #a3a8b0; text-anchor: middle; }
      .item { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 22px; fill: #d4d6da; }
      .ftitle { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 34px; fill: #f2f2f2; }
      .desc { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 23px; fill: #a3a8b0; }
      .num { font-family: "IBM Plex Mono", Menlo, Consolas, "Courier New", monospace; font-size: 20px; fill: #e8e8e8; text-anchor: middle; }
      .lab { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 21px; fill: #d4d6da; }
      .mono { font-family: "IBM Plex Mono", Menlo, Consolas, "Courier New", monospace; font-size: 18px; letter-spacing: 3.5px; fill: #8c919a; }
      .head { font-family: "IBM Plex Mono", Menlo, Consolas, "Courier New", monospace; font-size: 21px; letter-spacing: 4px; fill: #d4d6da; }
      .tag { font-family: "IBM Plex Mono", Menlo, Consolas, "Courier New", monospace; font-size: 14px; letter-spacing: 3px; fill: #8c919a; text-anchor: middle; }
      .tag-on { fill: #e8e8e8; }
      .code { font-family: "IBM Plex Mono", Menlo, Consolas, "Courier New", monospace; font-size: 22px; font-weight: 700; fill: #8c919a; text-anchor: middle; }
      .note { font-family: "IBM Plex Mono", Menlo, Consolas, "Courier New", monospace; font-size: 18px; fill: #8c919a; }
    </style>
