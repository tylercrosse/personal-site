<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Representation comparison pipeline">
  <rect width="1200" height="520" fill="#f7f7f5"/>
  <text x="40" y="58" font-family="Georgia, serif" font-size="30" fill="#1f2937">Representation Comparison Workflow</text>

  <rect x="40" y="110" width="210" height="100" rx="10" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="60" y="150" font-family="Verdana" font-size="20" fill="#111827">Matched Inputs</text>
  <text x="60" y="176" font-family="Verdana" font-size="16" fill="#374151">Prompt slices + tasks</text>

  <rect x="290" y="110" width="220" height="100" rx="10" fill="#dcfce7" stroke="#166534"/>
  <text x="310" y="150" font-family="Verdana" font-size="20" fill="#111827">Activation Hooks</text>
  <text x="310" y="176" font-family="Verdana" font-size="16" fill="#374151">Layer-wise traces</text>

  <rect x="550" y="110" width="240" height="100" rx="10" fill="#fde68a" stroke="#854d0e"/>
  <text x="570" y="150" font-family="Verdana" font-size="20" fill="#111827">Feature Extraction</text>
  <text x="570" y="176" font-family="Verdana" font-size="16" fill="#374151">Dictionary or probes</text>

  <rect x="830" y="110" width="320" height="100" rx="10" fill="#fee2e2" stroke="#991b1b"/>
  <text x="850" y="150" font-family="Verdana" font-size="20" fill="#111827">Comparison + Robustness</text>
  <text x="850" y="176" font-family="Verdana" font-size="16" fill="#374151">CKA, overlap, slice checks</text>

  <rect x="260" y="300" width="680" height="150" rx="14" fill="#ffffff" stroke="#6b7280"/>
  <text x="290" y="338" font-family="Verdana" font-size="22" fill="#111827">Claim Ledger</text>
  <text x="290" y="370" font-family="Verdana" font-size="18" fill="#374151">- claim text</text>
  <text x="290" y="398" font-family="Verdana" font-size="18" fill="#374151">- supporting checks</text>
  <text x="290" y="426" font-family="Verdana" font-size="18" fill="#374151">- conflicting checks</text>

  <line x1="250" y1="160" x2="290" y2="160" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="510" y1="160" x2="550" y2="160" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="790" y1="160" x2="830" y2="160" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="990" y1="210" x2="790" y2="300" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>
</svg>
