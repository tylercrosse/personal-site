      ${mixed ? "" : `<div class="pills">${F.order.map(id => `<button class="chip${c.ids.includes(id) ? " on" : ""}" style="--c:var(--fc)" data-cmp-toggle="${id}">${byId[id].label}</button>`).join("")}</div>`}
    </div>
    <div class="cmp-cols">${[c.ref, ...c.ids.filter(x => x !== c.ref)].map(id => {
      const ref = id === c.ref, n = nDiff(id), col = famM(id).color;
      return `<div class="cmp-col${ref ? " ref" : ""}" style="--fc:${col}">
        <button class="cmp-h" data-cmp-ref="${id}"><b>${byId[id].label}</b><span class="yr">${byId[id].year}</span>
          <span class="cmp-tag">${tag(id, n)}</span></button>
        <div class="mech">${profHTML(id, ref ? null : c.ref)}<div class="mech-body">${mechSVG(id, ref || mixed ? null : c.ref)}</div>
          <ul class="mech-diff">${mixed ? mechDiff(id) : mechDiffCol(c.ref, id)}</ul></div>
        <button class="ref cmp-open" data-cmp-open="${id}">Open in the panel</button>
        <div class="cmp-body">${nodePanelHTML(byId[id], true, sharedInputs)}</div>
      </div>`; }).join("")}</div>`;
  placeTry();
}
CMP.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return;
  const c = state.compare;
  if (t.dataset.tryX) dismissTry();
  else if (t.dataset.cmpClose) closeCompare();
  else if (t.dataset.cmpOpen) { closeCompare(); select(t.dataset.cmpOpen); }
  else if (t.dataset.cmpRef) { c.ref = t.dataset.cmpRef; renderCompare(); }
  else if (t.dataset.cmpRel) openRelCompare(+t.dataset.cmpRel);
  else if (t.dataset.cmpFam) openCompare("f-" + t.dataset.cmpFam);
  else if (t.dataset.cmpPairs) openRelCompare(CROSS_PAIRS()[0]);
  else if (t.dataset.cmpMix) openMix(state.lastMix ? state.lastMix.ids : ["m-sft", "m-dpo", "m-grpo"]);
  else if (t.dataset.cmpMixtoggle) {
    const id = t.dataset.cmpMixtoggle;
    const ids = c.ids.includes(id) ? (c.ids.length > 1 ? c.ids.filter(x => x !== id) : c.ids) : [...c.ids, id];
    const ref = ids.includes(c.ref) ? c.ref : ids[0];
    openMix([ref, ...ids.filter(x => x !== ref)]);
  }
  else if (t.dataset.node) { closeCompare(); select(t.dataset.node); }
  else if (t.dataset.recipe) { closeCompare(); toggleRecipe(t.dataset.recipe); }
  else if (t.dataset.cmpToggle) {
    const id = t.dataset.cmpToggle, order = FAM_MECH[c.fam].order;
    if (c.ids.includes(id)) { if (c.ids.length > 1) c.ids = c.ids.filter(x => x !== id); }
    else c.ids = order.filter(x => x === id || c.ids.includes(x));
    if (!c.ids.includes(c.ref)) c.ref = c.ids[0];
    renderCompare();
  }
});

// ---- Search: labels, recipes, stages, summaries, and the names readers arrive with
const SRCH = $("search"), SQ = $("sq"), SRES = $("sres");
const norm = t => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[-–—]/g, " ").replace(/\s+/g, " ").trim();
function scoreText(text, q) {
  const t = norm(text);
  if (t === q) return 100;
  if (t.startsWith(q)) return 80;
  if (q.length >= 2 && (t.includes(" " + q) || t.includes("(" + q))) return 60;
  if (q.length >= 3 && t.includes(q)) return 40;
  return 0;
}
const KIND_NAME = { source: "Source", data: "Data", scorer: "Reward source", family: "Learning signal", method: "Update rule", stage: "Pipeline stage" };
function searchResults(raw) {
  const q = norm(raw), out = [];
  if (!q) {
    return [...ALIASES.map(a => ({ t: "alias", id: a.id, s: 0 })), ...["m-grpo", "m-dpo", "m-opd"].map(id => ({ t: "node", id, s: 0 })), { t: "recipe", id: "r1", s: 0 }];
  }
  for (const a of ALIASES) { const s = Math.max(...a.terms.map(x => scoreText(x, q))); if (s) out.push({ t: "alias", id: a.id, s: s + 5 }); }
  for (const n of NODES) {
    let s = scoreText(n.label, q);
    if (n.kind === "stage") s = Math.max(s, scoreText(RECIPE[n.rid].name + " " + n.label, q) * 0.8, q.length >= 4 ? scoreText(n.st.s, q) * 0.5 : 0);
    if (!s && q.length >= 4 && n.summary && norm(n.summary).includes(q)) s = 15;
    if (s) out.push({ t: "node", id: n.id, s: n.kind === "stage" ? s * 0.6 : s });
  }
  for (const [terms, id] of SYNONYMS) {
    let best = 0, term = "";
    for (const x of terms) { const s = scoreText(x, q) * (x.length <= 4 && norm(x) !== q ? 0.5 : 0.9); if (s > best) { best = s; term = x; } }
    if (best) out.push({ t: "syn", id, term, s: best });
  }
  for (const r of RECIPES) { const s = scoreText(r.name, q); if (s) out.push({ t: "recipe", id: r.id, s: s + 2 }); }
  // keep the best hit per target
  const seen = new Map();
  for (const r of out.sort((a, b) => b.s - a.s)) { const k = r.t === "syn" ? "node:" + r.id : r.t + ":" + r.id; if (!seen.has(k)) seen.set(k, r); }
  return [...seen.values()].slice(0, 9);
}
let srchHits = [], srchAct = 0;
function renderSearch() {
  srchHits = searchResults(SQ.value);
  if (srchAct >= srchHits.length) srchAct = 0;
  const row = (h, i) => {
    let label, sub, kd, color;
    if (h.t === "alias") { const a = ALIAS_BY_ID[h.id]; label = a.name; sub = a.long + " · a combination of parts"; kd = "Name"; color = "var(--reward)"; }
    else if (h.t === "recipe") { const r = RECIPE[h.id]; label = r.name; sub = `Published recipe, ${r.year} · open in Pipelines`; kd = "Recipe"; color = r.color; }
    else {
      const n = byId[h.id];
      color = n.kind === "stage" ? RECIPE[n.rid].color : colorOf(n);
      label = h.t === "syn" ? h.term : n.kind === "stage" ? `${RECIPE[n.rid].name} · ${n.i + 1}. ${n.label}` : n.label;
      sub = h.t === "syn" ? `→ ${n.label}` : n.kind === "stage" ? n.st.s : (n.summary || "").split(". ")[0];
      kd = KIND_NAME[n.kind] || n.kind;
    }
    return `<li><button class="${i === srchAct ? "act" : ""}" data-hit="${i}"><span class="sw" style="background:${color}"></span><span>${label}</span><span class="sub">${sub}</span><span class="kd">${kd}</span></button></li>`;
  };
  SRES.innerHTML = srchHits.length ? (SQ.value.trim() ? "" : `<li class="grp">Try</li>`) + srchHits.map(row).join("")
    : `<li class="empty">Nothing matches “${SQ.value}”. Try a method (GRPO), a name (RLHF), or a recipe (Kimi K3).</li>`;
}
function openSearch() { SRCH.hidden = false; SQ.value = ""; srchAct = 0; renderSearch(); SQ.focus(); }
function closeSearch() { SRCH.hidden = true; }
function goHit(h) {
  clearGuide();
  closeSearch();
  if (state.compare) closeCompare();
  if (h.t === "alias") return openAlias(h.id);
  if (h.t === "recipe") { state.sel = null; state.alias = null; state.recipes = [h.id]; syncChips(); applyLens("pipes"); refresh(); renderPanel(); return; }
  select(h.id);
}
$("srchbtn").onclick = openSearch;
SQ.addEventListener("input", () => { srchAct = 0; renderSearch(); });
SQ.addEventListener("keydown", ev => {
  if (ev.key === "ArrowDown") { srchAct = Math.min(srchAct + 1, srchHits.length - 1); renderSearch(); ev.preventDefault(); }
  else if (ev.key === "ArrowUp") { srchAct = Math.max(srchAct - 1, 0); renderSearch(); ev.preventDefault(); }
  else if (ev.key === "Enter") { if (srchHits[srchAct]) goHit(srchHits[srchAct]); ev.preventDefault(); }
  else if (ev.key === "Escape") { closeSearch(); ev.stopPropagation(); ev.preventDefault(); }
});
SRES.addEventListener("click", ev => { const b = ev.target.closest("button[data-hit]"); if (b) goHit(srchHits[+b.dataset.hit]); });
SRCH.addEventListener("click", ev => { if (ev.target === SRCH) closeSearch(); });
document.addEventListener("keydown", ev => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); SRCH.hidden ? openSearch() : closeSearch(); }
  else if (ev.key === "/" && !typing && SRCH.hidden) { ev.preventDefault(); openSearch(); }
});

// A named combination: its own panel, and its path lit on the map
function openAlias(id) {
  if (state.compare) closeCompare();
  state.sel = null; state.recipes = []; syncChips(); state.alias = id;
  if (state.lens !== "flow") applyLens("flow");
  refresh(); renderPanel();
}
function renderAliasPanel() {
  const A = ALIAS_BY_ID[state.alias];
  P.innerHTML = `<button class="back" data-clear="1">← overview</button>
    <div class="kind" style="color:var(--reward)">A name for a combination of parts</div>
    <h2>${A.name}</h2><p class="note">${A.long}</p><p>${A.text}</p>${A.cite ? `<p>${citeTxt(A.cite)}</p>` : ""}
    <h3>The parts, lit on the map</h3>${pillList(A.path)}
    <h3>A recipe that uses it</h3><div class="pills">${recipeChip(A.recipe)}</div>`;
}

// ---- URL: the view lives in the hash, so it can be linked to and back/forward work
let hashLock = false, hashT = null;
const MIX_ORDER = () => CMP_FAMS.flatMap(f => FAM_MECH[f].order);
function hashFor() {
  if (state.tryOn) return "try=" + state.tryOn.id;
  const p = [];
  if (state.lens !== "flow") p.push("lens=" + state.lens);
  if (state.alias) p.push("q=" + state.alias);
  else if (state.sel) p.push("sel=" + state.sel);
  if (state.recipes.length) p.push("recipes=" + state.recipes.join(","));
  if (state.showRel) p.push("rel=1");
  if (state.hl) p.push("hl=" + state.hl.join(","));
  if (state.labels) p.push("labels=1");
  if (state.reveal) p.push("reveal=" + state.reveal.join(","));
  if (state.zoom) p.push("zoom=" + state.zoom.join(","));
  const c = state.compare;
  if (c) p.push("cmp=" + (c.fam || (c.mix ? "mix" : "pair-" + c.rel)), "cols=" + c.ids.join(","), "ref=" + c.ref);
  return p.join("&");
}
function syncHash() {
  if (hashLock || EMBED) return;                              // an embedded map never touches the host's history
  clearTimeout(hashT);
  hashT = setTimeout(() => {                                  // one history entry per interaction, not per step
    const h = hashFor();
    if (h !== location.hash.slice(1)) history.pushState(null, "", h ? "#" + h : location.pathname + location.search);
  }, 0);
}
// Applies a view given as hash-style params; the URL hash by default, or a string from a host page
function applyHash(str) {
  const p = viewParams = new URLSearchParams(typeof str === "string" ? str : location.hash.slice(1));
  const list = k => (p.get(k) || "").split(",").filter(Boolean);
  hashLock = true;
  try {
    if (TRY_BY[p.get("try")]) return runTry(p.get("try"));
    state.tryOn = null;
    const lens = LAYOUT[p.get("lens")] ? p.get("lens") : "flow";
    const hl = list("hl").filter(id => byId[id]), reveal = list("reveal"), zoom = list("zoom");
    const recipes = list("recipes").filter(r => RECIPE[r]).slice(0, 3);
    const relayout = lens !== state.lens || String(reveal) !== String(state.reveal || "") || String(zoom) !== String(state.zoom || "")
      || String(recipes) !== String(state.recipes)
      || (zoom.includes("hl") && String(hl) !== String(state.hl || ""));   // framing the highlight follows it           // lanes in the pipelines lens; room for the legend elsewhere
    state.hl = hl.length ? hl : null; state.labels = p.get("labels") === "1";
    state.reveal = reveal.length ? reveal : null; state.zoom = zoom.length ? zoom : null;
    state.recipes = recipes; syncChips();                     // before the layout: the pipelines lens filters by them
    if (relayout) applyLens(lens);
    if (p.get("rel") === "1" !== state.showRel) setRel(p.get("rel") === "1");
    const q = p.get("q"), sel = p.get("sel");
    if (q && ALIAS_BY_ID[q]) { state.sel = null; state.alias = q; refresh(); renderPanel(); }
    else { state.alias = null; select(sel && byId[sel] ? sel : null); }
    const cmp = p.get("cmp"), cols = (p.get("cols") || "").split(",").filter(id => MECH[id] && !MECH[id].generic);
    if (cmp && cols.length) {
      let c;
      if (FAM_MECH[cmp]) c = { fam: cmp, ids: FAM_MECH[cmp].order.filter(x => cols.includes(x)) };
      else if (cmp.startsWith("pair-") && RELATIONS[+cmp.slice(5)]) c = { fam: null, rel: +cmp.slice(5), ids: cols };
      else c = { fam: null, mix: true, ids: MIX_ORDER().filter(x => cols.includes(x)) };
      c.ref = c.ids.includes(p.get("ref")) ? p.get("ref") : c.ids[0];
      state.compare = state.lastCompare = c; renderCompare();
    } else if (state.compare) closeCompare();
  } finally { hashLock = false; }
}
window.addEventListener("popstate", () => applyHash());

// ---- Host pages. An embedding page (?embed=1) drives the view with
//   frame.contentWindow.postMessage({ type: "pt-explorer:state", state: "lens=flow&hl=d-pairs,s-rm&zoom=hl" }, "*")
// using the same params as the hash, plus hl= (light these parts), labels=1 (name the lit edges),
// reveal= (kinds to show; the rest are ghosted) and zoom= (ids, kinds or "hl" to frame).
// The map says { type: "pt-explorer:ready" } to its parent once it can take a state.
let ready = false, pendingState = null;
window.addEventListener("message", ev => {
  if (!ev.data || ev.data.type !== "pt-explorer:state" || typeof ev.data.state !== "string") return;
  driven = true;
  if (ready) applyHash(ev.data.state); else pendingState = ev.data.state;
});

// ---- Mix & match: any methods, any family, compared on their profile strips
function openMix(ids) {
  const order = MIX_ORDER(), pick = order.filter(x => ids.includes(x)).slice(0, 4);
  state.compare = state.lastCompare = state.lastMix = { fam: null, mix: true, ids: pick, ref: ids.find(x => pick.includes(x)) || pick[0] };
  renderCompare();
}

P.addEventListener("click", ev => {
  if (ev.target.closest("button")) clearGuide();
  const t = ev.target.closest("button"); if (!t) return;
  if ("mechPin" in t.dataset) {                              // pin a swap (a second tap on the pinned one unpins)
    const card = P.querySelector(".mech"), id = t.dataset.mechPin;
    card.dataset.pin = card.dataset.pin === id ? "" : id;
    card.dataset.show = "\u0000";                            // force a redraw
    return mechShow(card.dataset.pin || "__base");
  }
  if (t.dataset.compare) openCompare(t.dataset.compare);
  else if (t.dataset.cmpRel) openRelCompare(+t.dataset.cmpRel);
  else if (t.dataset.node) select(t.dataset.node);
  else if (t.dataset.recipe) toggleRecipe(t.dataset.recipe);
  else if (t.dataset.try) runTry(t.dataset.try);
  else if (t.dataset.tryX) dismissTry();
  else if (t.dataset.tryMore) { const h = tryHead(TRY_BY[state.tryOn?.id] || {}); h && h.scrollIntoView({ behavior: "smooth", block: "start" }); }
  else if (t.dataset.clear) select(null);
  else if (t.dataset.clearRecipes) { state.recipes = []; syncChips(); refresh(); renderPanel(); }
});

// ---- pan / zoom
let drag = null;
svg.addEventListener("pointerdown", ev => {
  if (ev.target.closest(".node")) return;
  drag = { x: ev.clientX, y: ev.clientY, tx: view.tx, ty: view.ty, moved: false };
  svg.setPointerCapture(ev.pointerId); svg.classList.add("grabbing");
});
svg.addEventListener("pointermove", ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  view.tx = drag.tx + dx; view.ty = drag.ty + dy; frame();
});
svg.addEventListener("pointerup", () => {
  if (drag && !drag.moved && state.sel) select(null);
  drag = null; svg.classList.remove("grabbing");
  if (!animating) renderLabels();
});
function zoomAt(px, py, f) {
  const k2 = Math.max(0.25, Math.min(3, view.k * f));
  view.tx = px - (px - view.tx) * k2 / view.k; view.ty = py - (py - view.ty) * k2 / view.k; view.k = k2;
  frame(); renderLabels();
}
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  if (ev.ctrlKey || ev.metaKey) {
    const r = svg.getBoundingClientRect();
    zoomAt(ev.clientX - r.left, ev.clientY - r.top, Math.exp(-Math.max(-60, Math.min(60, ev.deltaY)) * 0.01));
  } else { view.tx -= ev.deltaX; view.ty -= ev.deltaY; frame(); }
}, { passive: false });
$("zin").onclick = () => zoomAt(svg.clientWidth / 2, svg.clientHeight / 2, 1.25);
$("zout").onclick = () => zoomAt(svg.clientWidth / 2, svg.clientHeight / 2, 0.8);
$("zfit").onclick = () => { if (lastLayout) tween(Object.fromEntries(NODES.map(n => [n.id, { ...cur[n.id] }])), fitView(lastLayout.pos, lastLayout.deco), 400); };
document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape") return;
  if (!SRCH.hidden) closeSearch(); else if (state.compare) closeCompare(); else select(null);
});
// ---- resizable side panel
(() => {
  const app = document.querySelector(".app"), handle = $("resizer");
  const DEF = 420, MIN = 320, MAP_MIN = 360, KEY = "pt-explorer-panel-w";
  const clamp = w => Math.round(Math.max(MIN, Math.min(w, app.clientWidth - MAP_MIN)));
  const setW = w => { const v = clamp(w); app.style.setProperty("--panel-w", v + "px"); handle.setAttribute("aria-valuenow", v); return v; };
  const save = w => { try { localStorage.setItem(KEY, String(w)); } catch (e) {} };
  const refit = () => window.dispatchEvent(new Event("resize"));   // reuse the map's own refit
  let saved = null; try { saved = Number(localStorage.getItem(KEY)) || null; } catch (e) {}
  setW(saved || DEF);

  let drag = null;
  handle.addEventListener("pointerdown", ev => {
    ev.preventDefault(); ev.stopPropagation();
    handle.setPointerCapture(ev.pointerId);
    drag = { right: app.getBoundingClientRect().right };
    handle.classList.add("drag"); document.body.classList.add("resizing");
  });
  handle.addEventListener("pointermove", ev => { if (drag) setW(drag.right - ev.clientX); });
  const end = () => {
    if (!drag) return; drag = null;
    handle.classList.remove("drag"); document.body.classList.remove("resizing");
    save(parseInt(app.style.getPropertyValue("--panel-w"))); refit();
  };
  handle.addEventListener("pointerup", end);
  handle.addEventListener("pointercancel", end);
  handle.addEventListener("dblclick", () => { save(setW(DEF)); refit(); });
  handle.addEventListener("keydown", ev => {
    const step = ev.shiftKey ? 80 : 20, cur = parseInt(app.style.getPropertyValue("--panel-w")) || DEF;
    if (ev.key === "ArrowLeft") { save(setW(cur + step)); refit(); ev.preventDefault(); }
    else if (ev.key === "ArrowRight") { save(setW(cur - step)); refit(); ev.preventDefault(); }
  });
  // keep the width legal when the window shrinks
  window.addEventListener("resize", () => setW(parseInt(app.style.getPropertyValue("--panel-w")) || DEF));
})();

// ---- theme menu (hidden when a host page sets the theme)
(() => {
  const sel = $("themesel"), T = window.ptTheme;
  const sync = () => { sel.value = document.documentElement.dataset.theme; sel.hidden = T.hosted; };
  sel.onchange = () => { T.set(sel.value); try { localStorage.setItem(T.KEY, sel.value); } catch (e) {} };
  T.onchange = sync; sync();
})();

let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (lastLayout) { view = fitView(lastLayout.pos, lastLayout.deco); frame(); renderLabels(); } }, 150); });

/* ============================================================
   INIT
   ============================================================ */
function init() {
  if (EMBED) document.body.inert = true;                     // nothing in an embedded map takes focus or clicks
  LENSES.forEach(l => {
    const b = document.createElement("button"); b.textContent = l.label; b.dataset.lens = l.id;
    b.onclick = () => { if (state.compare) closeCompare(); clearGuide(false); applyLens(l.id); };   // a lens click should never look dead
    if (l.id === "time") { const d = document.createElement("span"); d.className = "tabsep"; d.setAttribute("aria-hidden", "true"); $("tabs").appendChild(d); }
    $("tabs").appendChild(b);
  });
  RECIPES.forEach(r => {
    const b = document.createElement("button"); b.className = "chip"; b.dataset.recipe = r.id; b.style.setProperty("--c", r.color);
    b.innerHTML = `<span class="sw" style="background:${r.color}"></span>${r.name}`;
    b.onclick = () => toggleRecipe(r.id); $("recipes").appendChild(b);
  });
  buildNodes();
  applyLens("flow", false);
  renderPanel();
  if (location.hash.length > 1) applyHash();                 // arriving from a link
  history.replaceState(null, "", location.hash || location.pathname + location.search);
  ready = true;
  if (pendingState != null) applyHash(pendingState);
  if (window.parent !== window) window.parent.postMessage({ type: "pt-explorer:ready" }, "*");
}
Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(init);
</script>
