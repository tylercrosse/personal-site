<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post-training map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1115; --surface: #171a21; --surface2: #20242d; --panel: #12141a;
  --border: #2a2f3a; --text: #e8e8e8; --muted: #9a9fa7; --faint: #6b7079;
  --demo: #6fbf8e; --pref: #e8b04a; --reward: #b48ad8; --teacher: #6aa2e0; --neutral: #8c919a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: Inter, system-ui, -apple-system, sans-serif; }
body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
button { font: inherit; }

header { display: flex; align-items: center; gap: 14px 18px; padding: 10px 16px;
  border-bottom: 1px solid var(--border); flex-wrap: wrap; }
header h1 { font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; }
.tabs { display: flex; gap: 2px; background: var(--surface); padding: 3px; border-radius: 8px;
  border: 1px solid var(--border); flex-wrap: wrap; }
.tabs button { background: none; border: 0; color: var(--muted); padding: 5px 10px; border-radius: 6px;
  font-size: 12.5px; cursor: pointer; }
.tabs button:hover { color: var(--text); }
.tabs button.on { background: var(--surface2); color: var(--text); }
.lensdesc { color: var(--muted); font-size: 12.5px; flex: 1 1 280px; line-height: 1.4; }

.app { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w, 420px); min-height: 0; }
/* Drag the panel's left edge to resize it; double-click to reset */
.resizer { position: absolute; top: 0; right: 0; bottom: 0; width: 7px; cursor: ew-resize; z-index: 5; touch-action: none; }
.resizer::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 2px; background: transparent; transition: background .15s; }
.resizer:hover::after, .resizer:focus-visible::after, .resizer.drag::after { background: var(--faint); }
.resizer:focus { outline: none; }
body.resizing { cursor: ew-resize; user-select: none; }
body.resizing svg#map { pointer-events: none; }
.mech { max-width: 460px; }
.canvas { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
svg#map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; }
svg#map.grabbing { cursor: grabbing; }

.recipes { position: absolute; left: 12px; right: 60px; bottom: 12px; display: flex; gap: 6px;
  flex-wrap: wrap; align-items: center; pointer-events: none; }
.recipes > * { pointer-events: auto; }
.recipes .lbl { color: var(--faint); font-size: 11.5px; margin-right: 2px; pointer-events: none; }
.chip { border: 1px solid var(--border); background: rgba(23,26,33,.92); color: var(--muted);
  border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { color: var(--text); }
.chip .sw { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chip.on { color: var(--text); border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, #171a21); }

.zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 32px; height: 32px; border-radius: 7px; border: 1px solid var(--border);
  background: rgba(23,26,33,.92); color: var(--muted); cursor: pointer; font-size: 15px; }
.zoom button:hover { color: var(--text); }
.hint { position: absolute; right: 54px; top: 18px; color: var(--faint); font-size: 11px; pointer-events: none; }
.reltoggle { position: absolute; left: 12px; top: 12px; }
.relarc { fill: none; stroke: #e9d8a6; stroke-width: 1.4; }
.relmark circle { fill: #0f1115; stroke: #e9d8a6; stroke-width: 1.2; }
.relmark text { font-size: 11px; font-weight: 600; fill: #e9d8a6; }
.relmark .rl { font-size: 10.5px; font-weight: 400; }

aside { border-left: 1px solid var(--border); overflow: auto; padding: 18px 20px 48px; background: var(--panel);
  font-size: 13.5px; line-height: 1.5; }
aside h2, .cmp-body h2 { font-size: 18px; margin: 2px 0 8px; font-weight: 600; }
aside h3, .cmp-body h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint);
  margin: 20px 0 8px; font-weight: 600; }
aside p, .cmp-body p { margin: 0 0 10px; color: #cfd2d7; }
aside ul, .cmp-body ul { margin: 0; padding: 0; list-style: none; }
aside li, .cmp-body li { margin: 0 0 8px; }
.kind { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.tradeoff { color: var(--muted); font-style: italic; }
.ref { background: none; border: 0; padding: 0; color: var(--text); cursor: pointer; font-weight: 500;
  border-bottom: 1px dotted var(--faint); }
.ref:hover { border-bottom-color: var(--text); }
.note { color: var(--muted); }
.cite { color: var(--faint); font-size: 12px; }
a.cite { text-decoration: underline; text-decoration-color: #3a3f4a; text-underline-offset: 2px; }
a.cite:hover { color: var(--text); text-decoration-color: currentColor; }
.origin { font-size: 12px; } .origin .k { color: var(--faint); margin-right: 8px; } .origin .note { font-size: 11.5px; }
.verify { font-size: 10.5px; color: #d9a35b; border: 1px solid #5c4630; border-radius: 4px; padding: 0 4px;
  margin-left: 4px; white-space: nowrap; }
.pills { display: flex; flex-wrap: wrap; gap: 5px; }
.pill { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 6px;
  padding: 2px 8px; font-size: 12px; cursor: pointer; }
.pill:hover { border-color: var(--faint); }
.pill.t { border-style: dashed; color: var(--muted); }
.glyph { display: inline-block; width: 14px; color: var(--faint); }
.try { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
.try:hover { border-color: var(--faint); }
.legend { display: grid; grid-template-columns: 34px 1fr; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.legend svg { display: block; }
.stage { border-left: 2px solid var(--c); padding: 2px 0 2px 10px; margin-bottom: 10px; }
.stage .n { color: var(--c); font-weight: 600; margin-right: 4px; }
.stage .pills { margin-top: 5px; }
.recipe-h { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
.recipe-h .sw { width: 10px; height: 10px; border-radius: 50%; }
.recipe-h b { font-size: 15px; }
.foot { margin-top: 26px; color: var(--faint); font-size: 11.5px; }
.back { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; font-size: 12px; margin-bottom: 10px; }
.back:hover { color: var(--text); }

/* SVG */
.node { cursor: pointer; }
.node text { font-size: 12.5px; font-weight: 500; fill: var(--text); pointer-events: none; }
.node text.fam { font-size: 13.5px; font-weight: 600; }
.node text.sub { font-size: 11px; font-weight: 400; fill: var(--muted); }
.node .state { transition: opacity .18s; }
.node .state.dim { opacity: .13; }
.node .state.soft { opacity: .38; }
.node .box { transition: stroke .15s, stroke-width .15s; }
.node.sel .box { stroke: #fff !important; stroke-width: 2; }
.node:hover .box { stroke-width: 2; }
.edge { fill: none; stroke-width: 1.25; }
.edge.t { stroke-dasharray: 4 4; }
.subarc { fill: none; stroke: #f2f2f2; stroke-width: 1.3; stroke-dasharray: 2 4; opacity: .8; }
.elabel text { font-size: 10.5px; fill: #d5d8dd; }
.elabel rect { fill: #0f1115; opacity: .92; }
.colhead { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; fill: var(--faint); }
.axislbl { font-size: 12px; font-weight: 600; fill: var(--muted); }
.axissub { font-size: 11px; fill: var(--faint); }
.quad { fill: #14171d; stroke: #262a33; }
.axis { stroke: #3a3f4a; stroke-width: 1; }
.caption { font-size: 11.5px; fill: var(--faint); font-style: italic; }
.tick { font-size: 11px; fill: var(--faint); }
.rmark { font-size: 11.5px; fill: var(--muted); }
.fadein { animation: fadein .5s ease both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.badge text { font-size: 10px; font-weight: 700; fill: #0f1115; }

/* Mechanism cards: one training step, drawn with the article figures' vocabulary */
.mech { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 6px 8px; }
.mech-h { font-size: 12.5px; color: var(--muted); padding: 0 6px 6px; min-height: 1.5em; }
.mech-h b { color: var(--text); font-weight: 600; }
.mech-h .n { color: var(--fc, var(--reward)); }
.mech svg { display: block; width: 100%; height: auto; }
.mech text { font-family: Inter, system-ui, sans-serif; }
.mech .mt { font-size: 12px; font-weight: 600; fill: var(--text); }
.mech .ms { font-size: 10.5px; fill: var(--muted); }
.mech .mtag { font-size: 8.5px; letter-spacing: .12em; fill: var(--muted); }
.mech .mnum { font-size: 10px; font-family: "IBM Plex Mono", Menlo, monospace; fill: #e8e8e8; text-anchor: middle;
  paint-order: stroke; stroke: #0f1115; stroke-width: 2.5px; }
.mech .mnum.dk { fill: #0f1115; stroke: none; font-weight: 600; }
.mech .off { fill: #6b7079; }
.mech .mdef { cursor: help; outline: none; }
.mech .mdef .dl { stroke: #5d626b; stroke-width: 1; stroke-dasharray: 1.5 2; }
.mech .mdef:hover .dl, .mech .mdef:focus-visible .dl, .mech .mdef.open .dl { stroke: var(--fc, var(--text)); }
.mech .mdef .hit { fill: transparent; }
.mech .mdef:focus-visible .hit { stroke: var(--fc, var(--text)); stroke-width: 1; }
[data-def].k { cursor: help; text-decoration: underline dotted #4d525a; text-underline-offset: 3px; }
#deftip { position: fixed; z-index: 60; max-width: 300px; padding: 8px 10px; background: #1a1d24; border: 1px solid #3a3f4a;
  border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.45); font-size: 12px; line-height: 1.45; color: #cfd2d7; pointer-events: none; }
#deftip[hidden] { display: none; }
#deftip p { margin: 0; }
#deftip p + p { margin-top: 6px; }
#deftip b { color: var(--text); font-weight: 600; }
.mech .mcode { font-size: 11px; font-weight: 700; font-family: Menlo, monospace; fill: #8c919a; text-anchor: middle; }
.mech-diff { list-style: none; padding: 0; margin: 8px 6px 0; min-height: 108px; font-size: 12px; }
.mech-diff li { margin: 0 0 3px; color: #cfd2d7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mech-diff .k { color: var(--faint); display: inline-block; width: 74px; }
.mech-diff .was { color: var(--faint); text-decoration: line-through; }
.mech-diff .now { color: var(--fc, var(--reward)); }
.mech-cap { font-size: 12px; margin-top: 8px !important; }
aside li.mech-sub { border-radius: 6px; padding: 3px 6px; margin: 0 -6px 4px; }
aside li.mech-sub:hover { background: var(--surface); }
/* Compare view: method cards side by side, slots aligned across columns */
.app { position: relative; }
.compare { position: absolute; inset: 0; z-index: 20; background: var(--bg); overflow: auto; padding: 16px 20px 28px; }
.compare[hidden] { display: none; }
.cmp-bar { display: flex; gap: 12px 18px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 18px; }
.cmp-intro { flex: 1 1 360px; }
.cmp-intro h2 { font-size: 18px; font-weight: 600; margin: 2px 0 6px; }
.cmp-intro p { margin: 0; font-size: 12.5px; color: var(--muted); max-width: 680px; line-height: 1.45; }
.cmp-close { background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 7px;
  padding: 5px 10px; cursor: pointer; font-size: 12.5px; }
.cmp-close:hover { color: var(--text); }
.cmp-cols { display: flex; gap: 14px; align-items: flex-start; }
.cmp-col { flex: 1 1 0; min-width: 240px; max-width: 360px; }
.cmp-col .mech { max-width: none; }
.cmp-h { display: flex; align-items: baseline; gap: 6px; width: 100%; background: none; border: 0; color: var(--text);
  padding: 0 4px 8px; cursor: pointer; text-align: left; font-size: 14.5px; }
.cmp-h .yr { color: var(--faint); font-size: 12px; }
.cmp-h .cmp-tag { margin-left: auto; font-size: 11.5px; color: var(--fc, var(--reward)); }
.cmp-col.ref .cmp-tag { color: var(--text); border: 1px solid var(--fc, var(--reward)); border-radius: 999px; padding: 0 7px; }
.cmp-col:not(.ref) .cmp-h:hover .cmp-tag::after { content: " · make reference"; color: var(--faint); }
.cmp-col.ref .mech { border-color: var(--fc, var(--reward)); }
.cmp-col .mech-diff { min-height: 0; }
.cmp-body { font-size: 12.5px; line-height: 1.45; padding: 12px 4px 0; }
.cmp-body h3 { margin-top: 16px; }
.cmp-body .tradeoff { color: var(--muted); }
.cmp-open { margin: 8px 4px 0; font-size: 12px; }
/* Profile strip: five questions every method answers, so cards from different families can be compared */
.prof-h { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0 6px 4px; }
.prof { list-style: none; padding: 0 0 8px; margin: 0 6px 8px; font-size: 12px; border-bottom: 1px solid var(--border); }
aside .prof li, .prof li { margin: 0 0 2px; color: #cfd2d7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prof .k { color: var(--faint); display: inline-block; width: 82px; }
.prof li.d { color: var(--fc, var(--text)); }
.prof li.s { color: var(--faint); }
.cmp-rel { font-size: 12px; margin-left: 4px; }
.cmp-intro .caveat { color: var(--faint); margin-top: 4px; }
/* Ways into the compare view */
.cmpbtn { margin-left: auto; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px;
  padding: 5px 11px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.cmpbtn:hover { border-color: var(--faint); }
.mech-h { display: flex; align-items: center; gap: 8px; }
.mech-h .mh { flex: 1; min-width: 0; }
.mech-cmp { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 2px 8px;
  font-size: 11.5px; cursor: pointer; white-space: nowrap; }
.mech-cmp:hover { color: var(--text); border-color: var(--fc, var(--faint)); }
.cmp-tabs { margin-bottom: 14px; display: inline-flex; }
.cmp-pairs { margin-top: 10px; }
.relmark.cmp { cursor: pointer; }
.relmark.cmp:hover circle { fill: #2a2615; }
/* Swap switcher inside a card: hover previews, click or tap pins (works on touch) */
.mech-sw { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 6px 10px; }
.mech-sw button { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 2px 8px;
  font-size: 11.5px; cursor: pointer; }
.mech-sw button:hover { color: var(--text); }
.mech-sw button.on { color: var(--text); border-color: var(--fc, var(--faint)); background: color-mix(in srgb, var(--fc, #888) 14%, transparent); }
.mech-sw button.pinned { box-shadow: inset 0 -2px 0 var(--fc, var(--faint)); }
/* Search */
.srchbtn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 5px 10px;
  font-size: 12.5px; cursor: pointer; white-space: nowrap; margin-left: auto; }
.srchbtn:hover { color: var(--text); border-color: var(--faint); }
.srchbtn kbd, .search-foot kbd { font: 11px/1 Menlo, monospace; color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; margin-left: 6px; }
.cmpbtn { margin-left: 0; }
.search { position: fixed; inset: 0; z-index: 50; background: rgba(5, 6, 8, .55); }
.search[hidden] { display: none; }
.search-box { width: min(580px, 92vw); margin: 9vh auto 0; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: hidden; }
.search-box input { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--border); color: var(--text);
  font: 15px Inter, system-ui, sans-serif; padding: 14px 16px; outline: none; }
.search-res { list-style: none; margin: 0; padding: 6px; max-height: 56vh; overflow: auto; }
.search-res button { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; background: none; border: 0;
  color: var(--text); padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 13.5px; }
.search-res button.act { background: var(--surface2); }
.search-res .sw { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
.search-res .sub { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-res .kd { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.search-res .empty { color: var(--muted); padding: 10px; font-size: 13px; }
.search-res .grp { color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; padding: 8px 10px 2px; }
.search-foot { color: var(--faint); font-size: 11.5px; padding: 8px 14px; border-top: 1px solid var(--border); }
/* Mix & match picker */
.cmp-mix { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; }
.cmp-mix .fam { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.cmp-mix .chip[disabled] { opacity: .4; cursor: not-allowed; }
.cmp-mix-note { color: var(--faint); font-size: 12px; margin-top: 6px; }
.tabsep { width: 1px; align-self: stretch; margin: 4px 3px; background: var(--border); }
@media (max-width: 860px) {
  .srchbtn kbd { display: none; }
  .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 42vh; }
  .resizer { display: none; }
  aside { border-left: 0; border-top: 1px solid var(--border); }
  .hint { display: none; }
  .recipes { flex-wrap: nowrap; overflow-x: auto; right: 12px; bottom: 8px; scrollbar-width: none; }
  .recipes .chip { flex: none; }
  .lensdesc { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>Post-training map</h1>
  <div class="tabs" id="tabs"></div>
  <div class="lensdesc" id="lensdesc"></div>
  <button class="srchbtn" id="srchbtn" title="Search (⌘K or /)">⌕ Search<kbd>⌘K</kbd></button>
  <button class="cmpbtn" id="cmpbtn" title="Compare update rules side by side">⇆ Compare methods</button>
</header>
<div class="app">
  <div class="canvas" id="canvas">
    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize the side panel" tabindex="0" title="Drag to resize · double-click to reset"></div>
    <svg id="map">
      <defs id="defs"><marker id="arr-lane" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#6b7079"/></marker></defs>
      <g id="vp">
        <g id="bg"></g>
        <g id="edges"></g>
        <g id="relarcs"></g>
        <g id="subarcs"></g>
        <g id="routes"></g>
        <g id="nodes"></g>
        <g id="overlay"></g>
        <g id="relmarks"></g>
        <g id="labels"></g>
      </g>
    </svg>
    <div class="hint">drag to pan · pinch or ⌘/ctrl-scroll to zoom</div>
    <button class="chip reltoggle" id="reltoggle" style="--c:#e9d8a6"><span class="sw" style="background:#e9d8a6"></span>≈ Show how methods relate</button>
    <div class="zoom">
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">−</button>
      <button id="zfit" title="Fit">⤢</button>
    </div>
    <div class="recipes" id="recipes"><span class="lbl">Recipes · up to 3</span></div>
  </div>
  <aside id="panel"></aside>
  <div class="compare" id="compare" hidden></div>
</div>
<div class="search" id="search" hidden role="dialog" aria-label="Search">
  <div class="search-box">
    <input id="sq" type="search" placeholder="Search methods, data, scorers, recipes, or names like RLHF and best-of-n" autocomplete="off" spellcheck="false">
    <ul class="search-res" id="sres"></ul>
    <div class="search-foot"><kbd>↑</kbd><kbd>↓</kbd> to move · <kbd>Enter</kbd> to open · <kbd>Esc</kbd> to close</div>
  </div>
</div>

<script>
/* ============================================================
   CONTENT
   Claims come from the building-blocks draft (cited keys) or the
   study notes. Items with v:true come from notes/…/later-ideas.md
   and are unverified.
   ============================================================ */

const CITE = {
  ouyang2022instructgpt: "Ouyang et al. 2022", deepseek2025r1: "DeepSeek-AI 2025", yue2025rlreasoning: "Yue et al. 2025",
  rafailov2023dpo: "Rafailov et al. 2023", lambert2024tulu3: "Lambert et al. 2024 (Tülu 3)", bai2022constitutional: "Bai et al. 2022",

// BFS; directOnly skips dashed edges and doesn't pass *through* trained scorers
function reach(id, dir, directOnly) {
  const seen = new Map([[id, 0]]); const q = [id];
  while (q.length) {
    const u = q.shift();
    if (directOnly && u !== id && byId[u].trained) continue;
    for (const e of (dir === "down" ? outE[u] : inE[u])) {
      if (e.type === "member2") continue;
      if (directOnly && e.s === "t") continue;
      const v = dir === "down" ? e.to : e.from;
      if (!seen.has(v)) { seen.set(v, seen.get(u) + 1); q.push(v); }
    }
  }
  return seen;
}

function layoutFlow() {
  const pos = {}, deco = [];

    const y0 = y; ids.forEach(id => { pos[id] = { x: X.method, y }; y += 38; });
    famY[f] = (y0 + y - 38) / 2; y += 26;
  });
  const H = y - 26 - 38;
  fams.forEach(f => pos["f-" + f] = { x: X.family, y: famY[f] });
  const dataOrder = [["d-demos", "d-revisions", "d-traj"], ["d-pairs", "d-ratings", "d-critiques", "d-steps", "d-rubrics"],
    ["d-tasks", "d-envs", "d-prompts", "d-rollouts"], ["d-teachertext", "d-teacherprobs"]];
  let dy = 0; const dp = [];

function place(pos, ids, cx, cy, cols, dx = 160, dy = 42) {
  const rows = Math.ceil(ids.length / cols);
  ids.forEach((id, i) => {
    const r = Math.floor(i / cols), c = i % cols;
    const nInRow = Math.min(cols, ids.length - r * cols);
    pos[id] = { x: cx + (c - (nInRow - 1) / 2) * dx, y: cy + (r - (rows - 1) / 2) * dy };
  });
}

const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const svg = $("map"), vp = $("vp");
const G = { bg: $("bg"), edges: $("edges"), relarcs: $("relarcs"), relmarks: $("relmarks"), subarcs: $("subarcs"), routes: $("routes"), nodes: $("nodes"), overlay: $("overlay"), labels: $("labels") };

const state = { lens: "flow", sel: null, alias: null, hover: null, recipes: [], showRel: false, compare: null };
const cur = {}; // id -> {x,y,o}
let view = { k: 1, tx: 0, ty: 0 };
let animating = false;

const mctx = document.createElement("canvas").getContext("2d");
const textW = (s, font) => { mctx.font = font; return mctx.measureText(s).width; };

function splitGradient(a, b) {
  const id = `g-${a}-${b}`;
  if (!$(id)) {
    const g = el("linearGradient", { id, x1: 0, x2: 1, y1: 0, y2: 0 }, $("defs"));
    [[0, a], [0.5, a], [0.5, b], [1, b]].forEach(([o, k]) => el("stop", { offset: o, "stop-color": COLORS[k] }, g));
  }
  return `url(#${id})`;
}

function buildNodes() {
  for (const n of NODES) {
    const fam = n.kind === "family", stg = n.kind === "stage";
    n.h = fam ? 44 : stg ? 40 : 28;
    const lw = textW(n.label, `${fam ? 600 : 500} ${fam ? 13.5 : 12.5}px Inter, system-ui, sans-serif`);
    const sw = n.sub ? textW(n.sub, "400 11px Inter, system-ui, sans-serif") : 0;
    n.w = Math.ceil(Math.max(lw, sw)) + (n.kind === "data" ? 32 : stg ? 30 : 26);
    const c = colorOf(n);
    const g = el("g", { class: "node", "data-id": n.id }, G.nodes);
    const s = el("g", { class: "state" }, g);
    const box = { x: -n.w / 2, y: -n.h / 2, width: n.w, height: n.h, class: "box" };
    if (stg) {
      // Fill encodes whose text: own fresh = filled, own in rounds = light + dashed, someone else's = outline
      const stroke = n.also ? splitGradient(n.group, n.also) : c;
      const fill = n.pol === "on" ? c + "38" : n.pol === "rounds" ? c + "18" : "#171a21";
      if (n.stacked) [8, 4].forEach(d => el("rect", { ...box, x: box.x + d, y: box.y - d, rx: 6, fill: "#171a21", stroke, "stroke-width": 1, opacity: 0.6, class: "" }, s));
      el("rect", { ...box, rx: 6, fill, stroke, "stroke-width": 1.5, ...(n.pol === "rounds" ? { "stroke-dasharray": "5 3" } : {}) }, s);
      el("text", { x: 0, y: -5, "text-anchor": "middle", "dominant-baseline": "central" }, s).textContent = n.label;
      // Strip encodes where feedback lands
      const x0 = -n.w / 2 + 12, x1 = n.w / 2 - 12, sy = n.h / 2 - 10;
      el("line", { x1: x0, y1: sy + 1.5, x2: x1, y2: sy + 1.5, stroke: c, "stroke-opacity": 0.3 }, s);
      if (n.at === "token") for (let x = x0; x <= x1; x += 4) el("rect", { x, y: sy, width: 2, height: 4, fill: c }, s);
      else if (n.at === "step") for (let k = 1; k <= 5; k++) el("rect", { x: x0 + (x1 - x0) * k / 5 - 2, y: sy - 1, width: 3, height: 6, fill: c }, s);
      else if (n.at === "response") el("rect", { x: x1 - 12, y: sy - 1, width: 12, height: 6, rx: 1, fill: c }, s);
      else el("circle", { cx: x1 - 3, cy: sy + 2, r: 3.5, fill: c }, s);
    } else if (n.kind === "source") el("rect", { ...box, rx: n.h / 2, fill: "#171a21", stroke: "#4a4f5a" }, s);
    else if (n.kind === "data") {
      el("rect", { ...box, rx: 5, fill: "#171a21", stroke: "#2f3440" }, s);
      el("rect", { x: -n.w / 2, y: -n.h / 2, width: 4, height: n.h, fill: c, rx: 1 }, s);
    } else if (n.kind === "scorer") el("rect", { ...box, rx: 5, fill: "#171a21", stroke: c, "stroke-dasharray": "3 2.5" }, s);
    else if (fam) el("rect", { ...box, rx: 8, fill: c + "26", stroke: c }, s);
    else el("rect", { ...box, rx: 5, fill: "#171a21", stroke: n.also ? splitGradient(n.group, n.also) : c, "stroke-width": n.also ? 1.6 : 1.3 }, s);
    if (stg) { /* label drawn above */ }
    else if (fam) {
      el("text", { class: "fam", x: 0, y: -7, "text-anchor": "middle", "dominant-baseline": "central" }, s).textContent = n.label;
      el("text", { class: "sub", x: 0, y: 10, "text-anchor": "middle", "dominant-baseline": "central" }, s).textContent = n.sub;
    } else {
      el("text", { x: n.kind === "data" ? 2 : 0, y: 0.5, "text-anchor": "middle", "dominant-baseline": "central" }, s).textContent = n.label;
    }
    g.addEventListener("click", ev => { ev.stopPropagation(); select(n.id); });
    g.addEventListener("pointerenter", () => { state.hover = n.id; refresh(); });
    g.addEventListener("pointerleave", () => { if (state.hover === n.id) { state.hover = null; refresh(); } });
    n.g = g; n.s = s;
  }
  for (const e of EDGES) {
    e.p = el("path", { class: "edge" + (e.s === "t" ? " t" : "") }, G.edges);
  }
}

function anchorPath(a, b, lr) {
  const A = cur[a.id], B = cur[b.id];
  let x1, y1, x2, y2, c1x, c1y, c2x, c2y;
  if (lr || Math.abs(B.x - A.x) > Math.abs(B.y - A.y)) {
    const sgn = B.x >= A.x ? 1 : -1;
    x1 = A.x + sgn * a.w / 2; y1 = A.y; x2 = B.x - sgn * b.w / 2; y2 = B.y;
    const dx = Math.max(30, Math.abs(x2 - x1) / 2) * sgn;
    c1x = x1 + dx; c1y = y1; c2x = x2 - dx; c2y = y2;
  } else {
    const sgn = B.y >= A.y ? 1 : -1;
    x1 = A.x; y1 = A.y + sgn * a.h / 2; x2 = B.x; y2 = B.y - sgn * b.h / 2;
    const dy = Math.max(20, Math.abs(y2 - y1) / 2) * sgn;
    c1x = x1; c1y = y1 + dy; c2x = x2; c2y = y2 - dy;
  }
  return { d: `M${x1},${y1} C${c1x},${c1y} ${c2x},${c2y} ${x2},${y2}`,
    mx: (x1 + 3 * c1x + 3 * c2x + x2) / 8, my: (y1 + 3 * c1y + 3 * c2y + y2) / 8 };
}

function rectExit(n, tx, ty) {
  const c = cur[n.id]; const dx = tx - c.x, dy = ty - c.y;
  if (!dx && !dy) return { x: c.x, y: c.y };
  const s = Math.min(Math.abs((n.w / 2 + 3) / (dx || 1e-9)), Math.abs((n.h / 2 + 3) / (dy || 1e-9)));
  return { x: c.x + dx * s, y: c.y + dy * s };
}

// ---- interaction-derived sets
let litNodes = null, litEdges = new Set(), adjEdges = new Set(), recipeUsed = null;

function computeSets() {
  litNodes = null; litEdges = new Set(); adjEdges = new Set();
  const focus = state.sel || state.hover;
  if (state.sel) {
    const up = reach(state.sel, "up", false), down = reach(state.sel, "down", false);
    litNodes = new Set([...up.keys(), ...down.keys()]);
    EDGES.forEach(e => {
      if ((up.has(e.from) && up.has(e.to)) || (down.has(e.from) && down.has(e.to))) litEdges.add(e);
    });
  } else if (state.alias) {
    const A = ALIAS_BY_ID[state.alias];
    litNodes = new Set(A.path);
    EDGES.forEach(e => { if (litNodes.has(e.from) && litNodes.has(e.to) && e.type !== "member2") litEdges.add(e); });
  } else if (state.hover) {
    litNodes = new Set([state.hover]);
    [...outE[state.hover], ...inE[state.hover]].forEach(e => { litEdges.add(e); litNodes.add(e.from); litNodes.add(e.to); });
  }
  if (focus) [...outE[focus], ...inE[focus]].forEach(e => adjEdges.add(e));
  if (focus) {
    // Pipeline stages sharing this update rule (for a stage), or using this method/scorer
    const match = stagesMatching(focus);
    if (match.length) { litNodes ||= new Set([focus]); match.forEach(s => litNodes.add(s.id)); }
  }
  recipeUsed = null;
  if (state.recipes.length) {
    recipeUsed = new Set();
    state.recipes.forEach(rid => RECIPE[rid].stages.forEach(st => [st.u, ...st.d, ...st.r].forEach(id => recipeUsed.add(id))));
  }
}

function refresh() {
  syncHash();
  computeSets();
  for (const n of NODES) {
    let cls = "state";
    if (litNodes) { if (!litNodes.has(n.id)) cls += state.sel || state.alias ? " dim" : " soft"; }
    else if (recipeUsed && !recipeUsed.has(n.id) && state.lens !== "pipes") cls += " soft";
    n.s.setAttribute("class", cls);
    n.g.classList.toggle("sel", n.id === state.sel);
  }
  frame();
  renderLabels();
}

function frame() {
  vp.setAttribute("transform", `translate(${view.tx},${view.ty}) scale(${view.k})`);
  const lr = state.lens === "flow";
  for (const n of NODES) {
    const c = cur[n.id];
    n.g.setAttribute("transform", `translate(${c.x},${c.y})`);
    n.g.setAttribute("opacity", c.o);
    n.g.style.pointerEvents = c.o > 0.5 ? "" : "none";
  }
  for (const e of EDGES) {
    const a = byId[e.from], b = byId[e.to];
    const vis = Math.min(cur[a.id].o, cur[b.id].o);
    const lit = litEdges.has(e);
    let op;
    if (lr) op = litNodes ? (lit ? (e.type === "make" ? 0.4 : 0.9) : 0.05) : (recipeUsed ? 0.1 : 0.3);
    else op = lit ? 0.9 : 0;
    op *= vis;
    if (op < 0.01) { e.p.setAttribute("opacity", 0); continue; }
    const { d, mx, my } = anchorPath(a, b, lr);
    e.mx = mx; e.my = my;
    e.p.setAttribute("d", d);
    e.p.setAttribute("opacity", op);
    e.p.setAttribute("stroke", lit ? (e.type === "make" ? "#b9bdc4" : colorOf(b.kind === "family" || b.kind === "method" ? b : (b.kind === "scorer" ? b : a))) : "#6b7079");
  }
  drawRelArcs();
  drawSubArcs();
  drawRoutes();
}

function drawRelArcs() {
  G.relarcs.innerHTML = ""; G.relmarks.innerHTML = "";
  const focus = state.sel || state.hover;
  for (const r of RELATIONS) {
    const on = r.from === focus || r.to === focus;
    if (!state.showRel && !on) continue;
    const a = byId[r.from], b = byId[r.to], A = cur[a.id], B = cur[b.id];
    if (Math.min(A.o, B.o) < 0.5) continue;
    let d, mx, my;
    if (Math.abs(A.x - B.x) < 30) {
      // same column: bulge left (substitute arcs bulge right)
      const x1 = A.x - a.w / 2, x2 = B.x - b.w / 2;
      const bx = Math.min(x1, x2) - 40 - Math.abs(A.y - B.y) * 0.15;
      d = `M${x1},${A.y} C${bx},${A.y} ${bx},${B.y} ${x2},${B.y}`;
      mx = (x1 + 6 * bx + x2) / 8; my = (A.y + B.y) / 2;
    } else {
      const cx0 = (A.x + B.x) / 2, cy0 = (A.y + B.y) / 2, dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1;
      const cx = cx0 + dy / L * 50, cy = cy0 - dx / L * 50;
      const p1 = rectExit(a, cx, cy), p2 = rectExit(b, cx, cy);
      d = `M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}`;
      mx = (p1.x + 2 * cx + p2.x) / 4; my = (p1.y + 2 * cy + p2.y) / 4;
    }
    const op = state.sel && !on ? 0.15 : on ? 0.95 : 0.55;
    el("path", { d, class: "relarc", opacity: op }, G.relarcs);

function drawSubArcs() {
  G.subarcs.innerHTML = "";
  const n = state.sel && byId[state.sel];
  if (!n || !n.subs) return;
  for (const [sid] of n.subs) {
    const m = byId[sid]; const A = cur[n.id], B = cur[sid];
    if (Math.min(A.o, B.o) < 0.5) continue;
    let d;
    if (Math.abs(A.x - B.x) < 30) {
      const bulge = 70 + Math.abs(A.y - B.y) * 0.18;
      const x1 = A.x + n.w / 2, x2 = B.x + m.w / 2;
      d = `M${x1},${A.y} C${Math.max(x1, x2) + bulge},${A.y} ${Math.max(x1, x2) + bulge},${B.y} ${x2},${B.y}`;
    } else {
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1;
      const cx = mx - dy / L * 40, cy = my + dx / L * 40;
      const p1 = rectExit(n, cx, cy), p2 = rectExit(m, cx, cy);
      d = `M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}`;
    }
    el("path", { d, class: "subarc" }, G.subarcs);
  }
}

function ensureMarker(r) {
  if ($("arr-" + r.id)) return;

function drawRoutes() {
  G.routes.innerHTML = ""; G.overlay.innerHTML = "";
  if (state.lens === "pipes") return drawLanes();
  const badgeSlots = {}, dotSlots = {};
  state.recipes.forEach((rid, ri) => {
    const r = RECIPE[rid]; ensureMarker(r);
    const fade = state.sel ? 0.35 : 1;
    const nums = {};
    const at = st => st.u;
    r.stages.forEach((st, i) => (nums[at(st)] ||= []).push(i + 1));
    for (let i = 0; i < r.stages.length - 1; i++) {
      const a = byId[at(r.stages[i])], b = byId[at(r.stages[i + 1])];
      if (a === b) continue;
      const A = cur[a.id], B = cur[b.id];
      if (Math.min(A.o, B.o) < 0.5) continue;
      let d;
      if (Math.abs(A.x - B.x) < 30) {
        // same column: arc out to the right so the route doesn't run through other nodes
        const x1 = A.x + a.w / 2 + 3, x2 = B.x + b.w / 2 + 3;
        const bx = Math.max(x1, x2) + 34 + ri * 22 + Math.abs(B.y - A.y) * 0.06;
        d = `M${x1},${A.y} C${bx},${A.y} ${bx},${B.y} ${x2 + 4},${B.y}`;
      } else {
        const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1;
        const off = (34 + ri * 16) * (i % 2 ? -1 : 1);
        const cx = mx - dy / L * off, cy = my + dx / L * off;
        const p1 = rectExit(a, cx, cy), p2 = rectExit(b, cx, cy);
        d = `M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}`;
      }
      el("path", { d, fill: "none", stroke: r.color, "stroke-width": 2,
        opacity: 0.85 * fade, "marker-end": `url(#arr-${r.id})` }, G.routes);
    }
    for (const [id, list] of Object.entries(nums)) {
      const n = byId[id], c = cur[id]; if (c.o < 0.5) continue;
      const k = (badgeSlots[id] = (badgeSlots[id] || 0) + 1) - 1;
      const txt = list.join("·"), w = Math.max(17, txt.length * 6.2 + 9);
      const g = el("g", { class: "badge", transform: `translate(${c.x + n.w / 2 - w / 2 + 4 - k * (w + 3)},${c.y - n.h / 2 - 2})`, opacity: fade }, G.overlay);
      el("rect", { x: -w / 2, y: -8.5, width: w, height: 17, rx: 8.5, fill: r.color }, g);
      el("text", { x: 0, y: 0.5, "text-anchor": "middle", "dominant-baseline": "central" }, g).textContent = txt;
    }
    const used = new Set(); r.stages.forEach(st => [...st.d, ...st.r].forEach(id => { if (!nums[id]) used.add(id); }));
    used.forEach(id => {
      const n = byId[id], c = cur[id]; if (c.o < 0.5) return;
      const k = (dotSlots[id] = (dotSlots[id] || 0) + 1) - 1;
      el("circle", { cx: c.x - n.w / 2 + 10 + k * 11, cy: c.y - n.h / 2, r: 4.5, fill: r.color, stroke: "#0f1115", "stroke-width": 1.5, opacity: fade }, G.overlay);
    });
  });
}

function drawLanes() {
  for (const r of RECIPES) {
    const lane = STAGES.filter(s => s.rid === r.id);
    for (let i = 0; i < lane.length - 1; i++) {
      const a = lane[i], b = lane[i + 1], A = cur[a.id], B = cur[b.id];
      const o = Math.min(A.o, B.o); if (o < 0.05) continue;
      el("line", { x1: A.x + a.w / 2 + (a.stacked ? 9 : 2), y1: A.y, x2: B.x - b.w / 2 - 4, y2: B.y,
        stroke: "#6b7079", "stroke-width": 1.4, opacity: o, "marker-end": "url(#arr-lane)" }, G.routes);
    }
    if (r.loop && lane.length > 1) {
      const a = lane[lane.length - 1], b = lane[0], A = cur[a.id], B = cur[b.id];
      const o = Math.min(A.o, B.o);
      if (o >= 0.05) {
        const y0 = A.y + a.h / 2 + 2, dip = A.y + a.h / 2 + 16;
        el("path", { d: `M${A.x},${y0} C${A.x},${dip + 6} ${B.x},${dip + 6} ${B.x},${B.y + b.h / 2 + 4}`, fill: "none",

function renderLabels() {

function renderDeco(deco) {

function fitFor(pos, deco) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (a, b, c, d) => { x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); };
  for (const id in pos) { const n = byId[id], p = pos[id]; add(p.x - n.w / 2, p.y - n.h / 2 - 12, p.x + n.w / 2, p.y + n.h / 2); }
  for (const d of deco) {
    if (d.t === "text") {
      const w = d.s.length * 6.3;
      const xa = d.anchor === "middle" ? d.x - w / 2 : d.anchor === "end" ? d.x - w : d.x;
      add(xa, d.y - 14, xa + w, d.y + 4);
    } else if (d.t === "rect") add(d.x, d.y, d.x + d.w, d.y + d.h);
    else if (d.t === "line") add(Math.min(d.x1, d.x2), d.y1 - 2, Math.max(d.x1, d.x2), d.y2 + 2);
  }
  // room on the right for substitute arcs and same-column recipe routes
  if (state.lens === "flow" || state.lens === "time") x1 += 110;
  const W = svg.clientWidth, H = svg.clientHeight - 56, pad = 36;
  const bw = x1 - x0 + pad * 2, bh = y1 - y0 + pad * 2;
  const k = Math.max(0.3, Math.min(W / bw, H / bh, 1.3));
  return { k, tx: (W - (x1 - x0) * k) / 2 - x0 * k, ty: (H - (y1 - y0) * k) / 2 - y0 * k + 4 };
}

let lastLayout = null;
function applyLens(id, animate = true) {
  state.lens = id;
  const { pos, deco } = LAYOUT[id]();
  if (state.sel && !pos[state.sel] && !(id === "pipes" && stagesMatching(state.sel).length)) {
    const n = byId[state.sel];
    state.sel = n && n.kind === "stage" && pos[n.u] ? n.u : null;
    if (P.firstChild) setTimeout(renderPanel);
  }
  if (P.firstChild && !state.sel) setTimeout(renderPanel);
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.lens === id));
  $("lensdesc").textContent = LENSES.find(l => l.id === id).desc;
  lastLayout = { pos, deco };
  renderDeco(deco);
  const target = {};
  for (const n of NODES) {
    const p = pos[n.id];
    const c = cur[n.id] || { x: p ? p.x : 0, y: p ? p.y : 0, o: 0 };
    target[n.id] = p ? { x: p.x, y: p.y, o: 1 } : { x: c.x, y: c.y, o: 0 };
  }
  const tv = fitFor(pos, deco);
  if (!animate) { Object.assign(cur, target); view = tv; refresh(); return; }
  tween(target, tv);
}

let raf = null;
function tween(target, tv, dur = 620) {
  const from = {}; for (const id in cur) from[id] = { ...cur[id] };
  const v0 = { ...view }; const t0 = performance.now();
  animating = true; G.labels.innerHTML = "";
  cancelAnimationFrame(raf);
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const step = now => {
    const t = Math.min(1, (now - t0) / dur), k = ease(t);
    for (const id in target) {
      const a = from[id], b = target[id];
      cur[id] = { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, o: a.o + (b.o - a.o) * k };
    }
    if (tv) view = { k: v0.k + (tv.k - v0.k) * k, tx: v0.tx + (tv.tx - v0.tx) * k, ty: v0.ty + (tv.ty - v0.ty) * k };
    frame();
    if (t < 1) raf = requestAnimationFrame(step);
    else { animating = false; refresh(); }
  };
  raf = requestAnimationFrame(step);
}

function renderStagePanel(n) {
  const r = RECIPE[n.rid];

  let h = `<button class="back" data-clear="1">← overview</button>

      <li><span class="note">Update:</span> ${nodeRef(n.u)}</li>
    </ul>

  const items = new Map();
  const add = (rr, at, stage, ref) => {
    const k = [...rr].sort().join(",") + "|" + at;
    if (!items.has(k)) items.set(k, { r: [...rr].sort(), at, stages: [], refs: [] });
    if (stage) items.get(k).stages.push(stage); else items.get(k).refs.push(ref);
  };
  STAGES.filter(s => s.u === n.u).forEach(s => add(s.r, s.at, s));
  LIT_CONFIGS.filter(l => l.u === n.u).forEach(l => add(l.r, l.at, null, l));
  if (items.size > 1) {
    const order = { token: 0, step: 1, response: 2, outcome: 3 };
    const list = [...items.values()].sort((a, b) => order[a.at] - order[b.at]);
    h += `<h3>How the scorer changes the feedback</h3>
      <p class="note">${byId[n.u].label} appears with different scorers. The update rule is the same on every line; the scorer decides where the feedback lands.</p>

  P.innerHTML = h;
}

function pillList(ids, dashed) {

function reachSplit(id, dir, kinds) {
  // A family's inputs are the union of its members' inputs (some data feeds a member directly)
  const starts = byId[id].kind === "family" && dir === "up"
    ? [id, ...outE[id].filter(e => e.type === "member").map(e => e.to)] : [id];
  const all = new Map(), direct = new Map();
  starts.forEach(s => { reach(s, dir, false).forEach((v, k) => all.set(k, v)); reach(s, dir, true).forEach((v, k) => direct.set(k, v)); });
  starts.forEach(s => { if (s !== id) { all.delete(s); direct.delete(s); } });
  const order = NODES.map(n => n.id);
  const keep = x => x !== id && kinds.includes(byId[x].kind);
  const d = order.filter(x => direct.has(x) && keep(x));
  const t = order.filter(x => all.has(x) && !direct.has(x) && keep(x));
  return { d, t };
}

function renderNodePanel(n) {
  if (n.kind === "stage") return renderStagePanel(n);
  P.innerHTML = nodePanelHTML(n);
}

// The panel's contents for a node. inCompare: a compare-view column, which has its own
// header and diagram, so it skips those and keeps the substitutes list as plain text.
function nodePanelHTML(n, inCompare, skipInputs) {
  const c = colorOf(n);
  const fam = n.group && n.group !== "neutral" ? ` · ${FAM_NAME[n.group]}${n.also ? " + " + FAM_NAME[n.also] : ""}` : "";
  let h = inCompare ? `<p>${n.summary}</p>` : `<button class="back" data-clear="1">← overview</button>
    <div class="kind" style="color:${n.kind === "source" ? "var(--muted)" : c}">${KIND[n.kind]}${n.kind === "family" ? "" : fam}${n.year ? " · " + n.year : ""}</div>
    <h2>${n.label}</h2><p>${n.summary}</p>`;
  if (n.tradeoff) h += `<p class="tradeoff">${n.tradeoff}</p>`;
  if (n.origin) h += originHTML(n.origin);
  const more = (n.cites || []).filter(k => !(n.origin || []).some(([o]) => o === k));
  if (more.length) h += `<p>${more.map(citeTxt).join(" · ")}</p>`;
  if (MECH[n.id] && !inCompare) h += mechSection(n);

  if ((n.kind === "method" || n.kind === "family") && !skipInputs) {
    const { d, t } = reachSplit(n.id, "up", ["data"]);
    h += `<h3>Data that can feed it</h3><p class="note" style="margin-bottom:6px">Directly:</p>${pillList(d)}
          <p class="note" style="margin:10px 0 6px">After a transformation:</p>${pillList(t, true)}`;
    const sc = reachSplit(n.id, "up", ["scorer"]);
    if (sc.d.length + sc.t.length) h += `<h3>Reward sources</h3>${pillList([...sc.d, ...sc.t])}`;
  }
  if (n.kind === "family") {
    h += `<h3>Update rules in this family</h3>${pillList(outE[n.id].filter(e => e.type === "member").map(e => e.to))}`;
    const also = outE[n.id].filter(e => e.type === "member2").map(e => e.to);
    if (also.length) h += `<p class="note" style="margin:10px 0 6px">Also partly in this family:</p>${pillList(also, true)}`;
  }
  if (n.also) {
    h += `<h3>Straddles two families</h3><p>Sits in ${FAM_NAME[n.group]} and ${FAM_NAME[n.also]}. See how it relates below.</p>`;
  }
  const rels = RELATIONS.filter(r => r.from === n.id || r.to === n.id);
  if (rels.length) {
    h += `<h3>How it relates</h3><ul>${rels.map(r => `<li><span class="glyph">≈</span>${nodeRef(r.from)} is ${r.rel} ${nodeRef(r.to)}: <span class="note">${r.text}</span> ${citeTxt(r.cite)}${relCanCmp(r)
      ? `<button class="ref cmp-rel" data-cmp-rel="${RELATIONS.indexOf(r)}">compare</button>` : ""}</li>`).join("")}</ul>`;
  }
  const inPipes = stagesMatching(n.id);
  if (inPipes.length) h += `<h3>In the pipelines</h3><div class="pills">${inPipes.map(s => stagePill(s.id)).join("")}</div>`;
  if (n.kind === "data" || n.kind === "scorer") {
    const { d, t } = reachSplit(n.id, "down", ["method"]);
    h += `<h3>Update rules it can drive</h3><p class="note" style="margin-bottom:6px">Directly:</p>${pillList(d)}
          <p class="note" style="margin:10px 0 6px">After a transformation:</p>${pillList(t, true)}`;
    const imm = outE[n.id].filter(e => e.via);
    if (imm.length) h += `<h3>How</h3><ul>${imm.map(e => `<li><span class="glyph">${e.s === "t" ? "◐" : "●"}</span>${nodeRef(e.to)} <span class="note">— ${e.via}</span></li>`).join("")}</ul>`;
    const src = inE[n.id].filter(e => e.type === "make").map(e => e.from);
    if (src.length) h += `<h3>Who makes it</h3>${pillList(src)}`;
    const ins = inE[n.id].filter(e => e.type !== "make");
    if (ins.length) h += `<h3>Built from</h3><ul>${ins.map(e => `<li><span class="glyph">${e.s === "t" ? "◐" : "●"}</span>${nodeRef(e.from)} <span class="note">— ${e.via}</span></li>`).join("")}</ul>`;
  }
  if (n.kind === "source") {
    h += `<h3>What it produces</h3>${pillList(outE[n.id].map(e => e.to))}`;
  }
  if (n.subs && (!MECH[n.id] || inCompare)) {
    h += `<h3>Substitutes, and what changes</h3><ul>${n.subs.map(([id, note]) => `<li>${nodeRef(id)} <span class="note">— ${note}</span></li>`).join("")}</ul>`;
  }
  if (n.effects) {
    h += `<h3>Effects on the model</h3><ul>${n.effects.map(([txt, key, v]) => `<li>${txt} ${citeTxt(key)}${v ? '<span class="verify">to verify</span>' : ""}</li>`).join("")}</ul>`;
  }
  const inR = RECIPES.filter(r => r.stages.some(st => st.u === n.id || st.d.includes(n.id) || st.r.includes(n.id)));
  if (inR.length) {
    h += `<h3>In recipes</h3><div class="pills">${inR.map(r => `<button class="chip${state.recipes.includes(r.id) ? " on" : ""}" style="--c:${r.color}" data-recipe="${r.id}"><span class="sw" style="background:${r.color}"></span>${r.name}</button>`).join("")}</div>`;
  }
  return h;
}

function renderRecipePanel() {
  let h = `<button class="back" data-clear-recipes="1">← overview</button>

      ? "The lanes on the left show only the recipes picked below; unpick them all to see every pipeline."

   ============================================================ */
function select(id) {
  state.sel = id; state.alias = null;
  // Stay in the pipelines lens if the selection shows up there via its stages
  const staysInStages = state.lens === "pipes" && id && byId[id] && stagesMatching(id).length > 0;
  if (id && byId[id] && (cur[id]?.o ?? 0) < 0.5 && !staysInStages) {
    const lens = ["flow", "pipes", "grid", "gran", "time"].find(l => LAYOUT[l]().pos[id]);
    if (lens && lens !== state.lens) applyLens(lens);
  }
  refresh(); renderPanel();
}

function toggleRecipe(rid) {
  state.sel = null; state.alias = null;   // whatever was clicked last owns the panel
  const i = state.recipes.indexOf(rid);
  if (i >= 0) state.recipes.splice(i, 1);
  else { state.recipes.push(rid); if (state.recipes.length > 3) state.recipes.shift(); }
  document.querySelectorAll("#recipes .chip").forEach(c => c.classList.toggle("on", state.recipes.includes(c.dataset.recipe)));
  if (state.lens === "pipes") applyLens("pipes"); // chips filter the lanes here
  refresh(); renderPanel();
}

const TRIES = {
  ratings: () => { if (state.lens !== "flow") applyLens("flow"); state.recipes = []; syncChips(); select("d-ratings"); },
  grpo: () => { if (state.lens !== "flow") applyLens("flow"); state.recipes = []; syncChips(); select("m-grpo"); },
  compare: () => { if (state.lens !== "flow") applyLens("flow"); state.sel = null; state.recipes = []; toggleRecipe("r1"); toggleRecipe("k3"); },
  opd: () => { applyLens("grid"); state.recipes = []; syncChips(); select("m-opd"); },
  stages: () => { state.sel = null; state.recipes = ["r1", "k3"]; syncChips(); applyLens("pipes"); refresh(); renderPanel(); },
  scorer: () => { state.recipes = []; syncChips(); applyLens("pipes"); select("p-r1-1"); },
  mech: () => { if (state.lens !== "flow") applyLens("flow"); state.recipes = []; syncChips(); select("m-grpo"); },
  cmp: () => { if (state.lens !== "flow") applyLens("flow"); state.recipes = []; syncChips(); select("f-reward"); openCompare("f-reward"); },
  relcmp: () => { if (state.lens !== "flow") applyLens("flow"); state.recipes = []; syncChips(); select("m-rs"); openRelCompare(RELATIONS.findIndex(r => r.from === "m-rs" && r.to === "m-reinforce")); },
  relate: () => { if (state.lens !== "flow") applyLens("flow"); state.recipes = []; syncChips(); setRel(true); select(null); },
};
function setRel(v) { state.showRel = v; $("reltoggle").classList.toggle("on", v); frame(); syncHash(); }
$("reltoggle").onclick = () => setRel(!state.showRel);
const syncChips = () => document.querySelectorAll("#recipes .chip").forEach(c => c.classList.toggle("on", state.recipes.includes(c.dataset.recipe)));

/* ============================================================
   MECHANISM CARDS
   One training step of an update rule, drawn with the same parts as
   the article's method figures: weights (network glyph; bright =
   trained), text (ruled cards; a stack = stored), numbers (chips),
   computation (plain box). Each family has one skeleton of rows;
   dashed rows are slots, the parts its methods choose differently,
   and a faint row is an empty slot. Hovering a substitute from the

const SB = s => `<tspan baseline-shift="sub" font-size="0.75em">${s}</tspan>`;

// ---- Definitions for the card's terms: hover, focus or tap a dotted label
const GLOSS = {
  policy: ["Policy", "The model being trained. The gradient changes only its weights."],
  frozen: ["Frozen", "Run during the step but never updated."],
  gradient: ["Gradient", "Which way to change the trained weights to lower the loss. The dashed line shows it flowing back only into models marked TRAINED."],
  loss: ["Loss", "The number training lowers. Its gradient says which way to change the weights."],
  logprob: ["Log-prob", "log π(y | x): how likely the model finds a response, the sum of its tokens' log-probabilities."],
  signal: ["Signal", "Which way each piece of text is pushed. Light means made more likely, hatched means made less likely; brighter means pushed harder."],
  reference: ["Reference model", "A frozen copy of the model from before this stage. The policy is measured against it to tell how far it has moved."],
  // scalar rewards
  samples: ["Samples", "How many responses the policy writes per prompt: one, or a group of G that can be compared with each other."],
  rollouts: ["Rollouts", "Responses the policy samples during training. With a group of G per prompt, the responses can serve as each other's baseline."],
  scorer: ["Scorer", "Whatever turns a response into a number: a reward model, an LLM judge, or a program that checks the answer."],
  reward: ["Reward r", "One number per response from the scorer. The same four rewards appear in every card so the methods can be compared."],
  baseline: ["Baseline b", "What each reward is compared against. Responses that beat it are pushed up and ones that fall short are pushed down. Subtracting it makes each step less noisy."],
  running: ["Running average", "The average reward over recent training steps. Cheap, but it doesn't know whether this prompt is easy or hard."],
  loo: ["Leave-one-out mean", "For each response, the mean reward of the other responses to the same prompt, so no response is compared against itself."],
  critic: ["Critic (value model)", "A second network, trained alongside the policy, that predicts the reward still to come from each point in the response. It gives every token its own advantage, at the cost of another model in memory."],
  groupnorm: ["Group mean ÷ std", "Subtract the mean reward of this prompt's G responses, then divide by their standard deviation. No critic needed, only several responses per prompt."],
  advantage: ["Advantage A", "How much better a response or token did than the baseline, A = r − b. Positive makes it more likely, negative less likely; the size sets how hard."],
  advnorm: ["Normalized advantage", "The advantage divided by the group's standard deviation, so a prompt whose rewards are bunched together gets as strong a signal as one whose rewards are spread out."],
  ratio: ["Probability ratio", "π_new / π_old for a token: how much more likely the current policy makes it than the policy that sampled it. It moves away from 1 when one batch of rollouts is reused for several gradient steps."],
  clip: ["Clipping", "Caps how far the probability ratio can move from 1 on one batch (often ±0.2), so one batch can't change the policy too much at once."],
  noclip: ["No clipping", "Each batch of rollouts is used for a single gradient step, so the policy that sampled it is the one being updated and there's no ratio to cap."],
  cliptok: ["Clip per token", "Each token's ratio is clipped on its own. Once a token's ratio leaves the range in the direction its advantage pushes, that token stops contributing gradient."],
  clipseq: ["Clip per sequence", "GSPO computes one ratio for the whole response (the geometric mean of its token ratios) and clips that, so the response is kept or dropped as a unit."],
  clipis: ["Clip the IS weights", "CISPO clips the importance-sampling weight and stops gradient through it, instead of dropping tokens whose ratio leaves the range. Every token keeps contributing; the clip only limits its weight."],
  kl: ["KL penalty", "A cost for drifting from the reference model, measured by the KL divergence between their next-token distributions. It keeps the policy near where it started, which limits how far it can go to exploit the scorer."],
  klreward: ["KL in the reward", "The penalty is subtracted from the reward before advantages are computed, as in InstructGPT-style PPO."],
  klloss: ["KL in the loss", "The penalty is a separate term added to the loss, as in GRPO, so it never mixes into the advantages."],
  kloptional: ["KL optional", "Often left out, especially with verifiable rewards. Dropping it also frees the reference model from memory."],
  // preferences
  pairs: ["Preference pair", "One prompt with two responses, one labeled chosen and one rejected."],
  unpaired: ["Good/bad labels", "KTO needs only a thumbs up or down on single responses, not two responses to the same prompt."],
  fresh: ["Fresh pairs", "Online DPO samples two new responses from the current policy each step and has a scorer pick the winner, so the pairs never go stale."],
  labeler: ["Labeler", "What decided which response is better: a person or model when the dataset was built, or a live scorer during training."],
  implied: ["Implied reward r̂", "These methods never train a reward model. A score computed from the policy's own log-probs plays that role, and the loss pushes the chosen response's score above the rejected one's."],
  logratio: ["Log-ratio to the reference", "log(π / π_ref): how much more likely the policy makes a response than the reference does. Raising it for chosen responses and lowering it for rejected ones is the whole update."],
  beta: ["β", "A scale on the implied reward. With a reference model, it sets how tightly the policy is held to it: smaller β lets it move further."],
  lennorm: ["Length-normalized", "SimPO scores a response by its average log-prob per token, with no reference model. Dividing by length stops a response from scoring differently just for being longer."],
  sigma: ["σ (sigmoid)", "Turns the score gap into a probability that the chosen response wins: the Bradley–Terry model, the same one reward models are trained with."],
  logistic: ["Logistic loss", "−log σ(gap). Large when the rejected response scores higher, and it keeps shrinking as the gap grows, so it never quite stops pushing the two apart."],
  squared: ["Squared loss (IPO)", "Pulls the gap toward a fixed target instead of pushing it wider forever, which keeps the policy from overfitting when the same response always wins."],
  prospect: ["Reference point (KTO)", "Each response is scored on its own against a reference point, an estimate of how far the policy has drifted from the reference. Good ones are pushed above it, bad ones below, and gains and losses can be weighted differently, as in prospect theory."],
  margin: ["Margin γ", "The chosen response has to beat the rejected one by at least γ before the loss gets small."],
  // demonstrations
  demos: ["Demonstrations", "Prompts paired with a response worth imitating, written by people or a stronger model before training starts."],
  ksamples: ["K samples", "Rejection sampling has the policy answer each prompt K times, then keeps only the best."],
  filter: ["Filter", "A grader that decides which samples to keep. Its scores pick the training data but never enter the loss, so every kept sample is pushed up the same way."],
  target: ["Target y*", "The text the policy is trained to reproduce, token by token."],
  nll: ["Next-token loss", "−Σ log π(y*_t): the negative log-probability of each target token given the ones before it. Every target token is pushed up, harder where the model found it surprising."],
  // teacher distributions
  teacher: ["Teacher", "A stronger model, kept frozen. It either writes the training text or grades the student's own text token by token."],
  student: ["Student", "The model being trained: the policy."],
  offline: ["Written once", "Offline distillation: the teacher's answers are generated ahead of time and reused, so the student learns from text it wouldn't have written itself."],
  onpolicy: ["On-policy", "Trained on text the model itself just wrote, so feedback lands on its own mistakes rather than someone else's."],
  fulldist: ["Full distribution", "Instead of only the teacher's sampled tokens, the student can match the teacher's whole next-token distribution (logit distillation). That needs the teacher's probabilities, not just its text."],
  opdreward: ["Per-token reward", "log p_T − log p_S at each token the student wrote: positive where the teacher finds the token likelier than the student does, negative where it finds it less likely. Maximizing it minimizes the reverse KL from student to teacher."],
  // the profile strip
  "p-who": ["Text by", "Who wrote the text the loss is computed on. When it's the policy, training is on-policy."],
  "p-judge": ["Judged by", "What decides how good that text is: a label in the data, a scorer, a filter, or a teacher."],
  "p-lands": ["Lands on", "How finely the feedback is spread: each token gets its own signal, or a whole response or pair shares one."],
  "p-dir": ["Push", "Whether the update only makes text more likely, or also makes some text less likely."],
  "p-extra": ["Also loaded", "Models held in memory besides the policy during training. Each one costs memory and compute."],
};

};
const MECH_CLIP = {

  token:   { t: "Clip each token's ratio", s: "caps one batch's push", k: "per token" },

// Advantages from the same rewards, so the baselines' differences are real numbers
function mechAdv(m) {
  if (m.samples === 1) {
    if (m.base === "critic") return { r: [0.7], tok: [0.12, 0.05, 0.3, -0.22, 0.08, 0.35, -0.12, 0.18] }; // illustrative
    return { r: [0.7], a: [0.7 - 0.5] };                                    // running average b = 0.5

  const r = MECH_R, n = r.length, sum = r.reduce((x, y) => x + y, 0), mean = sum / n;
  if (m.base === "loo") return { r, a: r.map(x => x - (sum - x) / (n - 1)) };

  return { r, a: r.map(x => (x - mean) / sd) };

function mechSVG(id, fromId) {

  const X0 = 30, X1 = 280, GX = 300, CX = 155, o = [];
  const T = (x, y, txt, cls, a = "start") => o.push(`<text class="${cls}" x="${x}" y="${y}" text-anchor="${a}">${txt}</text>`);

  };

  if (ev.key === "ArrowDown") { srchAct = Math.min(srchAct + 1, srchHits.length - 1); renderSearch(); ev.preventDefault(); }
  else if (ev.key === "ArrowUp") { srchAct = Math.max(srchAct - 1, 0); renderSearch(); ev.preventDefault(); }
  else if (ev.key === "Enter") { if (srchHits[srchAct]) goHit(srchHits[srchAct]); ev.preventDefault(); }
  else if (ev.key === "Escape") { closeSearch(); ev.stopPropagation(); ev.preventDefault(); }
});
SRES.addEventListener("click", ev => { const b = ev.target.closest("button[data-hit]"); if (b) goHit(srchHits[+b.dataset.hit]); });
SRCH.addEventListener("click", ev => { if (ev.target === SRCH) closeSearch(); });
document.addEventListener("keydown", ev => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); SRCH.hidden ? openSearch() : closeSearch(); }
  else if (ev.key === "/" && !typing && SRCH.hidden) { ev.preventDefault(); openSearch(); }
});

// A named combination: its own panel, and its path lit on the map
function openAlias(id) {
  if (state.compare) closeCompare();
  state.sel = null; state.recipes = []; syncChips(); state.alias = id;
  if (state.lens !== "flow") applyLens("flow");
  refresh(); renderPanel();
}
function renderAliasPanel() {
  const A = ALIAS_BY_ID[state.alias];
  P.innerHTML = `<button class="back" data-clear="1">← overview</button>
    <div class="kind" style="color:var(--reward)">A name for a combination of parts</div>
    <h2>${A.name}</h2><p class="note">${A.long}</p><p>${A.text}</p>${A.cite ? `<p>${citeTxt(A.cite)}</p>` : ""}
    <h3>The parts, lit on the map</h3>${pillList(A.path)}
    <h3>A recipe that uses it</h3><div class="pills">${recipeChip(A.recipe)}</div>`;
}

// ---- URL: the view lives in the hash, so it can be linked to and back/forward work
let hashLock = false, hashT = null;
const MIX_ORDER = () => CMP_FAMS.flatMap(f => FAM_MECH[f].order);
function hashFor() {
  const p = [];
  if (state.lens !== "flow") p.push("lens=" + state.lens);
  if (state.alias) p.push("q=" + state.alias);
  else if (state.sel) p.push("sel=" + state.sel);
  if (state.recipes.length) p.push("recipes=" + state.recipes.join(","));
  if (state.showRel) p.push("rel=1");
  const c = state.compare;
  if (c) p.push("cmp=" + (c.fam || (c.mix ? "mix" : "pair-" + c.rel)), "cols=" + c.ids.join(","), "ref=" + c.ref);
  return p.join("&");
}
function syncHash() {
  if (hashLock) return;
  clearTimeout(hashT);
  hashT = setTimeout(() => {                                  // one history entry per interaction, not per step
    const h = hashFor();
    if (h !== location.hash.slice(1)) history.pushState(null, "", h ? "#" + h : location.pathname + location.search);
  }, 0);
}
function applyHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  hashLock = true;
  try {
    const lens = p.get("lens") || "flow";
    if (LAYOUT[lens] && lens !== state.lens) applyLens(lens);
    if (p.get("rel") === "1" !== state.showRel) setRel(p.get("rel") === "1");
    const q = p.get("q"), sel = p.get("sel");
    state.recipes = (p.get("recipes") || "").split(",").filter(r => RECIPE[r]).slice(0, 3); syncChips();
    if (q && ALIAS_BY_ID[q]) { state.sel = null; state.alias = q; refresh(); renderPanel(); }
    else { state.alias = null; select(sel && byId[sel] ? sel : null); }
    const cmp = p.get("cmp"), cols = (p.get("cols") || "").split(",").filter(id => MECH[id] && !MECH[id].generic);
    if (cmp && cols.length) {
      let c;
      if (FAM_MECH[cmp]) c = { fam: cmp, ids: FAM_MECH[cmp].order.filter(x => cols.includes(x)) };
      else if (cmp.startsWith("pair-") && RELATIONS[+cmp.slice(5)]) c = { fam: null, rel: +cmp.slice(5), ids: cols };
      else c = { fam: null, mix: true, ids: MIX_ORDER().filter(x => cols.includes(x)) };
      c.ref = c.ids.includes(p.get("ref")) ? p.get("ref") : c.ids[0];
      state.compare = state.lastCompare = c; renderCompare();
    } else if (state.compare) closeCompare();
  } finally { hashLock = false; }
}
window.addEventListener("popstate", applyHash);

// ---- Mix & match: any methods, any family, compared on their profile strips
function openMix(ids) {
  const order = MIX_ORDER(), pick = order.filter(x => ids.includes(x)).slice(0, 4);
  state.compare = state.lastCompare = state.lastMix = { fam: null, mix: true, ids: pick, ref: ids.find(x => pick.includes(x)) || pick[0] };
  renderCompare();
}

P.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return;
  if ("mechPin" in t.dataset) {                              // pin a swap (a second tap on the pinned one unpins)
    const card = P.querySelector(".mech"), id = t.dataset.mechPin;
    card.dataset.pin = card.dataset.pin === id ? "" : id;
    card.dataset.show = "\u0000";                            // force a redraw
    return mechShow(card.dataset.pin || "__base");
  }
  if (t.dataset.compare) openCompare(t.dataset.compare);
  else if (t.dataset.cmpRel) openRelCompare(+t.dataset.cmpRel);
  else if (t.dataset.node) select(t.dataset.node);
  else if (t.dataset.recipe) toggleRecipe(t.dataset.recipe);
  else if (t.dataset.try) TRIES[t.dataset.try]();
  else if (t.dataset.clear) select(null);
  else if (t.dataset.clearRecipes) { state.recipes = []; syncChips(); refresh(); renderPanel(); }
});

// ---- pan / zoom
let drag = null;
svg.addEventListener("pointerdown", ev => {
  if (ev.target.closest(".node")) return;
  drag = { x: ev.clientX, y: ev.clientY, tx: view.tx, ty: view.ty, moved: false };
  svg.setPointerCapture(ev.pointerId); svg.classList.add("grabbing");
});
svg.addEventListener("pointermove", ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  view.tx = drag.tx + dx; view.ty = drag.ty + dy; frame();
});
svg.addEventListener("pointerup", () => {
  if (drag && !drag.moved && state.sel) select(null);
  drag = null; svg.classList.remove("grabbing");
  if (!animating) renderLabels();
});
function zoomAt(px, py, f) {
  const k2 = Math.max(0.25, Math.min(3, view.k * f));
  view.tx = px - (px - view.tx) * k2 / view.k; view.ty = py - (py - view.ty) * k2 / view.k; view.k = k2;
  frame(); renderLabels();
}
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  if (ev.ctrlKey || ev.metaKey) {
    const r = svg.getBoundingClientRect();
    zoomAt(ev.clientX - r.left, ev.clientY - r.top, Math.exp(-Math.max(-60, Math.min(60, ev.deltaY)) * 0.01));
  } else { view.tx -= ev.deltaX; view.ty -= ev.deltaY; frame(); }
}, { passive: false });
$("zin").onclick = () => zoomAt(svg.clientWidth / 2, svg.clientHeight / 2, 1.25);
$("zout").onclick = () => zoomAt(svg.clientWidth / 2, svg.clientHeight / 2, 0.8);
$("zfit").onclick = () => { if (lastLayout) tween(Object.fromEntries(NODES.map(n => [n.id, { ...cur[n.id] }])), fitFor(lastLayout.pos, lastLayout.deco), 400); };
document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape") return;
  if (!SRCH.hidden) closeSearch(); else if (state.compare) closeCompare(); else select(null);
});
// ---- resizable side panel
(() => {
  const app = document.querySelector(".app"), handle = $("resizer");
  const DEF = 420, MIN = 320, MAP_MIN = 360, KEY = "pt-explorer-panel-w";
  const clamp = w => Math.round(Math.max(MIN, Math.min(w, app.clientWidth - MAP_MIN)));
  const setW = w => { const v = clamp(w); app.style.setProperty("--panel-w", v + "px"); handle.setAttribute("aria-valuenow", v); return v; };
  const save = w => { try { localStorage.setItem(KEY, String(w)); } catch (e) {} };
  const refit = () => window.dispatchEvent(new Event("resize"));   // reuse the map's own refit
  let saved = null; try { saved = Number(localStorage.getItem(KEY)) || null; } catch (e) {}
  setW(saved || DEF);

  let drag = null;
  handle.addEventListener("pointerdown", ev => {
    ev.preventDefault(); ev.stopPropagation();
    handle.setPointerCapture(ev.pointerId);
    drag = { right: app.getBoundingClientRect().right };
    handle.classList.add("drag"); document.body.classList.add("resizing");
  });
  handle.addEventListener("pointermove", ev => { if (drag) setW(drag.right - ev.clientX); });
  const end = () => {
    if (!drag) return; drag = null;
    handle.classList.remove("drag"); document.body.classList.remove("resizing");
    save(parseInt(app.style.getPropertyValue("--panel-w"))); refit();
  };
  handle.addEventListener("pointerup", end);
  handle.addEventListener("pointercancel", end);
  handle.addEventListener("dblclick", () => { save(setW(DEF)); refit(); });
  handle.addEventListener("keydown", ev => {
    const step = ev.shiftKey ? 80 : 20, cur = parseInt(app.style.getPropertyValue("--panel-w")) || DEF;
    if (ev.key === "ArrowLeft") { save(setW(cur + step)); refit(); ev.preventDefault(); }
    else if (ev.key === "ArrowRight") { save(setW(cur - step)); refit(); ev.preventDefault(); }
  });
  // keep the width legal when the window shrinks
  window.addEventListener("resize", () => setW(parseInt(app.style.getPropertyValue("--panel-w")) || DEF));
})();

let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (lastLayout) { view = fitFor(lastLayout.pos, lastLayout.deco); frame(); renderLabels(); } }, 150); });

/* ============================================================
   INIT
   ============================================================ */
function init() {
  LENSES.forEach(l => {
    const b = document.createElement("button"); b.textContent = l.label; b.dataset.lens = l.id;
    b.onclick = () => { if (state.compare) closeCompare(); applyLens(l.id); };   // a lens click should never look dead
    if (l.id === "time") { const d = document.createElement("span"); d.className = "tabsep"; d.setAttribute("aria-hidden", "true"); $("tabs").appendChild(d); }
    $("tabs").appendChild(b);
  });
  RECIPES.forEach(r => {
    const b = document.createElement("button"); b.className = "chip"; b.dataset.recipe = r.id; b.style.setProperty("--c", r.color);
    b.innerHTML = `<span class="sw" style="background:${r.color}"></span>${r.name}`;
    b.onclick = () => toggleRecipe(r.id); $("recipes").appendChild(b);
  });
  buildNodes();
  applyLens("flow", false);
  renderPanel();
  if (location.hash.length > 1) applyHash();                 // arriving from a link
  history.replaceState(null, "", location.hash || location.pathname + location.search);
}
Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(init);
</script>
</body>
