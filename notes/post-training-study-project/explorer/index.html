<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post-training map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Themes. Every colour on the page, including the ones the script draws, is one of these tokens.
   Pick a theme with <html data-theme="graphite | black | solarized | light"> (see the theme script below),
   or override single tokens from a host page. */
:root {
  color-scheme: dark;
  /* chrome */
  --bg: #0f1115; --surface: #171a21; --surface2: #20242d; --panel: #12141a; --tip: #1a1d24;
  --border: #2a2f3a; --line-weak: #2f3440; --line: #3a3f4a; --line-strong: #4a4f5a;
  --quad: #14171d; --quad-line: #262a33;
  --scrim: rgba(5, 6, 8, .55); --shadow: rgba(0, 0, 0, .45);
  /* text */
  --text: #e8e8e8; --text-2: #cfd2d7; --ink-2: #b9bdc4; --muted: #9a9fa7; --faint: #6b7079;
  --sel: #fff; --on-accent: #0f1115;
  /* marks */
  --sub: #f2f2f2; --gold: #e9d8a6; --warn: #d9a35b; --warn-line: #5c4630;
  --demo: #6fbf8e; --pref: #e8b04a; --reward: #b48ad8; --teacher: #6aa2e0; --neutral: #8c919a;
  --r-instructgpt: #ff7a6b; --r-cai: #c77dff; --r-llama3: #48cae4; --r-r1: #4fd1c5; --r-qwen3: #f7e463; --r-k2: #ff8fd0;
  --r-olmo3: #9be15d; --r-glm45: #b08968; --r-k3: #f2f2f2; --r-glm5: #ddb892; --r-nemotron: #ffa95c;
}
:root[data-theme="black"] {
  --bg: #000; --surface: #0e0e0f; --surface2: #1b1b1d; --panel: #060606; --tip: #121213;
  --border: #232325; --line-weak: #262628; --line: #333336; --line-strong: #444448;
  --quad: #09090a; --quad-line: #1e1e20;
  --scrim: rgba(0, 0, 0, .6); --shadow: rgba(0, 0, 0, .6);
  --text: #ededed; --text-2: #cacaca; --ink-2: #b8b8b8; --muted: #999; --faint: #6c6c6e;
  --on-accent: #000;
}
:root[data-theme="solarized"] {   /* the site's dark theme: Solarized base03 background */
  --bg: #002b36; --surface: #073642; --surface2: #0c4352; --panel: #00252f; --tip: #073642;
  --border: #0f4756; --line-weak: #124b59; --line: #1e5866; --line-strong: #2d6775;
  --quad: #00303c; --quad-line: #0d4351;
  --scrim: rgba(0, 18, 23, .6); --shadow: rgba(0, 0, 0, .45);
  --text: #eee8d5; --text-2: #cfd0c3; --ink-2: #b6bfba; --muted: #93a1a1; --faint: #6f8a8f;
  --sel: #fdf6e3; --on-accent: #002b36;
  --sub: #eee8d5; --r-k3: #eee8d5;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #fff; --surface: #f5f5f5; --surface2: #e8e8e9; --panel: #fbfbfb; --tip: #fff;
  --border: #e0e0e2; --line-weak: #d9dadd; --line: #c7c9cd; --line-strong: #a7abb1;
  --quad: #f8f8f7; --quad-line: #e5e5e5;
  --scrim: rgba(20, 22, 26, .28); --shadow: rgba(0, 0, 0, .14);
  --text: #1c1e22; --text-2: #3b3e44; --ink-2: #4b4e55; --muted: #5d6168; --faint: #878b92;
  --sel: #000; --on-accent: #fff;
  --sub: #2a2d32; --gold: #9a7a14; --warn: #a3601a; --warn-line: #e5cba5;
  --demo: #2e8b57; --pref: #b7791f; --reward: #8a55c2; --teacher: #2f6fb8; --neutral: #7a7f87;
  --r-instructgpt: #dd4a39; --r-cai: #9a4fd8; --r-llama3: #0d8db3; --r-r1: #13948a; --r-qwen3: #9c8200; --r-k2: #d23f97;
  --r-olmo3: #47921a; --r-glm45: #8a6343; --r-k3: #2a2d32; --r-glm5: #a07a42; --r-nemotron: #db6c16;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: Inter, system-ui, -apple-system, sans-serif; }
body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
button { font: inherit; }

header { display: flex; align-items: center; gap: 14px 18px; padding: 10px 16px;
  border-bottom: 1px solid var(--border); flex-wrap: wrap; }
header h1 { font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; }
.tabs { display: flex; gap: 2px; background: var(--surface); padding: 3px; border-radius: 8px;
  border: 1px solid var(--border); flex-wrap: wrap; }
.tabs button { background: none; border: 0; color: var(--muted); padding: 5px 10px; border-radius: 6px;
  font-size: 12.5px; cursor: pointer; }
.tabs button:hover { color: var(--text); }
.tabs button.on { background: var(--surface2); color: var(--text); }
.lensdesc { color: var(--muted); font-size: 12.5px; flex: 1 1 280px; line-height: 1.4; }

.app { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w, 420px); min-height: 0; }
/* Drag the panel's left edge to resize it; double-click to reset */
.resizer { position: absolute; top: 0; right: 0; bottom: 0; width: 7px; cursor: ew-resize; z-index: 5; touch-action: none; }
.resizer::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 2px; background: transparent; transition: background .15s; }
.resizer:hover::after, .resizer:focus-visible::after, .resizer.drag::after { background: var(--faint); }
.resizer:focus { outline: none; }
body.resizing { cursor: ew-resize; user-select: none; }
body.resizing svg#map { pointer-events: none; }
.mech { max-width: 460px; }
.canvas { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
svg#map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; }
svg#map.grabbing { cursor: grabbing; }

.recipes { position: absolute; left: 12px; right: 60px; bottom: 12px; display: flex; gap: 6px;
  flex-wrap: wrap; align-items: center; pointer-events: none; }
.recipes > * { pointer-events: auto; }
.recipes .lbl { color: var(--faint); font-size: 11.5px; margin-right: 2px; pointer-events: none; }
.chip { border: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 92%, transparent); color: var(--muted);
  border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { color: var(--text); }
.chip .sw { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chip.on { color: var(--text); border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); }

.zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 32px; height: 32px; border-radius: 7px; border: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 92%, transparent); color: var(--muted); cursor: pointer; font-size: 15px; }
.zoom button:hover { color: var(--text); }
.hint { position: absolute; right: 54px; top: 18px; color: var(--faint); font-size: 11px; pointer-events: none; }
.reltoggle { position: absolute; left: 12px; top: 12px; }
.relarc { fill: none; stroke: var(--gold); stroke-width: 1.4; }
.relmark circle { fill: var(--bg); stroke: var(--gold); stroke-width: 1.2; }
.relmark text { font-size: 11px; font-weight: 600; fill: var(--gold); }
.relmark .rl { font-size: 10.5px; font-weight: 400; }

aside { border-left: 1px solid var(--border); overflow: auto; padding: 18px 20px 48px; background: var(--panel);
  font-size: 13.5px; line-height: 1.5; }
aside h2, .cmp-body h2 { font-size: 18px; margin: 2px 0 8px; font-weight: 600; }
aside h3, .cmp-body h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint);
  margin: 20px 0 8px; font-weight: 600; }
aside p, .cmp-body p { margin: 0 0 10px; color: var(--text-2); }
aside ul, .cmp-body ul { margin: 0; padding: 0; list-style: none; }
aside li, .cmp-body li { margin: 0 0 8px; }
.kind { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.tradeoff { color: var(--muted); font-style: italic; }
.ref { background: none; border: 0; padding: 0; color: var(--text); cursor: pointer; font-weight: 500;
  border-bottom: 1px dotted var(--faint); }
.ref:hover { border-bottom-color: var(--text); }
.note { color: var(--muted); }
.cite { color: var(--faint); font-size: 12px; }
a.cite { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }
a.cite:hover { color: var(--text); text-decoration-color: currentColor; }
.origin { font-size: 12px; } .origin .k { color: var(--faint); margin-right: 8px; } .origin .note { font-size: 11.5px; }
.verify { font-size: 10.5px; color: var(--warn); border: 1px solid var(--warn-line); border-radius: 4px; padding: 0 4px;
  margin-left: 4px; white-space: nowrap; }
.pills { display: flex; flex-wrap: wrap; gap: 5px; }
.pill { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 6px;
  padding: 2px 8px; font-size: 12px; cursor: pointer; }
.pill:hover { border-color: var(--faint); }
.pill.t { border-style: dashed; color: var(--muted); }
.glyph { display: inline-block; width: 14px; color: var(--faint); }
.try { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
.try:hover { border-color: var(--faint); }
.try-grp { font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
.try-ans { position: relative; background: var(--surface); border: 1px solid var(--border); border-left: 2px solid var(--gold);
  border-radius: 8px; padding: 10px 30px 10px 12px; margin: 4px 0 16px; font-size: 13px; line-height: 1.5; }
.try-ans .try-q { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.try-ans p { margin: 0 0 6px; color: var(--text); }
.try-ans ul { margin: 6px 0 8px; padding: 0; list-style: none; }
.try-ans li { margin: 0 0 5px; }
.try-x { position: absolute; top: 6px; right: 6px; background: none; border: 0; color: var(--faint); cursor: pointer;
  font-size: 12px; padding: 2px 6px; border-radius: 4px; }
.try-x:hover { color: var(--text); background: var(--surface2); }
.try-more { background: none; border: 0; padding: 0; color: var(--gold); cursor: pointer; font-size: 12.5px; }
.try-more:hover { text-decoration: underline; }
/* the section a Try answer points to: a gold bar in the panel's left gutter */
.tryhl { position: relative; }
.tryhl::before { content: ""; position: absolute; left: -11px; top: -3px; bottom: -3px; width: 2px; background: var(--gold); border-radius: 1px; }
.legend { display: grid; grid-template-columns: 34px 1fr; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.legend svg { display: block; }
.stage { border-left: 2px solid var(--c); padding: 2px 0 2px 10px; margin-bottom: 10px; }
.stage .n { color: var(--c); font-weight: 600; margin-right: 4px; }
.stage .pills { margin-top: 5px; }
.recipe-h { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
.recipe-h .sw { width: 10px; height: 10px; border-radius: 50%; }
.recipe-h b { font-size: 15px; }
.foot { margin-top: 26px; color: var(--faint); font-size: 11.5px; }
.back { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; font-size: 12px; margin-bottom: 10px; }
.back:hover { color: var(--text); }

/* SVG */
.node { cursor: pointer; }
.node text { font-size: 12.5px; font-weight: 500; fill: var(--text); pointer-events: none; }
.node text.fam { font-size: 13.5px; font-weight: 600; }
.node text.sub { font-size: 11px; font-weight: 400; fill: var(--muted); }
.node .state { transition: opacity .18s; }
.node .state.dim { opacity: .13; }
.node .state.soft { opacity: .38; }
.node .box { transition: stroke .15s, stroke-width .15s; }
.node.sel .box { stroke: var(--sel) !important; stroke-width: 2; }
.node:hover .box { stroke-width: 2; }
.edge { fill: none; stroke-width: 1.25; }
.edge.t { stroke-dasharray: 4 4; }
.subarc { fill: none; stroke: var(--sub); stroke-width: 1.3; stroke-dasharray: 2 4; opacity: .8; }
.elabel text { font-size: 10.5px; fill: var(--text-2); }
.elabel rect { fill: var(--bg); opacity: .92; stroke-width: .75; stroke-opacity: .7; }
.colhead { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; fill: var(--faint); }
.axislbl { font-size: 12px; font-weight: 600; fill: var(--muted); }
.axissub { font-size: 11px; fill: var(--faint); }
.quad { fill: var(--quad); stroke: var(--quad-line); }
.axis { stroke: var(--line); stroke-width: 1; }
.caption { font-size: 11.5px; fill: var(--faint); font-style: italic; }
.tick { font-size: 11px; fill: var(--faint); }
.rmark { font-size: 11.5px; fill: var(--muted); }
.fadein { animation: fadein .5s ease both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.badge text { font-size: 10px; font-weight: 700; fill: var(--on-accent); }

/* Mechanism cards: one training step, drawn with the article figures' vocabulary */
.mech { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 6px 8px; }
.mech-h { font-size: 12.5px; color: var(--muted); padding: 0 6px 6px; min-height: 1.5em; }
.mech-h b { color: var(--text); font-weight: 600; }
.mech-h .n { color: var(--fc, var(--reward)); }
.mech svg { display: block; width: 100%; height: auto; }
.mech text { font-family: Inter, system-ui, sans-serif; }
.mech .mt { font-size: 12px; font-weight: 600; fill: var(--text); }
.mech .ms { font-size: 10.5px; fill: var(--muted); }
.mech .mtag { font-size: 8.5px; letter-spacing: .12em; fill: var(--muted); }
.mech .mnum { font-size: 10px; font-family: "IBM Plex Mono", Menlo, monospace; fill: var(--text); text-anchor: middle;
  paint-order: stroke; stroke: var(--bg); stroke-width: 2.5px; }
.mech .mnum.dk { fill: var(--bg); stroke: none; font-weight: 600; }
.mech .off { fill: var(--faint); }
.mech .mdef { cursor: help; outline: none; }
.mech .mdef .dl { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 1.5 2; }
.mech .mdef:hover .dl, .mech .mdef:focus-visible .dl, .mech .mdef.open .dl { stroke: var(--fc, var(--text)); }
.mech .mdef .hit { fill: transparent; }
.mech .mdef:focus-visible .hit { stroke: var(--fc, var(--text)); stroke-width: 1; }
/* "In plain terms": the newcomer layer under a node's summary */
.pl { margin: 0 0 10px; }
.pl-h { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
.pl p { margin: 0 0 6px; }
.pl-more > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
.pl-more > summary:hover { color: var(--text); }
.ex { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; margin: 0 0 6px; font-size: 12.5px; }
.ex-r { display: grid; grid-template-columns: 76px 1fr; gap: 8px; padding: 3px 0; }
.ex-k { color: var(--faint); }
.ex-sep { border-top: 1px solid var(--border); margin: 4px 0; }
.ex .note { margin: 6px 0 2px; }
.pdef { cursor: help; text-decoration: underline dotted var(--line-strong); text-underline-offset: 3px; }
[data-def].k { cursor: help; text-decoration: underline dotted var(--line-strong); text-underline-offset: 3px; }
#deftip { position: fixed; z-index: 60; max-width: 300px; padding: 8px 10px; background: var(--tip); border: 1px solid var(--line);
  border-radius: 6px; box-shadow: 0 6px 20px var(--shadow); font-size: 12px; line-height: 1.45; color: var(--text-2); pointer-events: none; }
#deftip[hidden] { display: none; }
#deftip p { margin: 0; }
#deftip p + p { margin-top: 6px; }
#deftip b { color: var(--text); font-weight: 600; }
.mech .mcode { font-size: 11px; font-weight: 700; font-family: Menlo, monospace; fill: var(--neutral); text-anchor: middle; }
.mech-diff { list-style: none; padding: 0; margin: 8px 6px 0; min-height: 108px; font-size: 12px; }
.mech-diff li { margin: 0 0 3px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mech-diff .k { color: var(--faint); display: inline-block; width: 74px; }
.mech-diff .was { color: var(--faint); text-decoration: line-through; }
.mech-diff .now { color: var(--fc, var(--reward)); }
.mech-cap { font-size: 12px; margin-top: 8px !important; }
aside li.mech-sub { border-radius: 6px; padding: 3px 6px; margin: 0 -6px 4px; }
aside li.mech-sub:hover { background: var(--surface); }
/* Compare view: method cards side by side, slots aligned across columns */
.app { position: relative; }
.compare { position: absolute; inset: 0; z-index: 20; background: var(--bg); overflow: auto; padding: 16px 20px 28px; }
.compare[hidden] { display: none; }
.cmp-bar { display: flex; gap: 12px 18px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 18px; }
.cmp-intro { flex: 1 1 360px; }
.cmp-intro h2 { font-size: 18px; font-weight: 600; margin: 2px 0 6px; }
.cmp-intro p { margin: 0; font-size: 12.5px; color: var(--muted); max-width: 680px; line-height: 1.45; }
.cmp-close { background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 7px;
  padding: 5px 10px; cursor: pointer; font-size: 12.5px; }
.cmp-close:hover { color: var(--text); }
.cmp-cols { display: flex; gap: 14px; align-items: flex-start; }
.cmp-col { flex: 1 1 0; min-width: 240px; max-width: 360px; }
.cmp-col .mech { max-width: none; }
.cmp-h { display: flex; align-items: baseline; gap: 6px; width: 100%; background: none; border: 0; color: var(--text);
  padding: 0 4px 8px; cursor: pointer; text-align: left; font-size: 14.5px; }
.cmp-h .yr { color: var(--faint); font-size: 12px; }
.cmp-h .cmp-tag { margin-left: auto; font-size: 11.5px; color: var(--fc, var(--reward)); }
.cmp-col.ref .cmp-tag { color: var(--text); border: 1px solid var(--fc, var(--reward)); border-radius: 999px; padding: 0 7px; }
.cmp-col:not(.ref) .cmp-h:hover .cmp-tag::after { content: " · make reference"; color: var(--faint); }
.cmp-col.ref .mech { border-color: var(--fc, var(--reward)); }
.cmp-col .mech-diff { min-height: 0; }
.cmp-body { font-size: 12.5px; line-height: 1.45; padding: 12px 4px 0; }
.cmp-body h3 { margin-top: 16px; }
.cmp-body .tradeoff { color: var(--muted); }
.cmp-open { margin: 8px 4px 0; font-size: 12px; }
/* Profile strip: five questions every method answers, so cards from different families can be compared */
.prof-h { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0 6px 4px; }
.prof { list-style: none; padding: 0 0 8px; margin: 0 6px 8px; font-size: 12px; border-bottom: 1px solid var(--border); }
aside .prof li, .prof li { margin: 0 0 2px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prof .k { color: var(--faint); display: inline-block; width: 82px; }
.prof li.d { color: var(--fc, var(--text)); }
.prof li.s { color: var(--faint); }
.cmp-rel { font-size: 12px; margin-left: 4px; }
.cmp-intro .caveat { color: var(--faint); margin-top: 4px; }
/* Ways into the compare view */
.cmpbtn { margin-left: auto; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px;
  padding: 5px 11px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.cmpbtn:hover { border-color: var(--faint); }
.mech-h { display: flex; align-items: center; gap: 8px; }
.mech-h .mh { flex: 1; min-width: 0; }
.mech-cmp { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 2px 8px;
  font-size: 11.5px; cursor: pointer; white-space: nowrap; }
.mech-cmp:hover { color: var(--text); border-color: var(--fc, var(--faint)); }
.cmp-tabs { margin-bottom: 14px; display: inline-flex; }
.cmp-pairs { margin-top: 10px; }
.relmark.cmp { cursor: pointer; }
.relmark.cmp:hover circle { fill: color-mix(in srgb, var(--gold) 16%, var(--bg)); }
/* Swap switcher inside a card: hover previews, click or tap pins (works on touch) */
.mech-sw { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 6px 10px; }
.mech-sw button { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 2px 8px;
  font-size: 11.5px; cursor: pointer; }
.mech-sw button:hover { color: var(--text); }
.mech-sw button.on { color: var(--text); border-color: var(--fc, var(--faint)); background: color-mix(in srgb, var(--fc, var(--neutral)) 14%, transparent); }
.mech-sw button.pinned { box-shadow: inset 0 -2px 0 var(--fc, var(--faint)); }
/* Search */

<script>
/* Which theme. In order:
   1. ?theme=graphite|black|solarized|light in the URL (a host page pinning it; "dark" means solarized),
   2. inside a same-origin page that sets data-effective-theme on <html> (the site), follow that page live,
   3. the reader's last pick from the header menu,
   4. on the site, the site's own stored theme (light → light, dark → solarized),
   5. the OS preference.
   A host page can also switch it at any time: iframe.contentWindow.postMessage({ type: "pt-explorer:theme", theme }, "*"). */
(() => {
  const THEMES = ["graphite", "black", "solarized", "light"], ALIAS = { dark: "solarized" };
  const root = document.documentElement;
  const T = window.ptTheme = { THEMES, KEY: "pt-explorer-theme", hosted: false, onchange: null,
    set(t) { t = ALIAS[t] || t; if (!THEMES.includes(t)) return; root.dataset.theme = t; T.onchange && T.onchange(); } };
  const param = new URLSearchParams(location.search).get("theme");
  if (new URLSearchParams(location.search).get("embed") === "1") root.classList.add("embed");
  let host = null;
  try { if (window.parent !== window && window.parent.document.documentElement.dataset.effectiveTheme) host = window.parent.document.documentElement; } catch (e) {}
  if (param) { T.hosted = true; T.set(param); }
  else if (host) {
    T.hosted = true;
    const follow = () => T.set(host.dataset.effectiveTheme);
    follow();
    new MutationObserver(follow).observe(host, { attributes: true, attributeFilter: ["data-effective-theme"] });
  } else {
    // Standalone. On the site (served under /ideas/), a reader who hasn't picked a theme here gets the
    // site's: its stored light/dark/system choice (localStorage "theme"), mapped as for a host page.
    const onSite = location.pathname.startsWith("/ideas/");
    const pick = () => {
      let saved = null, site = null;
      try { saved = localStorage.getItem(T.KEY); site = localStorage.getItem("theme"); } catch (e) {}
      if (THEMES.includes(saved)) return saved;
      const light = site === "light" || site === "dark" ? site === "light" : matchMedia("(prefers-color-scheme: light)").matches;
      return light ? "light" : onSite ? "solarized" : "graphite";
    };
    T.set(pick());
    // follow the site's toggle from another tab, until the reader picks a theme here
    if (onSite) window.addEventListener("storage", ev => { if (ev.key === "theme" || ev.key === T.KEY) T.set(pick()); });
  }
  window.addEventListener("message", ev => {
    if (ev.data && ev.data.type === "pt-explorer:theme") { T.hosted = true; T.set(ev.data.theme); }
  });
})();
</script>

  // ---- Update rules (methods)
  { id: "m-sft", kind: "method", group: "demo", label: "SFT", year: 2021, pol: "off", dens: "dense", origin: [["wei2021flan", "instruction tuning"], ["ouyang2022instructgpt", "as the first stage of RLHF"]],
    summary: "Supervised fine-tuning: the pretraining objective on curated responses. Teaches format, and gets the model to where its own attempts are worth learning from, which is why it's the cold start for RL.",
    subs: [["m-rs", "Trains on the model's own filtered samples instead. Needs a grader; much closer to on-policy."],
           ["m-offdistill", "The same loss when a teacher wrote the data. Logit distillation also passes on the teacher's full distribution."],
           ["m-dpo", "Needs a worse response as well, but you only have to judge, not write."]],
    effects: [["R1-Zero, trained with RL straight from the base model, reasoned well but wrote hard-to-read output mixing languages. In R1, a small cold-start SFT stage plus a language-consistency reward during RL largely fixed it.", "deepseek2025r1"],
              ["SFT on another model's outputs copies style more than capability.", "gudibande2023false"],
              ["Narrow fine-tuning (insecure code) produced broadly misaligned behavior.", "betley2025emergent"],
              ["On a card game and a navigation task, RL generalized to unseen rule and visual variants while SFT tended to memorize, though SFT was still needed first to stabilize the output format.", "chu2025sftrl"]] },
  { id: "m-rs", kind: "method", group: "demo", also: "reward", label: "Rejection sampling", year: 2022, pol: "on", dens: "sparse", origin: [["anthony2017exit", ""], ["zelikman2022star", "on LLM reasoning"], ["touvron2023llama2", "popularized the name"]],
    summary: "Sample several candidates, keep the ones a grader likes, run SFT on the keepers. The grader picks the data but never enters the gradient. Trains on the model's own text with one pass/fail judgment per response, which puts it close to RL: STaR, ReST and expert iteration are versions of it. Usually run in batches or rounds, so it's only roughly on-policy.", cites: ["zelikman2022star"],
    subs: [["m-sft", "Imitates someone else's text; no grader needed, but the model never practices on its own outputs."],
           ["m-grpo", "Puts the scores in the gradient, so failures push probability down instead of just being dropped."],
           ["m-odpo", "Keeps the losers too, as the rejected side of pairs."]],
    effects: [["DeepSeek-R1 collected its RL checkpoint's best outputs, filtered by rules and a DeepSeek-V3 judge, and used them with general data to fine-tune a fresh copy of the base model rather than continuing from the RL checkpoint.", "deepseek2025r1"]] },
  { id: "m-dpo", kind: "method", group: "pref", label: "DPO", year: 2023, pol: "off", dens: "sparse", origin: [["rafailov2023dpo", ""]],
    summary: "Direct preference optimization: raise the chosen response's log-probability relative to the rejected one's, measured against a frozen reference model. No reward model, no sampling during training. Usually off-policy, but that depends on where the pairs come from.", cites: ["rafailov2023dpo"],
    subs: [["m-ppo", "The same pairs can train a reward model for PPO instead. RL is on-policy and learns from its own mistakes, at much higher cost."],
           ["m-ipo", "Regularized so it doesn't drive near-deterministic preferences to extremes."],
           ["m-kto", "Works from unpaired good/bad labels."],
           ["m-simpo", "Drops the reference model; length-normalized log-probability with a margin."],
           ["m-odpo", "Generates fresh pairs from the current model as training goes."]],
    effects: [["Olmo 3 ran the same RL from its SFT and its DPO checkpoints; the DPO start came out ahead at 7B (one run each).", "olmo2025olmo3"]] },
  { id: "m-ipo", kind: "method", group: "pref", label: "IPO", year: 2023, pol: "off", dens: "sparse", origin: [["azar2023ipo", ""]],
    summary: "Identity preference optimization: a DPO variant with a regularized objective, designed not to overfit when preferences are nearly deterministic.",
    subs: [["m-dpo", "Simpler and more common; can overfit when one response always wins."]] },
  { id: "m-kto", kind: "method", group: "pref", label: "KTO", year: 2024, pol: "off", dens: "sparse", origin: [["ethayarajh2024kto", ""]],
    summary: "Kahneman–Tversky optimization: learns from single responses labeled good or bad, with no pairing.",
    subs: [["m-dpo", "Needs matched pairs on the same prompt."]] },
  { id: "m-simpo", kind: "method", group: "pref", label: "SimPO", year: 2024, pol: "off", dens: "sparse", origin: [["meng2024simpo", ""]],
    summary: "Simple preference optimization: uses a response's average log-probability as the implicit reward, adds a margin, and needs no reference model.",
    subs: [["m-dpo", "Keeps a reference model in memory and anchors to it."]] },
  { id: "m-odpo", kind: "method", group: "pref", also: "reward", label: "Online DPO", year: 2024, pol: "on", dens: "sparse", origin: [["guo2024oaif", ""]],
    summary: "Generate fresh pairs from the current model and label them (with a reward model, a judge, a verifier, or people) as training goes. Sits between preference tuning and RL. (Tülu 3 is a halfway case: it builds some pairs from its own samples but trains on them offline.)", cites: ["guo2024oaif"],
    subs: [["m-dpo", "Fixed, offline pairs: cheaper, but the model never sees feedback on its current mistakes."],
           ["m-grpo", "Uses a scalar score per response directly instead of forming pairs."]] },
  { id: "m-reinforce", kind: "method", group: "reward", label: "REINFORCE", year: 1992, pol: "on", dens: "sparse", origin: [["williams1992reinforce", ""]],
    summary: "The basic policy gradient: raise each sampled response's log-probability in proportion to its reward minus a baseline.",
    subs: [["m-rloo", "A better baseline from the other samples for the same prompt."],

  { id: "m-rloo", kind: "method", group: "reward", label: "RLOO", year: 2019, pol: "on", dens: "sparse", origin: [["kool2019buy4", "the leave-one-out baseline"], ["ahmadian2024backtobasics", "on LLMs, as RLOO"]],
    summary: "REINFORCE leave-one-out: sample k responses per prompt; each one's baseline is the mean reward of the other k−1. No critic.", cites: ["ahmadian2024backtobasics"],
    subs: [["m-grpo", "Similar group baseline, plus clipping and normalizing by the group's spread."],
           ["m-reinforce", "Simpler baseline; noisier."]] },
  { id: "m-ppo", kind: "method", group: "reward", label: "PPO", year: 2017, pol: "on", dens: "sparse", origin: [["schulman2017ppo", ""]],
    summary: "Proximal policy optimization: a learned critic predicts a value at every token, which spreads one response-level reward into per-token advantages, and each token's update is clipped so one batch can't move the model too far. In RLHF it's usually paired with a per-token KL penalty toward the starting model. The classic RLHF optimizer.", cites: ["schulman2017ppo", "ouyang2022instructgpt"],
    subs: [["m-grpo", "Drops the critic for a group baseline. Saves a lot of memory and engineering, but needs several samples per prompt."],
           ["m-dpo", "Skips the reward model and sampling entirely if you have preference pairs; off-policy."]] },
  { id: "m-grpo", kind: "method", group: "reward", label: "GRPO", year: 2024, pol: "on", dens: "sparse", origin: [["shao2024deepseekmath", "introduced in DeepSeekMath"]],
    summary: "Group relative policy optimization: sample a group of responses per prompt and use the group's scores as the baseline. No critic. Spread fast after DeepSeek used it.", cites: ["shao2024deepseekmath"],
    subs: [["m-ppo", "Learned critic instead of a group baseline; one sample per prompt is enough."],
           ["m-rloo", "Leave-one-out mean as baseline, typically without clipping."],
           ["m-gspo", "Computes the ratio and clips per sequence instead of per token."],
           ["m-cispo", "Clips the importance weights; every token keeps contributing gradient."],
           ["m-opd", "A per-token signal from a teacher instead of one reward per response. Far denser, but needs a teacher that's already good."]],
    effects: [["Given many tries per problem, base models overtake their RL-trained versions.", "yue2025rlreasoning"],
              ["Policy entropy collapses during RL, limiting exploration.", "cui2025entropy"],
              ["RL forgets less of what the model already knew than SFT does.", "shenfeld2025razor"]] },
  { id: "m-gspo", kind: "method", group: "reward", label: "GSPO", year: 2025, pol: "on", dens: "sparse", origin: [["zheng2025gspo", ""]],
    summary: "Group sequence policy optimization: the importance ratio and clipping are computed for the whole sequence rather than each token.",
    subs: [["m-grpo", "Per-token ratios and clipping."]] },
  { id: "m-cispo", kind: "method", group: "reward", label: "CISPO", year: 2025, pol: "on", dens: "sparse", origin: [["minimax2025m1", ""]],
    summary: "Clips the importance-sampling weights (the correction for rollouts from a slightly older copy of the model) rather than the update itself, so every token still contributes to the gradient.",
    subs: [["m-grpo", "Clipping can zero out the gradient for some tokens entirely."]] },
  { id: "m-offdistill", kind: "method", group: "teacher", also: "demo", label: "Offline distillation", year: 2015, pol: "off", dens: "dense", origin: [["hinton2015distilling", "logit distillation"], ["kim2016seqkd", "sequence-level, SFT on teacher text"]],
    summary: "Train the student on text a teacher wrote (sequence-level), or on the teacher's token distributions over that text (logit distillation). Off-policy: the student never practices recovering from its own mistakes. GLM-4.5 consolidated its experts this way.", cites: ["glm2025glm45"],
    subs: [["m-opd", "The student writes and the teacher grades every token: dense and on-policy."],
           ["m-sft", "Identical when only the teacher's sampled text is used."]],
    effects: [["DeepSeek-R1 distilled into small dense models with plain SFT on about 800k R1 samples; at that scale this beat running large-scale RL on the small models directly.", "deepseek2025r1"]] },
  { id: "m-opd", kind: "method", group: "teacher", also: "reward", label: "On-policy distillation", year: 2023, pol: "on", dens: "dense", origin: [["gu2023minillm", ""], ["agarwal2023gkd", ""]],
    summary: "The student writes; a live teacher scores each token by how likely it would have been to write it. Dense like SFT, on-policy like RL. Formally close to policy gradient with a per-token reward: Kimi K3 uses the log ratio of teacher to student probability for each token as that reward.", cites: ["agarwal2023gkd", "lu2025onpolicy", "kimi2026k3"],
    subs: [["m-grpo", "One reward per response, but no teacher needed, so it can go beyond any existing model."],
           ["m-offdistill", "Cheaper to run, but off-policy."]],
    placement: ["Last in every pipeline here that uses it, because it needs a teacher that's already good. The teachers come from the stages before it: RL-trained specialists (Kimi K3, Nemotron 3 Ultra), the model's own earlier checkpoints (GLM-5), or the larger models of the same family (Qwen3).", "lu2025onpolicy"] },
];

// BFS; directOnly skips dashed edges and doesn't pass *through* trained scorers
function reach(id, dir, directOnly) {
  const seen = new Map([[id, 0]]); const q = [id];
  while (q.length) {
    const u = q.shift();
    if (directOnly && u !== id && byId[u].trained) continue;
    for (const e of (dir === "down" ? outE[u] : inE[u])) {
      if (e.type === "member2") continue;
      if (directOnly && e.s === "t") continue;
      const v = dir === "down" ? e.to : e.from;
      if (!seen.has(v)) { seen.set(v, seen.get(u) + 1); q.push(v); }
    }
  }
  return seen;
}

  });

  let dy = 0; const dp = [];
  dataOrder.forEach(g => { g.forEach(id => { dp.push([id, dy]); dy += 38; }); dy += 22; });

  pos["s-teacher"] = { x: X.scorer, y: famY.teacher };

   ["Learning signal", X.family], ["Update rule", X.method]]
    .forEach(([s, x]) => deco.push({ t: "text", x, y: hy, s, cls: "colhead", anchor: "middle" }));
  return { pos, deco };
}

function place(pos, ids, cx, cy, cols, dx = 160, dy = 42) {
  const rows = Math.ceil(ids.length / cols);
  ids.forEach((id, i) => {
    const r = Math.floor(i / cols), c = i % cols;
    const nInRow = Math.min(cols, ids.length - r * cols);
    pos[id] = { x: cx + (c - (nInRow - 1) / 2) * dx, y: cy + (r - (rows - 1) / 2) * dy };
  });
}

    const g = el("linearGradient", { id, x1: 0, x2: 1, y1: 0, y2: 0 }, $("defs"));
    [[0, a], [0.5, a], [0.5, b], [1, b]].forEach(([o, k]) => el("stop", { offset: o, "stop-color": COLORS[k] }, g));
  }
  return `url(#${id})`;
}

function buildNodes() {
  for (const n of NODES) {
    const fam = n.kind === "family", stg = n.kind === "stage";
    n.h = fam ? 44 : stg ? 40 : 28;
    const lw = textW(n.label, `${fam ? 600 : 500} ${fam ? 13.5 : 12.5}px Inter, system-ui, sans-serif`);
    const sw = n.sub ? textW(n.sub, "400 11px Inter, system-ui, sans-serif") : 0;
    n.w = Math.ceil(Math.max(lw, sw)) + (n.kind === "data" ? 32 : stg ? 30 : 26);
    const c = colorOf(n);
    const g = el("g", { class: "node", "data-id": n.id }, G.nodes);
    const s = el("g", { class: "state" }, g);
    const box = { x: -n.w / 2, y: -n.h / 2, width: n.w, height: n.h, class: "box" };
    if (stg) {
      // Fill encodes whose text: own fresh = filled, own in rounds = light + dashed, someone else's = outline
      const stroke = n.also ? splitGradient(n.group, n.also) : c;
      const fill = n.pol === "on" ? tint(c, 22) : n.pol === "rounds" ? tint(c, 9) : "var(--surface)";
      if (n.stacked) [8, 4].forEach(d => el("rect", { ...box, x: box.x + d, y: box.y - d, rx: 6, fill: "var(--surface)", stroke, "stroke-width": 1, opacity: 0.6, class: "" }, s));
      el("rect", { ...box, rx: 6, fill, stroke, "stroke-width": 1.5, ...(n.pol === "rounds" ? { "stroke-dasharray": "5 3" } : {}) }, s);
      el("text", { x: 0, y: -5, "text-anchor": "middle", "dominant-baseline": "central" }, s).textContent = n.label;
      // Strip encodes where feedback lands
      const x0 = -n.w / 2 + 12, x1 = n.w / 2 - 12, sy = n.h / 2 - 10;
      el("line", { x1: x0, y1: sy + 1.5, x2: x1, y2: sy + 1.5, stroke: c, "stroke-opacity": 0.3 }, s);
      if (n.at === "token") for (let x = x0; x <= x1; x += 4) el("rect", { x, y: sy, width: 2, height: 4, fill: c }, s);
      else if (n.at === "step") for (let k = 1; k <= 5; k++) el("rect", { x: x0 + (x1 - x0) * k / 5 - 2, y: sy - 1, width: 3, height: 6, fill: c }, s);
      else if (n.at === "response") el("rect", { x: x1 - 12, y: sy - 1, width: 12, height: 6, rx: 1, fill: c }, s);
      else el("circle", { cx: x1 - 3, cy: sy + 2, r: 3.5, fill: c }, s);
    } else if (n.kind === "source") el("rect", { ...box, rx: n.h / 2, fill: "var(--surface)", stroke: "var(--line-strong)" }, s);
    else if (n.kind === "data") {
      el("rect", { ...box, rx: 5, fill: "var(--surface)", stroke: "var(--line-weak)" }, s);
      el("rect", { x: -n.w / 2, y: -n.h / 2, width: 4, height: n.h, fill: c, rx: 1 }, s);
    } else if (n.kind === "scorer") el("rect", { ...box, rx: 5, fill: "var(--surface)", stroke: c, "stroke-dasharray": "3 2.5" }, s);
    else if (fam) el("rect", { ...box, rx: 8, fill: tint(c, 15), stroke: c }, s);
    else el("rect", { ...box, rx: 5, fill: "var(--surface)", stroke: n.also ? splitGradient(n.group, n.also) : c, "stroke-width": n.also ? 1.6 : 1.3 }, s);
    if (stg) { /* label drawn above */ }
    else if (fam) {
      el("text", { class: "fam", x: 0, y: -7, "text-anchor": "middle", "dominant-baseline": "central" }, s).textContent = n.label;
      el("text", { class: "sub", x: 0, y: 10, "text-anchor": "middle", "dominant-baseline": "central" }, s).textContent = n.sub;
    } else {
      el("text", { x: n.kind === "data" ? 2 : 0, y: 0.5, "text-anchor": "middle", "dominant-baseline": "central" }, s).textContent = n.label;
    }
    g.addEventListener("click", ev => { ev.stopPropagation(); clearGuide(); select(n.id); });
    g.addEventListener("pointerenter", () => { state.hover = n.id; refresh(); });
    g.addEventListener("pointerleave", () => { if (state.hover === n.id) { state.hover = null; refresh(); } });
    n.g = g; n.s = s;
  }
  for (const e of EDGES) {
    e.p = el("path", { class: "edge" + (e.s === "t" ? " t" : "") }, G.edges);
  }
}

function anchorPath(a, b, lr) {
  const A = cur[a.id], B = cur[b.id];
  let x1, y1, x2, y2, c1x, c1y, c2x, c2y;
  if (lr || Math.abs(B.x - A.x) > Math.abs(B.y - A.y)) {
    const sgn = B.x >= A.x ? 1 : -1;
    x1 = A.x + sgn * a.w / 2; y1 = A.y; x2 = B.x - sgn * b.w / 2; y2 = B.y;
    const dx = Math.max(30, Math.abs(x2 - x1) / 2) * sgn;
    c1x = x1 + dx; c1y = y1; c2x = x2 - dx; c2y = y2;
  } else {
    const sgn = B.y >= A.y ? 1 : -1;
    x1 = A.x; y1 = A.y + sgn * a.h / 2; x2 = B.x; y2 = B.y - sgn * b.h / 2;
    const dy = Math.max(20, Math.abs(y2 - y1) / 2) * sgn;
    c1x = x1; c1y = y1 + dy; c2x = x2; c2y = y2 - dy;
  }
  return { d: `M${x1},${y1} C${c1x},${c1y} ${c2x},${c2y} ${x2},${y2}`,
    mx: (x1 + 3 * c1x + 3 * c2x + x2) / 8, my: (y1 + 3 * c1y + 3 * c2y + y2) / 8, bz: [x1, y1, c1x, c1y, c2x, c2y, x2, y2] };
}

function rectExit(n, tx, ty) {
  const c = cur[n.id]; const dx = tx - c.x, dy = ty - c.y;
  if (!dx && !dy) return { x: c.x, y: c.y };
  const s = Math.min(Math.abs((n.w / 2 + 3) / (dx || 1e-9)), Math.abs((n.h / 2 + 3) / (dy || 1e-9)));
  return { x: c.x + dx * s, y: c.y + dy * s };
}

// ---- interaction-derived sets
let litNodes = null, litEdges = new Set(), adjEdges = new Set(), recipeUsed = null;

function computeSets() {
  litNodes = null; litEdges = new Set(); adjEdges = new Set();
  const focus = state.sel || state.hover;
  if (state.sel) {
    const up = reach(state.sel, "up", false), down = reach(state.sel, "down", false);
    litNodes = new Set([...up.keys(), ...down.keys()]);
    EDGES.forEach(e => {
      if ((up.has(e.from) && up.has(e.to)) || (down.has(e.from) && down.has(e.to))) litEdges.add(e);
    });
  } else if (state.alias) {
    const A = ALIAS_BY_ID[state.alias];
    litNodes = new Set(A.path);
    EDGES.forEach(e => { if (litNodes.has(e.from) && litNodes.has(e.to) && e.type !== "member2") litEdges.add(e); });
  } else if (state.hl) {
    // A highlight set: these parts and the edges among them. In the pipelines lens a part lights its stages.
    litNodes = new Set(state.hl);
    if (state.lens === "pipes") state.hl.forEach(id => byId[id].kind !== "stage" && stagesMatching(id).forEach(s => litNodes.add(s.id)));
    EDGES.forEach(e => { if (litNodes.has(e.from) && litNodes.has(e.to) && e.type !== "member2") litEdges.add(e); });
  } else if (state.hover) {
    litNodes = new Set([state.hover]);
    [...outE[state.hover], ...inE[state.hover]].forEach(e => { litEdges.add(e); litNodes.add(e.from); litNodes.add(e.to); });
  }
  if (focus) [...outE[focus], ...inE[focus]].forEach(e => adjEdges.add(e));
  if (focus) {
    // Pipeline stages sharing this update rule (for a stage), or using this method/scorer
    const match = stagesMatching(focus);
    if (match.length) { litNodes ||= new Set([focus]); match.forEach(s => litNodes.add(s.id)); }
  }
  recipeUsed = null;
  if (state.recipes.length) {
    recipeUsed = new Set();
    state.recipes.forEach(rid => RECIPE[rid].stages.forEach(st => [st.u, ...st.d, ...st.r].forEach(id => recipeUsed.add(id))));
  }
}

function refresh() {
  syncHash();
  computeSets();
  for (const n of NODES) {
    let cls = "state";
    if (litNodes) { if (!litNodes.has(n.id)) cls += state.sel || state.alias || state.hl ? " dim" : " soft"; }
    else if (recipeUsed && !recipeUsed.has(n.id) && state.lens !== "pipes") cls += " soft";
    n.s.setAttribute("class", cls);
    n.g.classList.toggle("sel", n.id === state.sel);
  }
  frame();
  renderLabels();
}

function frame() {
  vp.setAttribute("transform", `translate(${view.tx},${view.ty}) scale(${view.k})`);
  const lr = state.lens === "flow";
  for (const n of NODES) {
    const c = cur[n.id];
    n.g.setAttribute("transform", `translate(${c.x},${c.y})`);
    n.g.setAttribute("opacity", c.o);
    n.g.style.pointerEvents = c.o > 0.5 ? "" : "none";
  }
  for (const e of EDGES) {
    const a = byId[e.from], b = byId[e.to];
    const vis = Math.min(cur[a.id].o, cur[b.id].o);
    const lit = litEdges.has(e);
    let op;
    if (lr) op = litNodes ? (lit ? (e.type === "make" ? 0.4 : 0.9) : 0.05) : (recipeUsed ? 0.1 : 0.3);
    else op = lit ? 0.9 : 0;
    op *= vis;
    if (op < 0.01) { e.p.setAttribute("opacity", 0); continue; }
    const { d, mx, my, bz } = anchorPath(a, b, lr);
    e.mx = mx; e.my = my; e.bz = bz;
    e.p.setAttribute("d", d);
    e.p.setAttribute("opacity", op);
    e.p.style.stroke = (lit ? (e.type === "make" ? "var(--ink-2)" : colorOf(b.kind === "family" || b.kind === "method" ? b : (b.kind === "scorer" ? b : a))) : "var(--faint)");
  }
  drawRelArcs();
  drawSubArcs();
  drawRoutes();
}

function drawRelArcs() {
  G.relarcs.innerHTML = ""; G.relmarks.innerHTML = "";
  const focus = state.sel || state.hover;
  for (const r of RELATIONS) {
    const on = r.from === focus || r.to === focus;
    if (!state.showRel && !on) continue;
    const a = byId[r.from], b = byId[r.to], A = cur[a.id], B = cur[b.id];
    if (Math.min(A.o, B.o) < 0.5) continue;
    let d, mx, my;
    if (Math.abs(A.x - B.x) < 30) {
      // same column: bulge left (substitute arcs bulge right)
      const x1 = A.x - a.w / 2, x2 = B.x - b.w / 2;
      const bx = Math.min(x1, x2) - 40 - Math.abs(A.y - B.y) * 0.15;
      d = `M${x1},${A.y} C${bx},${A.y} ${bx},${B.y} ${x2},${B.y}`;
      mx = (x1 + 6 * bx + x2) / 8; my = (A.y + B.y) / 2;
    } else {
      const cx0 = (A.x + B.x) / 2, cy0 = (A.y + B.y) / 2, dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1;
      const cx = cx0 + dy / L * 50, cy = cy0 - dx / L * 50;
      const p1 = rectExit(a, cx, cy), p2 = rectExit(b, cx, cy);
      d = `M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}`;
      mx = (p1.x + 2 * cx + p2.x) / 4; my = (p1.y + 2 * cy + p2.y) / 4;
    }
    const op = state.sel && !on ? 0.15 : on ? 0.95 : 0.55;
    el("path", { d, class: "relarc", opacity: op }, G.relarcs);
    const can = relCanCmp(r);
    const m = el("g", { class: "relmark" + (can ? " cmp" : ""), transform: `translate(${mx},${my})`, opacity: op }, G.relmarks);
    if (can) {
      const i = RELATIONS.indexOf(r);
      el("title", {}, m).textContent = `Compare ${a.label} and ${b.label} side by side`;
      m.addEventListener("pointerdown", ev => ev.stopPropagation());   // don't start a pan
      m.addEventListener("click", ev => { ev.stopPropagation(); openRelCompare(i); });
    }
    el("circle", { r: 8 }, m);
    el("text", { x: 0, y: 0.5, "text-anchor": "middle", "dominant-baseline": "central" }, m).textContent = "≈";
    if (on && !animating) {
      const s = `${a.label} is ${r.rel} ${b.label}`, w = textW(s, "400 10.5px Inter, system-ui, sans-serif") + 10;
      el("rect", { x: -12 - w, y: -8, width: w, height: 16, rx: 3, fill: "var(--bg)", opacity: 0.92 }, m);
      el("text", { class: "rl", x: -17, y: 0.5, "text-anchor": "end", "dominant-baseline": "central" }, m).textContent = s;
    }
  }
}

function drawSubArcs() {
  G.subarcs.innerHTML = "";
  const n = state.sel && byId[state.sel];
  if (!n || !n.subs) return;
  for (const [sid] of n.subs) {
    const m = byId[sid]; const A = cur[n.id], B = cur[sid];
    if (Math.min(A.o, B.o) < 0.5) continue;
    let d;
    if (Math.abs(A.x - B.x) < 30) {
      const bulge = 70 + Math.abs(A.y - B.y) * 0.18;
      const x1 = A.x + n.w / 2, x2 = B.x + m.w / 2;
      d = `M${x1},${A.y} C${Math.max(x1, x2) + bulge},${A.y} ${Math.max(x1, x2) + bulge},${B.y} ${x2},${B.y}`;
    } else {
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1;
      const cx = mx - dy / L * 40, cy = my + dx / L * 40;
      const p1 = rectExit(n, cx, cy), p2 = rectExit(m, cx, cy);
      d = `M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}`;
    }
    el("path", { d, class: "subarc" }, G.subarcs);
  }
}

function ensureMarker(r) {
  if ($("arr-" + r.id)) return;
  const m = el("marker", { id: "arr-" + r.id, viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, $("defs"));
  el("path", { d: "M0,1 L9,5 L0,9 z", fill: r.color }, m);
}

function drawRoutes() {
  G.routes.innerHTML = ""; G.overlay.innerHTML = "";
  if (state.lens === "pipes") return drawLanes();
  const badgeSlots = {}, dotSlots = {};
  state.recipes.forEach((rid, ri) => {
    const r = RECIPE[rid]; ensureMarker(r);
    const fade = state.sel ? 0.35 : 1;
    const nums = {};
    const at = st => st.u;
    r.stages.forEach((st, i) => (nums[at(st)] ||= []).push(i + 1));
    for (let i = 0; i < r.stages.length - 1; i++) {
      const a = byId[at(r.stages[i])], b = byId[at(r.stages[i + 1])];
      if (a === b) continue;
      const A = cur[a.id], B = cur[b.id];
      if (Math.min(A.o, B.o) < 0.5) continue;
      let d;
      if (Math.abs(A.x - B.x) < 30) {
        // same column: arc out to the right so the route doesn't run through other nodes
        const x1 = A.x + a.w / 2 + 3, x2 = B.x + b.w / 2 + 3;
        const bx = Math.max(x1, x2) + 34 + ri * 22 + Math.abs(B.y - A.y) * 0.06;
        d = `M${x1},${A.y} C${bx},${A.y} ${bx},${B.y} ${x2 + 4},${B.y}`;
      } else {
        const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1;
        const off = (34 + ri * 16) * (i % 2 ? -1 : 1);
        const cx = mx - dy / L * off, cy = my + dx / L * off;
        const p1 = rectExit(a, cx, cy), p2 = rectExit(b, cx, cy);
        d = `M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}`;
      }
      el("path", { d, fill: "none", stroke: r.color, "stroke-width": 2,
        opacity: 0.85 * fade, "marker-end": `url(#arr-${r.id})` }, G.routes);
    }
    for (const [id, list] of Object.entries(nums)) {
      const n = byId[id], c = cur[id]; if (c.o < 0.5) continue;
      const k = (badgeSlots[id] = (badgeSlots[id] || 0) + 1) - 1;
      const txt = list.join("·"), w = Math.max(17, txt.length * 6.2 + 9);
      const g = el("g", { class: "badge", transform: `translate(${c.x + n.w / 2 - w / 2 + 4 - k * (w + 3)},${c.y - n.h / 2 - 2})`, opacity: fade }, G.overlay);
      el("rect", { x: -w / 2, y: -8.5, width: w, height: 17, rx: 8.5, fill: r.color }, g);
      el("text", { x: 0, y: 0.5, "text-anchor": "middle", "dominant-baseline": "central" }, g).textContent = txt;
    }
    const used = new Set(); r.stages.forEach(st => [...st.d, ...st.r].forEach(id => { if (!nums[id]) used.add(id); }));
    used.forEach(id => {
      const n = byId[id], c = cur[id]; if (c.o < 0.5) return;
      const k = (dotSlots[id] = (dotSlots[id] || 0) + 1) - 1;
      el("circle", { cx: c.x - n.w / 2 + 10 + k * 11, cy: c.y - n.h / 2, r: 4.5, fill: r.color, stroke: "var(--bg)", "stroke-width": 1.5, opacity: fade }, G.overlay);
    });
  });
}

function drawLanes() {
  for (const r of RECIPES) {
    const lane = STAGES.filter(s => s.rid === r.id);
    for (let i = 0; i < lane.length - 1; i++) {
      const a = lane[i], b = lane[i + 1], A = cur[a.id], B = cur[b.id];
      const o = Math.min(A.o, B.o); if (o < 0.05) continue;
      el("line", { x1: A.x + a.w / 2 + (a.stacked ? 9 : 2), y1: A.y, x2: B.x - b.w / 2 - 4, y2: B.y,
        stroke: "var(--faint)", "stroke-width": 1.4, opacity: o, "marker-end": "url(#arr-lane)" }, G.routes);
    }
    if (r.loop && lane.length > 1) {
      const a = lane[lane.length - 1], b = lane[0], A = cur[a.id], B = cur[b.id];
      const o = Math.min(A.o, B.o);
      if (o >= 0.05) {
        const y0 = A.y + a.h / 2 + 2, dip = A.y + a.h / 2 + 16;
        el("path", { d: `M${A.x},${y0} C${A.x},${dip + 6} ${B.x},${dip + 6} ${B.x},${B.y + b.h / 2 + 4}`, fill: "none",
          stroke: r.color, "stroke-width": 1.4, "stroke-dasharray": "4 3", opacity: o, "marker-end": "url(#arr-lane)" }, G.routes);
        const t = el("text", { x: (A.x + B.x) / 2, y: dip + 14, "text-anchor": "middle", class: "rmark", opacity: o }, G.routes);
        t.textContent = "↺ " + r.loop;
      }
    }
  }
}

function renderLabels() {
  G.labels.innerHTML = "";
  if (animating) return;
  const focus = state.sel || state.hover;
  const which = focus ? adjEdges : state.hl && state.labels ? litEdges : null;   // labels=1 names a highlight's edges
  if (!which) return;
  const todo = [...which].filter(e => e.via && litEdges.has(e) && e.bz && Math.min(cur[e.from].o, cur[e.to].o) >= 0.5);
  if (!todo.length) return;
  // A label should read as its own edge's, not a neighbouring box's or edge's. Where its edge is the only
  // lit one leaving its source (or entering its target), the label sits on the edge right against that
  // box: "Reward model ─[RLHF]─". Otherwise it slides along its own edge to the spot farthest from
  // every other lit edge, leaning toward the end the edge doesn't share: by the source when several
  // labelled edges meet at one target, by the target when one source fans out. Never onto a box or
  // another label.
  const at = (bz, t) => { const [x1, y1, ax, ay, bx, by, x2, y2] = bz, u = 1 - t;
    return { x: u * u * u * x1 + 3 * u * u * t * ax + 3 * u * t * t * bx + t * t * t * x2, y: u * u * u * y1 + 3 * u * u * t * ay + 3 * u * t * t * by + t * t * t * y2 }; };
  const visible = NODES.filter(n => cur[n.id].o > 0.5);
  const boxes = visible.filter(n => !litNodes || litNodes.has(n.id)).map(n => ({ id: n.id, x: cur[n.id].x, y: cur[n.id].y, w: n.w + 6, h: n.h + 4 }));
  const placed = [...boxes];
  const faint = visible.filter(n => litNodes && !litNodes.has(n.id)).map(n => ({ x: cur[n.id].x, y: cur[n.id].y, w: n.w, h: n.h }));
  const others = [...litEdges].filter(e => e.bz && e.p.getAttribute("opacity") > 0.2);
  const samples = new Map(others.map(e => [e, Array.from({ length: 25 }, (_, i) => at(e.bz, i / 24))]));
  const fanIn = {}, fanOut = {}, litIn = {}, litOut = {};
  todo.forEach(e => { fanIn[e.to] = (fanIn[e.to] || 0) + 1; fanOut[e.from] = (fanOut[e.from] || 0) + 1; });
  others.forEach(e => { litIn[e.to] = (litIn[e.to] || 0) + 1; litOut[e.from] = (litOut[e.from] || 0) + 1; });
  const sideways = e => e.bz[3] === e.bz[1] && e.bz[5] === e.bz[7];
  const anchored = e => sideways(e) && (litOut[e.from] === 1 || litIn[e.to] === 1);
  todo.sort((a, b) => anchored(b) - anchored(a));   // labels that can sit against a box claim their spot first
  const gap = (r, b) => Math.hypot(Math.max(Math.abs(b.x - r.x) - (b.w + r.w) / 2, 0), Math.max(Math.abs(b.y - r.y) - (b.h + r.h) / 2, 0));
  const over = (r, b) => Math.abs(b.x - r.x) < (b.w + r.w) / 2 && Math.abs(b.y - r.y) < (b.h + r.h) / 2;
  const overlap = (r, b) => Math.max(0, (b.w + r.w) / 2 - Math.abs(b.x - r.x)) * Math.max(0, (b.h + r.h) / 2 - Math.abs(b.y - r.y));
  for (const e of todo) {
    const w = textW(e.via, "400 10.5px Inter, system-ui, sans-serif") + 10, h = 16;
    const nIn = fanIn[e.to], nOut = fanOut[e.from];
    const pref = nIn > 1 && nOut > 1 ? 0.5 : nIn > 1 ? 0.22 : nOut > 1 ? 0.78 : 0.5;   // both ends shared: the middle
    const [x1, y1, , , , , x2, y2] = e.bz, dir = Math.sign(x2 - x1);
    const spots = [];   // [t, x, y, bonus]
    if (sideways(e) && litOut[e.from] === 1) spots.push([0, x1 + dir * (4 + w / 2), y1, 25]);
    if (sideways(e) && litIn[e.to] === 1) spots.push([1, x2 - dir * (4 + w / 2), y2, 25]);
    for (const dy of [0, 17, -17, 27, -27]) for (let t = 0.06; t < 0.95; t += 0.04) { const p = at(e.bz, t); spots.push([t, p.x, p.y + dy, -1.2 * Math.abs(dy)]); }
    let best = null, least = null;   // the best clear spot; failing that, the one covering the least
    for (const [t, sx, sy, bonus] of spots) {
      const r = { x: sx, y: sy, w, h };
      const covered = placed.reduce((a, b) => a + overlap(r, b), 0);
      if (covered) { if (!least || covered < least.covered) least = { ...r, covered }; continue; }
      let clear = 40;   // distance from the label to the nearest other lit edge, capped
      for (const [o, pts] of samples) {
        if (o === e) continue;
        for (const q of pts) {
          const d = Math.hypot(Math.max(Math.abs(q.x - r.x) - w / 2, 0), Math.max(Math.abs(q.y - r.y) - h / 2, 0));
          if (d < clear) clear = d;
        }
      }
      // right up against some other box, a label reads as that box's
      const near = Math.min(14, ...boxes.filter(b => b.id !== e.from && b.id !== e.to).map(b => gap(r, b)));
      const score = clear + bonus - 30 * Math.abs(t - pref) - (faint.some(b => over(r, b)) ? 12 : 0) - 2 * (14 - near);
      if (!best || score > best.score) best = { ...r, score };
    }
    const { x, y } = best || least;
    placed.push({ x, y, w: w + 4, h: h + 3 });   // keep a hair of space between labels
    const g = el("g", { class: "elabel", transform: `translate(${x},${y})` }, G.labels);
    const t = el("text", { x: 0, y: 0.5, "text-anchor": "middle", "dominant-baseline": "central" }, g);
    t.textContent = e.via;
    g.insertBefore(el("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 3, style: `stroke:${e.p.style.stroke}` }), t);
  }
}

function renderDeco(deco) {
  G.bg.innerHTML = "";
  for (const d of deco) {
    let e;
    if (d.t === "text") { e = el("text", { x: d.x, y: d.y, class: d.cls + " fadein", "text-anchor": d.anchor || "start" }, G.bg); e.textContent = d.s; }
    else if (d.t === "rect") e = el("rect", { x: d.x, y: d.y, width: d.w, height: d.h, class: d.cls + " fadein" }, G.bg);
    else if (d.t === "line") e = el("line", { x1: d.x1, y1: d.y1, x2: d.x2, y2: d.y2, class: d.cls + " fadein" }, G.bg);
    else if (d.t === "dot") e = el("circle", { cx: d.x, cy: d.y, r: 4.5, fill: d.c, class: "fadein" }, G.bg);
  }
}

function fitFor(pos, deco, roomRight = true) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (a, b, c, d) => { x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); };
  for (const id in pos) { const n = byId[id], p = pos[id]; add(p.x - n.w / 2, p.y - n.h / 2 - 12, p.x + n.w / 2, p.y + n.h / 2); }
  for (const d of deco) {
    if (d.t === "text") {
      const w = d.s.length * 6.3;
      const xa = d.anchor === "middle" ? d.x - w / 2 : d.anchor === "end" ? d.x - w : d.x;
      add(xa, d.y - 14, xa + w, d.y + 4);
    } else if (d.t === "rect") add(d.x, d.y, d.x + d.w, d.y + d.h);
    else if (d.t === "line") add(Math.min(d.x1, d.x2), d.y1 - 2, Math.max(d.x1, d.x2), d.y2 + 2);
  }
  // room on the right for substitute arcs and same-column recipe routes
  // (an embed needs it only when its view draws them: recipe routes, or a selection's substitutes)
  const arcs = !EMBED || state.recipes.length || byId[viewParams.get("sel")]?.subs;
  if (roomRight && arcs && (state.lens === "flow" || state.lens === "time")) x1 += 110;
  const legend = state.recipes.length && state.lens !== "pipes";   // an embed shows only the recipe legend
  const W = svg.clientWidth, H = svg.clientHeight - (EMBED ? (legend ? 40 : 8) : 56), pad = EMBED ? 18 : 36;   // 56: the recipe bar
  const bw = x1 - x0 + pad * 2, bh = y1 - y0 + pad * 2;
  const k = Math.max(EMBED ? 0.2 : 0.3, Math.min(W / bw, H / bh, 1.3));
  return { k, tx: (W - (x1 - x0) * k) / 2 - x0 * k, ty: (H - (y1 - y0) * k) / 2 - y0 * k + 4 };
}
// The view for the current lens: the whole layout, or just what zoom= names (node ids, kinds, or "hl"),
// with any column headings that sit over it
function fitView(pos, deco) {
  if (!state.zoom) return fitFor(pos, deco);
  const want = new Set();
  for (const z of state.zoom) {
    if (z === "hl") (state.hl || []).forEach(id => pos[id] && want.add(id));
    else if (pos[z]) want.add(z);
    else for (const id in pos) if (byId[id].kind === z) want.add(id);
  }
  if (!want.size) return fitFor(pos, deco);
  const sub = {}; let xa = Infinity, xb = -Infinity;
  want.forEach(id => { sub[id] = pos[id]; xa = Math.min(xa, pos[id].x - byId[id].w / 2); xb = Math.max(xb, pos[id].x + byId[id].w / 2); });
  const heads = deco.filter(d => d.t === "text" && d.cls === "colhead" && d.x >= xa - 1 && d.x <= xb + 1);
  // never frame tighter than about two columns, so a small set keeps some context around it
  let ya = Infinity, yb = -Infinity; want.forEach(id => { ya = Math.min(ya, pos[id].y); yb = Math.max(yb, pos[id].y); });
  const MW = 560, MH = 300, cx = (xa + xb) / 2, cy = (ya + yb) / 2;
  heads.push({ t: "rect", x: cx - Math.max(MW, xb - xa) / 2, y: cy - Math.max(MH, yb - ya) / 2, w: Math.max(MW, xb - xa), h: Math.max(MH, yb - ya) });
  return fitFor(sub, heads, want.size === Object.keys(pos).length || [...want].some(id => byId[id].kind === "method"));
}

let lastLayout = null;
function applyLens(id, animate = true) {
  state.lens = id; document.body.dataset.lens = id;
  if (state.tryOn) placeTry();                               // a Try answer belongs to the lens it landed in
  if (state.sel && PLAIN[state.sel] && P.firstChild) setTimeout(renderPanel);   // the plain-terms lead depends on the lens
  const { pos, deco } = LAYOUT[id]();
  if (state.sel && !pos[state.sel] && !(id === "pipes" && stagesMatching(state.sel).length)) {
    const n = byId[state.sel];
    state.sel = n && n.kind === "stage" && pos[n.u] ? n.u : null;
    if (P.firstChild) setTimeout(renderPanel);
  }
  if (P.firstChild && !state.sel) setTimeout(renderPanel);
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.lens === id));
  $("lensdesc").textContent = LENSES.find(l => l.id === id).desc;
  const decoKey = JSON.stringify(deco);
  if (!lastLayout || lastLayout.decoKey !== decoKey) renderDeco(deco);   // don't re-fade unchanged headings
  lastLayout = { pos, deco, decoKey };
  const target = {};
  const shown = n => !state.reveal || state.reveal.includes(n.kind);
  for (const n of NODES) {
    const p = pos[n.id];
    const c = cur[n.id] || { x: p ? p.x : 0, y: p ? p.y : 0, o: 0 };
    target[n.id] = p ? { x: p.x, y: p.y, o: shown(n) ? 1 : GHOST } : { x: c.x, y: c.y, o: 0 };
  }
  const tv = fitView(pos, deco);
  // an embed showing a fixed view (a figure) lands on it; one a host page drives moves between views
  if (!animate || REDUCED.matches || (EMBED && !driven)) { cancelAnimationFrame(raf); animating = false; Object.assign(cur, target); view = tv; refresh(); return; }
  tween(target, tv);
}

let raf = null;
function tween(target, tv, dur = 620) {
  const from = {}; for (const id in cur) from[id] = { ...cur[id] };
  const v0 = { ...view }; const t0 = performance.now();
  animating = true; G.labels.innerHTML = "";
  cancelAnimationFrame(raf);
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const step = () => {
    const now = performance.now();                           // not the frame stamp, which can predate t0
    const t = Math.max(0, Math.min(1, (now - t0) / dur)), k = ease(t);
    for (const id in target) {
      const a = from[id], b = target[id];
      cur[id] = { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, o: a.o + (b.o - a.o) * k };
    }
    if (tv) view = { k: v0.k + (tv.k - v0.k) * k, tx: v0.tx + (tv.tx - v0.tx) * k, ty: v0.ty + (tv.ty - v0.ty) * k };
    frame();
    if (t < 1) raf = requestAnimationFrame(step);
    else { animating = false; refresh(); }
  };
  raf = requestAnimationFrame(step);
}

const P = $("panel");
const nodeRef = id => `<button class="ref" data-node="${id}">${byId[id].label}</button>`;
const citeTxt = key => !key ? "" : CITE_URL[key]

const KIND = { source: "Source", data: "Data shape", scorer: "Reward source", family: "Learning signal", method: "Update rule", stage: "Pipeline stage" };
const AT_TEXT = { token: "every token gets its own signal", step: "each reasoning step is scored", response: "one judgment covers the whole response", outcome: "only the end result is checked" };

  "imitate": "Imitating text someone else wrote. Every token of the target is supervised.",
  "distill offline": "Imitating a stronger model's outputs: SFT where a teacher wrote the targets.",

};

function renderStagePanel(n) {
  const r = RECIPE[n.rid];
  const data = n.st.d.filter(x => byId[x].kind !== "source");
  let h = `<button class="back" data-clear="1">← overview</button>
    <div class="kind" style="color:${r.color}">${r.name} · stage ${n.i + 1} of ${r.stages.length}</div>
    <h2>${n.label}</h2>
    <p>${n.st.s}.</p>${PLAIN[n.id]?.role ? `<h3>Why this stage is here</h3>${plainVal(PLAIN[n.id].role)}` : ""}
    <h3>The parts</h3>
    <ul>
      <li><span class="note">Data:</span> ${data.length ? data.map(nodeRef).join(", ") : '<span class="note">not specified</span>'}</li>
      <li><span class="note">Scorer:</span> ${n.r.length ? n.r.map(nodeRef).join(", ") : '<span class="note">none; learns from the data directly</span>'}</li>

  const items = new Map();
  const add = (rr, at, stage, ref) => {
    const k = [...rr].sort().join(",") + "|" + at;
    if (!items.has(k)) items.set(k, { r: [...rr].sort(), at, stages: [], refs: [] });
    if (stage) items.get(k).stages.push(stage); else items.get(k).refs.push(ref);
  };
  STAGES.filter(s => s.u === n.u).forEach(s => add(s.r, s.at, s));
  LIT_CONFIGS.filter(l => l.u === n.u).forEach(l => add(l.r, l.at, null, l));
  if (items.size > 1) {
    const order = { token: 0, step: 1, response: 2, outcome: 3 };
    const list = [...items.values()].sort((a, b) => order[a.at] - order[b.at]);
    h += `<h3>How the scorer changes the feedback</h3>
      <p class="note">${byId[n.u].label} appears with different scorers. The update rule is the same on every line; the scorer decides where the feedback lands.</p>
      <ul>${list.map(it => {
        const who = it.r.length ? it.r.map(nodeRef).join(" + ") : `<span class="note">No scorer</span>`;
        const refs = it.refs.map(l => `<span class="note">${l.ref}</span> ${citeTxt(l.cite)}`).join("; ");
        return `<li>${who} → ${AT_TEXT[it.at]}.<div class="pills" style="margin-top:5px">${it.stages.map(s => stagePill(s.id)).join("")}</div>${refs ? `<div style="margin-top:4px">${refs}</div>` : ""}</li>`;
      }).join("")}</ul>`;
  }
  const same = STAGES.filter(s => s.u === n.u && s.rid !== n.rid);
  if (same.length && items.size <= 1) h += `<h3>Same update rule in other pipelines</h3><div class="pills">${same.map(s => stagePill(s.id)).join("")}</div>`;
  h += `<h3>This pipeline</h3><p style="color:${r.color}; margin-bottom:6px">${recipeShape(r)}</p><div class="pills">${STAGES.filter(s => s.rid === n.rid).map(s => stagePill(s.id)).join("")}</div>`;
  P.innerHTML = h;
}

function pillList(ids, dashed) {
  if (!ids.length) return `<span class="note">none</span>`;
  return `<div class="pills">${ids.map(id => `<button class="pill${dashed ? " t" : ""}" data-node="${id}">${byId[id].label}</button>`).join("")}</div>`;
}

function reachSplit(id, dir, kinds) {
  // A family's inputs are the union of its members' inputs (some data feeds a member directly)
  const starts = byId[id].kind === "family" && dir === "up"
    ? [id, ...outE[id].filter(e => e.type === "member").map(e => e.to)] : [id];
  const all = new Map(), direct = new Map();
  starts.forEach(s => { reach(s, dir, false).forEach((v, k) => all.set(k, v)); reach(s, dir, true).forEach((v, k) => direct.set(k, v)); });
  starts.forEach(s => { if (s !== id) { all.delete(s); direct.delete(s); } });
  const order = NODES.map(n => n.id);
  const keep = x => x !== id && kinds.includes(byId[x].kind);
  const d = order.filter(x => direct.has(x) && keep(x));
  const t = order.filter(x => all.has(x) && !direct.has(x) && keep(x));
  return { d, t };
}

  const more = (n.cites || []).filter(k => !(n.origin || []).some(([o]) => o === k));
  if (more.length) h += `<p>${more.map(citeTxt).join(" · ")}</p>`;
  if (n.placement && !inCompare) h += `<h3>Where it sits in a pipeline</h3><p>${n.placement[0]} ${citeTxt(n.placement[1])}</p>`;
  if (!inCompare) h += plainHTML(n);
  if (MECH[n.id] && !inCompare) h += mechSection(n);

    const { d, t } = reachSplit(n.id, "up", ["data"]);
    h += `<h3>Data that can feed it</h3><p class="note" style="margin-bottom:6px">Directly:</p>${pillList(d)}
          <p class="note" style="margin:10px 0 6px">After a transformation:</p>${pillList(t, true)}`;
    const sc = reachSplit(n.id, "up", ["scorer"]);
    if (sc.d.length + sc.t.length) h += `<h3>Reward sources</h3>${pillList([...sc.d, ...sc.t])}`;
  }
  if (n.kind === "family") {

  }
  const inPipes = stagesMatching(n.id);
  if (inPipes.length) h += `<h3>In the pipelines</h3><div class="pills">${inPipes.map(s => stagePill(s.id)).join("")}</div>`;
  if (n.kind === "data" || n.kind === "scorer") {
    const { d, t } = reachSplit(n.id, "down", ["method"]);
    h += `<h3>Update rules it can drive</h3><p class="note" style="margin-bottom:6px">Directly:</p>${pillList(d)}
          <p class="note" style="margin:10px 0 6px">After a transformation:</p>${pillList(t, true)}`;
    const imm = outE[n.id].filter(e => e.via);
    if (imm.length) h += `<h3>How</h3><ul>${imm.map(e => `<li><span class="glyph">${e.s === "t" ? "◐" : "●"}</span>${nodeRef(e.to)} <span class="note">— ${e.via}</span></li>`).join("")}</ul>`;
    const src = inE[n.id].filter(e => e.type === "make").map(e => e.from);
    if (src.length) h += `<h3>Who makes it</h3>${pillList(src)}`;
    const ins = inE[n.id].filter(e => e.type !== "make");
    if (ins.length) h += `<h3>Built from</h3><ul>${ins.map(e => `<li><span class="glyph">${e.s === "t" ? "◐" : "●"}</span>${nodeRef(e.from)} <span class="note">— ${e.via}</span></li>`).join("")}</ul>`;
  }
  if (n.kind === "source") {
    h += `<h3>What it produces</h3>${pillList(outE[n.id].map(e => e.to))}`;
  }
  if (n.subs && (!MECH[n.id] || inCompare)) {
    h += `<h3>Substitutes, and what changes</h3><ul>${n.subs.map(([id, note]) => `<li>${nodeRef(id)} <span class="note">— ${note}</span></li>`).join("")}</ul>`;
  }
  if (n.effects) {
    h += `<h3>Effects on the model</h3><ul>${n.effects.map(([txt, key, v]) => `<li>${txt} ${citeTxt(key)}${v ? '<span class="verify">to verify</span>' : ""}</li>`).join("")}</ul>`;
  }
  const inR = RECIPES.filter(r => r.stages.some(st => st.u === n.id || st.d.includes(n.id) || st.r.includes(n.id)));
  if (inR.length) {
    h += `<h3>In recipes</h3><div class="pills">${inR.map(r => `<button class="chip${state.recipes.includes(r.id) ? " on" : ""}" style="--c:${r.color}" data-recipe="${r.id}"><span class="sw" style="background:${r.color}"></span>${r.name}</button>`).join("")}</div>`;
  }
  return h;
}

function renderRecipePanel() {
  let h = `<button class="back" data-clear-recipes="1">← overview</button>
    <h2>${state.recipes.length > 1 ? "Recipes, side by side" : "Recipe"}</h2>
    <p class="note">Each stage written as its parts: which data, which signal, which update. ${state.lens === "pipes"
      ? "The lanes on the left show only the recipes picked below; unpick them all to see every pipeline."
      : "Numbers on the map mark the update rule at each stage; dots mark the data and reward sources it used."}</p>`;
  for (const rid of state.recipes) {
    const r = RECIPE[rid];
    h += `<div class="recipe-h"><span class="sw" style="background:${r.color}"></span><b>${r.name}</b><span class="cite">${r.year} · </span>${citeTxt(r.cite)}</div>
      <p style="margin:6px 0 4px; color:${r.color}">${recipeShape(r)}</p>
      <p class="note" style="margin:0 0 10px">${r.distinct}</p>`;
    r.stages.forEach((st, i) => {
      const parts = [st.u, ...st.d.filter(x => byId[x].kind !== "source"), ...st.r];
      h += `<div class="stage" style="--c:${r.color}"><span class="n">${i + 1}</span>${st.s}
        <div class="pills">${parts.map(id => `<button class="pill" data-node="${id}">${byId[id].label}</button>`).join("")}</div></div>`;
    });
  }
  h += `<p class="foot">Simplified from published reports; every recipe omits stages and details.</p>`;
  P.innerHTML = h;
}

/* ============================================================
   ACTIONS
   ============================================================ */
function select(id) {
  state.sel = id; state.alias = null;
  // Stay in the pipelines lens if the selection shows up there via its stages
  const staysInStages = state.lens === "pipes" && id && byId[id] && stagesMatching(id).length > 0;
  if (id && byId[id] && (cur[id]?.o ?? 0) < 0.5 && !staysInStages) {
    const lens = ["flow", "pipes", "grid", "gran", "time"].find(l => LAYOUT[l]().pos[id]);
    if (lens && lens !== state.lens) applyLens(lens);
  }
  refresh(); renderPanel();
}
// A reader's own click ends a guided view (hl/reveal/zoom from a link); relayout unless the caller will
function clearGuide(relayout = true) {
  if (!state.hl && !state.reveal && !state.zoom && !state.labels) return;
  const moved = state.reveal || state.zoom;
  state.hl = state.reveal = state.zoom = null; state.labels = false;
  if (moved && relayout) applyLens(state.lens);
}

function toggleRecipe(rid) {
  clearGuide();
  state.sel = null; state.alias = null;   // whatever was clicked last owns the panel
  const i = state.recipes.indexOf(rid);
  if (i >= 0) state.recipes.splice(i, 1);
  else { state.recipes.push(rid); if (state.recipes.length > 3) state.recipes.shift(); }
  document.querySelectorAll("#recipes .chip").forEach(c => c.classList.toggle("on", state.recipes.includes(c.dataset.recipe)));
  if (state.lens === "pipes") applyLens("pipes"); // chips filter the lanes here
  refresh(); renderPanel();
}

/* ---- In plain terms: the explanation a newcomer needs, beyond the one-line summary.

   { p, rows: [[label, text] | null], note } for a worked example (null rows draw a divider).

const PLAIN_FIELDS = {

  method: [["why", "Why it exists"], ["how", "How it works"], ["example", "What it trains on"], ["when", "When people pick it"], ["gives", "What it gives up"]],
  stage:  [["role", "Why this stage is here"]],
};
const PLAIN_LEAD = { flow: ["why", "io", "intuition", "example"], pipes: ["role", "when", "why"], grid: ["intuition", "gives", "why"],
  gran: ["example", "io", "limits"], time: ["why"] };
const PLAIN = {

    fails: ["It's a learned guess, and RL searches hard for wherever the guess is wrong. Reward models pick up shortcuts, such as favoring longer answers, and a policy trained against one learns to exploit them. That's why RLHF keeps a [[kl|KL penalty]] tying the policy to its [[reference|reference model]], and why some pipelines retrain the reward model in rounds as the policy changes.", "singhal2023length"],
