  "src-experts": {"example": {"p": "People hired for what they know, such as a pharmacologist or a senior engineer. One expert can turn the same judgment into several kinds of data.", "rows": [["Rating", "Reads summaries A to D of a drug study and scores them 5, 4, 2 and 1."], ["Critique", "On C: “The study was in mice. ‘Proves’ and ‘reverses’ claim far more than it found.”"], ["Rubric", "Says the study was in mice. Matches the paper's hedging. Invents no numbers."]], "note": "The rubric is the one that scales: a model judge can apply it to summaries the expert never reads."}, "good": "Judgment nobody else can supply. A crowdworker can't tell whether a summary overstates a pharmacology result, and a program can't check it at all. Experts also build the parts that get reused, like rubrics, graders and whole environments, which go on to score far more responses than the expert could ever read.", "limits": "Expert time is slow and expensive, and it doesn't grow with the training run. RL wants many scored attempts per prompt, far more than anyone could read, so experts rarely score rollouts live. Their judgment reaches training through a stand-in, such as a reward model, a rubric or a grader, and it's only as good as that stand-in."},
  "src-programs": {"example": {"rows": [["Generator", "Makes problems like “What is 4,817 × 362?” and computes the answer key itself."], ["Tests", "Runs the model's is_palindrome function on “racecar” and “ab” and checks it returns True, then False."], ["Environment", "A sandbox with files and a shell, plus a script that checks afterwards whether the right file changed."]], "note": "No person reads the model's answer. The program already knows what right looks like."}, "good": "Exact checks at almost no cost, as many times as training needs. That's what makes RL with verifiable rewards (RLVR) practical: a program can grade millions of rollouts, and a wrong answer fails no matter how confidently it's written. Programs can also label reasoning steps automatically, by checking whether a step can still lead to the right answer.", "limits": ["Only what can be checked gets rewarded, which pulls training toward math and code and away from writing or judgment. Generated problems share a template, so a model can learn the template instead of the skill. And a check only tests what it tests: in coding RL, models have learned to make tests pass by special-casing the inputs or editing the tests.", "baker2025monitoring"]},
  "src-self": {"example": {"p": "During RL the model being trained writes its own data: several attempts at each prompt, which a scorer then grades.", "rows": [["Prompt", "Summarize this paper accurately."], ["Attempt 1", "Summary A, scored 5/5"], ["Attempt 2", "Summary C, scored 2/5"], ["Attempt 3", "Summary D, scored 1/5"]], "note": "Next step the model has changed, so it writes new attempts. The old ones are thrown away."}, "good": ["The feedback lands on mistakes this model actually makes, including ones that only show up halfway through a long answer it wrote itself. Nobody collects the data ahead of time, so supply is limited only by compute. The model can even act as the judge: self-rewarding training has it score its own answers to build preference pairs.", "yuan2024selfrewarding"], "limits": ["It can only learn from attempts it can produce. If every attempt at a problem fails, they all score the same and there's nothing to push toward. One study found RL-trained models beat their base models on a single try, but the base models caught up when each got many tries, which suggests RL mostly makes existing answers more likely.", "yue2025rlreasoning"]},
  "src-teachers": {"example": {"p": "A stronger or more specialized model, kept [[frozen|frozen]], doing work a person might otherwise do.", "rows": [["Writes", "Answers a set of prompts, and the student is fine-tuned on the answers."], ["Judges", "Scores the policy's summaries against a rubric."], ["Grades tokens", "During on-policy distillation, scores every token the student writes."]], "note": "The last one needs the teacher running during training, not just its saved outputs."}, "good": ["Scale. A teacher can write, judge or grade as much as compute allows, and it's the only source that can expose token probabilities. DeepSeek fine-tuned small models on about 800k samples from R1, and at that scale this beat running large-scale RL on the small models directly.", "deepseek2025r1"], "limits": ["The student inherits the teacher's errors and habits, and style transfers more easily than substance. Models fine-tuned to imitate ChatGPT copied its style but not its factuality: crowd raters scored them close to ChatGPT, while targeted tests showed they'd closed little of the gap.", "gudibande2023false"]},
  "d-demos": {"example": {"p": ["A prompt and the response you want the model to give. This row is from the Tülu 3 SFT mixture.", "lambert2024tulu3"], "rows": [["Prompt", "Create a slogan advocating for the ethical treatment of animals in scientific research, ensuring the slogan is in English and all capital letters."], ["Target", "RESPECT LIFE: INNOVATE WITH COMPASSION"]], "note": "SFT raises the probability of each target token, given the prompt and the tokens before it."}, "cost": ["Someone has to write the answer, which is the most expensive thing to ask of a person. InstructGPT's labelers wrote demonstrations for about 13k prompts. Today much of it is written by teacher models or adapted from earlier datasets, with experts writing what models can't.", "ouyang2022instructgpt"], "limits": "A demonstration shows one good answer and says nothing about the bad ones: training on summary A never pushes C's overclaiming down. The model also only sees someone else's text, so it never practices recovering from its own mistakes. And every token is a target, the filler as much as the fact."},
  "d-revisions": {"example": {"rows": [["Original", "C: “This study proves the drug reverses memory loss.”"], ["Revision", "“In mice, the drug modestly improved memory. It hasn't been tested in people.”"]], "note": "Imitate the revision with SFT, or set it against the original as a preference pair with the revision chosen."}, "cost": ["An expert edits a model's answer, a user fixes a draft and the product records the edit, or the model revises itself. In Constitutional AI the model critiques its own answer against a written principle, rewrites it, and a model is then fine-tuned on the rewrites.", "bai2022constitutional"], "limits": "A revision shows one fix, but not why the original was wrong unless a critique comes with it. It also only covers what the reviser changed. If they fix the overclaim and leave a vague sentence alone, that sentence is in both versions, so nothing pushes against it."},
  "d-traj": {"example": {"p": "Everything an agent did on one task: what it wrote, which tools it called, and what came back. An illustrative run in an email environment:", "rows": [["Task", "When will the new Weekly Report be delivered each week?"], ["Call", "search_inbox(“Weekly Report”)"], ["Result", "Three matching emails"], ["Call", "read_email(2)"], ["Answer", "“8am Monday mornings.”"]], "note": "SFT trains on the agent's own turns. The tool results are context, not targets."}, "cost": ["Recorded runs of a strong model, or occasionally a person, working through a task in a sandbox, then checked and filtered. Kimi K2's SFT included large-scale synthetic tool-use trajectories. Kimi K3's cold start used runs from earlier specialist Kimi models, verified in several stages and annotated by humans.", "kimi2026k3"], "limits": ["They're someone else's text. The model sees what a run looks like but never gets feedback when its own run goes wrong, and a run can succeed despite bad steps along the way. GLM-5 masks erroneous segments of its trajectories out of the loss so those steps aren't imitated.", "glm2026glm5"]},
  "d-ratings": {"example": {"p": "A score per response on a fixed scale, or an ordering of several responses to the same prompt.", "rows": [["A", "5/5"], ["B", "4/5"], ["C", "2/5, overstates the findings"], ["D", "1/5, makes up a result"], null, ["Ranking", "A > B > C > D"]], "note": "A ranking of four responses contains six pairs. A over C is one of them."}, "cost": ["Experts or users score responses, or a teacher model does. InstructGPT had labelers rank 4 to 9 responses at a time to speed up collection, since one ranking of K responses gives K(K−1)/2 comparisons.", "ouyang2022instructgpt"], "limits": "A score says how good, not where or why: C's 2/5 doesn't point at the word “proves”. Scales also drift between raters, so one person's 4 is another's 3. Comparing responses to the same prompt from the same rater avoids some of that, which is one reason ratings so often get turned into pairs."},
  "d-critiques": {"example": {"rows": [["Response", "C: “This study proves the drug reverses memory loss.”"], ["Critique", "“Overstates the result. The study was in mice and the effect was modest. ‘Proves’ and ‘reverses’ aren't supported, and it leaves out that the drug wasn't tested in people.”"]], "note": "Text about a response, rather than a better response or a score."}, "cost": ["Experts write them, or a model does. In Constitutional AI the model critiques its own answers against a principle and the critique drives a revision. The other main use is training a judge, which learns to write the same kind of critique for responses nobody reviewed.", "bai2022constitutional"], "limits": "The policy can't imitate a critique or be scored by one directly. Its value comes after a transformation, through the revision it prompts or the judge trained on it. And it's only as good as its author's attention: a critique that misses D's invented statistic reads just as confidently as one that catches it."},
  "d-steps": {"example": {"p": "A label on each step of a worked solution, not only on the final answer. This is a small model's real answer to a word problem.", "rows": [["Problem", "A farmer has 3 fields with 14 cows each. He sells 1/3 of all the cows and then buys 5 more. How many cows does he have now?"], ["Step 1", "3 * 14 = 42 cows. ✓"], ["Step 2", "After selling 1/3, there are 42 / 3 = 14 cows left. ✗ 14 is the number sold."], ["Answer", "14 + 5 = 19 (the key says 33)"]], "note": "An answer check only says 19 is wrong. Step labels show where it went wrong, and that step 1 was fine."}, "cost": ["Expensive when people do it, because the labeler has to follow the reasoning. OpenAI's PRM800K has about 800,000 step labels on math solutions. Programs can estimate labels instead: finish the solution several times from a step, and count the step as good if a finish reaches the right answer.", "wang2023mathshepherd"], "limits": "A step label says a step is wrong, not what the right step would have been. Labels also need tasks that break into clear steps, which mostly means math. Automatic labels add their own noise: a flawed step can still reach the right answer by luck, and a sound one can look bad if the model finishing it is weak."},
  "d-rubrics": {"example": {"p": "Criteria written for one task, which a model judge checks each response against.", "rows": [["Task", "Summarize this paper accurately."], ["Criterion 1", "Says the study was in mice, not people."], ["Criterion 2", "Matches the paper's hedging. No “proves”."], ["Criterion 3", "Every number appears in the paper."], ["Result", "A meets all three. C misses the first two. D misses the first and third."]]}, "cost": ["Experts write them for professional tasks, often together with the task itself. A model can write them too: for tasks a program can't verify, Kimi K3's generative reward model writes a rubric for each task and uses it to compare candidate answers head to head.", "kimi2026k3"], "limits": "A rubric only rewards what it names. A summary can meet every criterion and still be hard to read. The score also depends on a judge reading the response against the rubric, and the policy is trained against that judge's reading, mistakes included."},
  "d-tasks": {"example": {"p": "A problem plus a way to check any attempt. The first is from GSM8K; the second is a small coding task.", "rows": [["Question", "James writes a 3-page letter to 2 different friends twice a week. How many pages does he write a year?"], ["Answer key", "624"], null, ["Task", "Write is_palindrome(s)."], ["Tests", "is_palindrome(“racecar”) is True. is_palindrome(“ab”) is False."]], "note": "The checker reads only the final number or runs the tests. It never looks at the reasoning."}, "cost": ["Programs can generate problems and compute the answer alongside, experts write harder ones, and existing datasets supply many more. Tülu 3's RL set is about 30k prompts of this kind, drawn from GSM8K, MATH and instructions with constraints a program can check.", "lambert2024tulu3"], "limits": "A pass says the final answer matched, not that the reasoning was right. A flawed method that happens to land on 624 scores the same as a careful one. Tests have the same gap: they check the cases someone thought to write, so code that handles only those cases passes too."},
  "d-envs": {"example": {"p": "A task, a world to act in, tools, and a grader that checks the outcome. This is one task from ART·E, built on the Enron email corpus.", "rows": [["Task", "When will the new Weekly Report be delivered each week? (Answer from one employee's inbox.)"], ["Tools", "search_inbox and read_email, up to ten turns"], ["Grader", "A model judge compares the answer with “8am Monday mornings.” Correct: +1. “I don't know”: 0. Wrong: −1."]], "note": "A wrong answer scores below abstaining, so the model learns that guessing is worse than admitting it couldn't find the answer."}, "cost": "People who know the job design them, and data vendors increasingly sell them as a product. Programs supply the world itself, such as a database or a simulated company's records, and models often generate the tasks: ART·E's roughly 44,000 questions were generated from the emails. One environment serves many tasks, and each task many rollouts.", "limits": "The grader decides what counts as done, and it only checks what it was built to check. A model judge may accept a plausible wrong answer, and a state check can miss side effects it never looks at, like an email the agent shouldn't have sent. Many professional tasks can't be fully checked by a program, so part of the grade comes from a rubric and a judge."},
  "d-prompts": {"example": {"p": "Just the input, with no answer attached. During training, the policy or student writes the response and something else supplies the feedback.", "rows": [["Prompt", "Summarize this paper accurately. [paper text]"], ["Prompt", "A farmer has 3 fields with 14 cows each. He sells 1/3 of all the cows and then buys 5 more. How many cows does he have now?"], ["Prompt", "Write a polite reply declining this meeting."]], "note": "The mix of prompts decides what the model gets to practice."}, "cost": ["Real users' requests, prompts generated by programs or teacher models, and public problem sets. They're the cheapest shape to collect, since nobody has to answer them. RL sets tend to be much smaller than SFT sets: the released Olmo 3 Think 7B data has about 102k RL prompts against about 2.27M SFT examples.", "olmo2025olmo3"], "limits": "A prompt carries no signal on its own. What the model learns depends on the scorer or teacher paired with it, and on difficulty. When attempts are compared with each other, as in GRPO, a prompt where every attempt passes or every attempt fails gives all of them the same score, and teaches nothing."},
  "d-rollouts": {"example": {"p": "Four attempts the policy wrote at one prompt during training, each scored as soon as it's written.", "rows": [["Prompt", "Summarize this paper accurately."], ["Rollout 1", "A, scored 5/5"], ["Rollout 2", "B, 4/5"], ["Rollout 3", "C, 2/5"], ["Rollout 4", "D, 1/5"]], "note": "Compared with each other (average 3), A and B are pushed up and C and D down. Next step, the updated model writes new ones."}, "cost": "The policy itself, mid-training. Each step it samples fresh responses to a batch of prompts, a scorer or teacher grades them, and they're discarded after the update. Methods that compare attempts with each other, like GRPO, sample several per prompt.", "limits": "Rollouts can't show the model an approach it never tries, and a score says how an attempt did, not what a better one would have looked like. They also go stale. Reused for several updates, they come from a slightly older copy of the model, which is why PPO-style methods correct with a [[ratio|probability ratio]] and clip it."},
  "d-teachertext": {"example": {"p": "A stronger model's answer, stored as text. This is Qwen2.5-7B-Instruct answering the word problem from the article's figure.", "rows": [["Prompt", "A farmer has 3 fields with 14 cows each. He sells 1/3 of all the cows and then buys 5 more. How many cows does he have now?"], ["Teacher", "The farmer has 3 fields with 14 cows each, so he has 3 * 14 = 42 cows. He sells 1/3 of all the cows, which is 42 / 3 = 14 cows. After selling, he has 42 - 14 = 28 cows. Then he buys 5 more, so he now has 28 + 5 = 33 cows."]], "note": "Trained on with SFT, exactly like a human demonstration. Only the sampled tokens survive; the teacher's other options are lost."}, "cost": ["A teacher answers a set of prompts, and the answers are usually filtered before training. DeepSeek-R1's small models were fine-tuned on about 600k reasoning samples from an R1 checkpoint, kept only if they passed answer checks or a DeepSeek-V3 judge, plus about 200k general examples.", "deepseek2025r1"], "limits": "It shows what the teacher wrote, not how sure it was or what else it considered. The student trains on text it wouldn't have written itself, so it never gets feedback on its own mistakes, and it picks up the teacher's wording along with its reasoning."},
  "d-teacherprobs": {"example": {"p": ["At each position, the teacher's probability for every token in the vocabulary, not only the one it picked. The small numbers matter: the relative probabilities of wrong answers show how the teacher generalizes.", "hinton2015distilling"], "rows": [["Text so far", "…After selling 1/3, there are 42"], ["Student", "writes “ /” (probability 0.32)"], ["Teacher", "top choice “ -”. Gives “ /” 0.0005."]], "note": "Real numbers from the article's figure, Qwen2.5-0.5B student and 7B teacher. A stored distribution would hold one probability per vocabulary entry at this position."}, "cost": ["Only from a teacher you can read at the probability level, which usually means running it yourself. Storing it is heavy: one number per vocabulary entry per token, and Llama 3's vocabulary has 128K entries. So it's usually computed during training rather than saved.", "llama2024llama3"], "limits": "Stored distributions are the teacher's view of text the teacher wrote, which isn't where the student goes wrong. The student still never gets graded on its own text; that's what on-policy distillation adds. Matching token for token also needs the two models to share a vocabulary."},
  "s-prm": {"io": {"p": "In: a problem and a worked solution, split into steps. Out: a score for each step, roughly the chance that the step is correct.", "rows": [["Problem", "A shirt costs $20 after a 20% discount. What was the original price?"], ["Step 1", "Call the original price x, so 0.8x = 20. → 0.97"], ["Step 2", "So x = 20 × 1.2 = 24. → 0.08"]], "note": "Illustrative scores. An answer checker would only learn that $24 is wrong. The step scores say where it went wrong: 20 ÷ 0.8 is 25, and multiplying by 1.2 isn't the same thing."}, "built": ["Train a language model to predict step labels. Lightman et al. had people read model-written solutions to competition math problems and mark each step, about 800,000 step labels in all. That labeling is the expensive part: someone has to follow every line of the reasoning, where an answer key needs one comparison.", "lightman2023verify"], "fails": ["DeepSeek tried a process reward model for R1 and dropped it. In general reasoning it's hard to say where one step ends, it's hard to judge whether a middle step is right, and once RL trains against a learned step scorer the policy finds ways to hack it, so the scorer has to be retrained.", "deepseek2025r1"]},
  "s-judge": {"io": {"p": "In: the prompt, a response (or two to compare), and the rubric or principles to judge by. Out: a score, a verdict, or which response is better, often after a written reason.", "rows": [["Rubric", "Does the summary claim more than the paper found?"], ["Response", "C: “This study proves the drug reverses memory loss.”"], ["Out", "Yes. The paper reports a modest effect in mice; “proves” and “reverses” overstate it. 2/5."]]}, "built": ["Often nothing new is trained. You prompt an existing model with instructions, the rubric and perhaps a few graded examples, then read off its answer. Lee et al. took the judge's probabilities for “1” versus “2” as a soft preference between two responses. In Constitutional AI, the model compares two responses against a principle from a written list, and those AI labels train a preference model.", "lee2023rlaif"], "fails": ["Judges have biases of their own. In Lee et al., the judge picked the same position in both orderings of a pair in 18% to 56% of cases, worse for smaller judges, so they ran every pair both ways and averaged. A judge also can't catch what it doesn't know: without the paper in front of it, summary D's invented 80% can pass. And like a reward model, it's something RL can learn to please.", "lee2023rlaif"]},
  "s-verifier": {"io": {"p": "In: the response, plus whatever the task came with, such as an answer key or a test suite. Out: usually pass or fail, 1 or 0.", "rows": [["Problem", "A farmer has 3 fields with 14 cows each. He sells 1/3 of all the cows and then buys 5 more. How many now?"], ["Response", "“…there are 42 / 3 = 14 cows left. Then 14 + 5 = 19 cows.”"], ["Out", "0 (the key says 33)"], null, ["Response", "“…he was left with 42 − 14 = 28 cows. Then he bought 5 more, making his new count 28 + 5 = 33.”"], ["Out", "1"]], "note": "Real samples from the article's small model. The check reads only the final number, so it can't say the first response's mistake was counting the 14 sold cows as the ones left."}, "built": "Written by hand, not trained. For math it can be a few lines that pull out the final answer and compare it to the key. For code it runs the program against unit tests in a sandbox, and for an agent task it inspects the state of the world afterwards: whether the right records changed or the file exists. Since nothing is learned, it gives the same verdict every time.", "fails": ["It checks exactly what it was written to check. When the tests don't capture the task, RL finds the gap: coding models have learned to special-case the test inputs or edit the tests instead of solving the problem. It also only exists where a program can decide what's right, which leaves out most writing and judgment calls.", "baker2025monitoring"]},
  "s-teacher": {"io": {"p": "In: the prompt and the response the student just wrote. Out: one number per token, the teacher's log-probability minus the student's. Real values from the article's example, where a 7B model grades a 0.5B model's wrong answer:", "rows": [["“/”", "In “42 / 3”: the student gave it 32%, the teacher 0.05%. The teacher would have written “−”. Score −6.4."], ["“left”", "In “14 cows left”: the teacher would have written “sold”. Score −4.7."], ["“3”", "In “3 * 14”: the student gave it 86%, the teacher nearly 100%. Score +0.15."]], "note": "It scores wording too. The opening “There” gets −9.5 because the teacher would have started with “The”."}, "built": ["Nothing is trained for the role. The teacher is an existing model, often a specialist trained earlier in the same pipeline, run over the student's text to read off its probabilities. That takes one forward pass of the larger model per response, far cheaper than generating, but it happens at every training step, and it needs the teacher's probabilities, which a text-only API doesn't give.", "lu2025onpolicy"], "fails": "It measures closeness to the teacher. A correct answer worded differently from the teacher's habits gets marked down, as “There” was above. Where the teacher is wrong, it rewards the same mistake, so the best the student can do is match it."},
  "f-demo": {"intuition": "Copy this, one token at a time. At each position the model is shown the next word of a good answer and nudged to predict it, hardest where that word surprised it. It's the same way the model learned during pretraining, now aimed at text someone picked because it shows the behavior you want.", "limits": ["It only ever shows good text, so it says nothing about what to avoid, and the model never sees its own mistakes or practices recovering from them. Every token of the target gets pushed up, incidental phrasing included, which is why imitating another model tends to copy its style more readily than its ability.", "gudibande2023false"]},
  "f-reward": {"intuition": "Say the policy writes summaries A and D, and the scorer gives A a 5 and D a 1. Every word of A gets a little more likely and every word of D a little less. Nobody shows the model a good summary or says what was wrong with D. Over thousands of prompts, whatever the high scorers had in common, like sticking to what the paper actually found, is what gets reinforced.", "limits": "It can only reinforce what the model already produces some of the time. If every attempt at a problem fails, the scores are all equal and nothing gets pushed. And one number covers the whole response, so in a failed answer the correct steps are pushed down as hard as the mistake."},
  "f-teacher": {"intuition": {"p": ["A demonstration gives one right next word. A teacher gives its whole spread of guesses, which says which alternatives are nearly as good and which are wrong. Hinton et al. pointed out that the relative probabilities a model gives to wrong answers say a lot about how it generalizes. In the on-policy version, the student writes and the teacher grades each of its tokens.", "hinton2015distilling"], "rows": [["Text so far", "“A drug ___ improved memory in mice.”"], ["Demo", "modestly"], ["Teacher", "modestly 55% · slightly 30% · significantly 10% · dramatically 0.5%"]], "note": "Illustrative numbers. The student learns that “slightly” is close and “dramatically” is far off, which a single target word can't tell it."}, "limits": "The student can't learn what the teacher doesn't know, and it picks up the teacher's style and errors along with its skill. The teacher has to be good at the task already, which is why distillation comes after the stages that train it. Matching probabilities also needs access to the teacher model itself, not just text it wrote."},
  "m-sft": {"why": ["A base model continues documents rather than answering them. Fine-tuning on examples of the wanted behavior fixes that directly. FLAN fine-tuned a 137B model on more than 60 tasks rewritten as instructions and found it did better on tasks it had never seen. InstructGPT made the same move, on answers written by labelers, the first stage of RLHF.", "wei2021flan"], "when": "Almost every recipe here opens with it, because RL needs a model whose own attempts are sometimes right. It's also the default whenever you can write down what a great answer looks like, and it's the cheapest stage to run: no sampling, no scorer, one model in memory.", "gives": "It's [[offline|off-policy]]: the model learns from someone else's text and never practices on its own mistakes. It only pushes text up, so it can't tell the model what to avoid. And every target has to be written by someone, which is slow when people do it and caps quality at whoever wrote them."},
  "m-rs": {"why": ["SFT needs someone to write every target. For reasoning, that means hand-written worked solutions, which are slow to produce. STaR had the model write its own: it attempts each problem, keeps the reasoning that reaches the right answer, fine-tunes on that, and repeats. Expert iteration had used the same loop for board games, with tree search playing the expert.", "zelikman2022star"], "example": {"p": "The farmer problem from the article, sampled 16 times from a small model:", "rows": [["Prompt", "A farmer has 3 fields with 14 cows each. He sells 1/3 of all the cows and then buys 5 more. How many now?"], ["Kept", "5 attempts that end in 33"], ["Dropped", "10 attempts that end in 19, and 1 that ends in 39"]], "note": "The five keepers become SFT targets. The eleven wrong attempts teach nothing, even though ten of them make the same mistake."}, "when": ["When you have a grader and want the model to learn from its own outputs without building RL training. It's also how pipelines turn a strong checkpoint into SFT data: Llama 2 sampled several answers per prompt and fine-tuned on the one its reward model scored highest, over several rounds.", "touvron2023llama2"], "gives": "Failures are thrown away rather than pushed down, so the model learns what worked but not what to stop doing. Prompts where every sample fails contribute nothing, so the hardest problems quietly drop out of the data. And since samples are collected in rounds, the data always lags the model a little."},
  "m-dpo": {"why": ["Classic RLHF trains a reward model, then runs PPO, sampling from the model the whole time. Rafailov et al. called that complex and often unstable. They showed the same objective can be optimized with a simple classification loss on preference pairs, so the separate reward model and the sampling both drop out.", "rafailov2023dpo"], "when": "When you have pairs and want a cheap, stable stage with no scorer to run and nothing to sample. Olmo 3 puts DPO between SFT and RL, and Llama 3 ends its pipeline with it. It's also the baseline that IPO, KTO and SimPO were each measured against.", "gives": "The pairs are fixed and usually written by another model, so the model never gets feedback on the mistakes it makes now. It learns only what the pairs separate. Against RL on a reward model trained from the same pairs, it trades [[onpolicy|on-policy]] learning for a much cheaper run."},
  "m-ipo": {"why": ["DPO assumes each preference reflects a hidden score gap. When one answer always wins, as it does when each pair was labeled once, that gap should be infinite, and DPO pushes the loser toward zero probability however tightly [[beta|β]] holds the model to its reference. Azar et al. noted that RLHF avoids this because its reward model ends up underfit. IPO aims the gap at a finite target instead.", "azar2023ipo"], "when": "Mostly as an alternative to try when DPO overfits: small preference sets where every pair was labeled once, so the data says the same answer always wins. DPO remains the more common choice.", "gives": "The target gap is one more setting to tune. Once a pair's gap reaches the target, the [[squared|squared loss]] pulls it back if it grows further, so even a pair the data marks as clear-cut never gets pushed fully apart. Otherwise it keeps DPO's tradeoffs, including training on fixed pairs."},
  "m-simpo": {"why": ["Meng et al. raised two problems with DPO. The reference model costs memory and compute. And DPO's reward doesn't match what generation uses: after DPO training, only about half of the training pairs had the chosen response more likely, per token, than the rejected one. SimPO scores each response by its own average log-probability per token and drops the reference model.", "meng2024simpo"], "when": "When you want DPO's setup with only one model in memory. Its paper tested it on chat-quality benchmarks, AlpacaEval 2 and Arena-Hard, where it beat DPO.", "gives": ["Nothing in the loss holds the model near where it started. The authors found it stayed close anyway, and credited a small learning rate, varied preference data, and how well large models hold on to what they know. Those choices carry more weight than they do with DPO.", "meng2024simpo"]},
  "m-odpo": {"why": ["DPO's pairs are collected before training and never updated, usually from a different model, so as training changes the model, the pairs describe someone else's mistakes. Guo et al. sampled two fresh responses from the current model at each step and had an LLM pick the better one. In human evaluations that beat both offline DPO and RLHF.", "guo2024oaif"], "example": {"rows": [["Step 100", "The policy writes two summaries of the same paper."], ["Response 1", "“The drug improved memory in mice. Effects in people are untested.”"], ["Response 2", "“The drug improves memory.”"], ["Judge", "Prefers 1: response 2 drops that the result was only in mice."], null, ["Step 101", "A new prompt and two new samples from the slightly updated policy."]], "note": "Each pair is used once, right after the model wrote it."}, "when": "When a live scorer is available (a reward model, a judge, or a verifier) and you want feedback on the model's current outputs while keeping DPO's simple loss. With an LLM judge, changing its instructions changes what gets preferred, with no new labels to collect.", "gives": "Every step now samples two responses and runs the labeler, so it costs more than offline DPO and takes on the labeler's biases. A pair still says only which of two is better. If the scorer gives numbers, RL methods like GRPO can use the scores of a whole group directly."},
  "m-reinforce": {"why": ["It's the original recipe for learning from a score, from 1992, long before language models. The model tries something, gets a reward, and makes what it did more likely in proportion to how far the reward beat a [[baseline|baseline]]. Every other method in this column is REINFORCE with a better baseline, a limit on how far one batch can move the model, or both.", "williams1992reinforce"], "how": "If every reward is positive, every sample gets pushed up and only the sizes of the pushes differ. Subtracting a baseline means below-average samples get pushed down instead, so the same rewards give a much less noisy step.", "when": ["When you want the simplest RL loop: one sample per prompt, no critic, no clipping. It's mostly the reference point the others are explained against, but it holds up. In Ahmadian et al.'s RLHF experiments, REINFORCE with a running-average baseline beat PPO on all three of their tasks.", "ahmadian2024backtobasics"], "gives": "Its baseline is an average over recent steps, so it can't tell an easy prompt from a hard one: a score of 0.6 might be excellent on one and poor on another, and both get the same push. Without clipping, each batch of rollouts can also drive only one gradient step, which wastes expensive samples."},
  "m-rloo": {"why": ["PPO's critic is a second large model to train and hold in memory. RLOO goes back to plain REINFORCE and gets a better baseline for free: sample several answers to the same prompt and compare each to the average of the others. Ahmadian et al. argued that a model starting from a good fine-tuned checkpoint doesn't need PPO's extra machinery, and found this simpler method beat PPO in RLHF.", "ahmadian2024backtobasics"], "how": "If the four summaries score 5, 4, 2 and 1, summary A is measured against the mean of the other three, (4 + 2 + 1) / 3 ≈ 2.3, for an advantage of +2.7. Counting A in its own baseline would let its high score raise the bar it's measured against.", "when": "When you can sample several responses per prompt and want the simplest critic-free method. It spends more on generation than PPO but loads one fewer model, and since each batch is used for a single gradient step it needs no clipping.", "gives": "Every prompt needs k samples before any of them is useful, so generation cost per prompt goes up k times. The advantage is per response, so every token in an answer gets the same push, right and wrong steps alike. And without clipping it can't safely take several gradient steps on one batch."},
  "m-ppo": {"why": ["In plain policy gradient, each batch of samples feeds one gradient step. Taking several steps on the same batch saves sampling, but the policy can lurch too far and wreck itself. PPO [[clip|clips]] each token's update once it has moved far enough, so a batch can be reused safely, and it learns a [[critic|critic]] for a better baseline. OpenAI's RLHF work, from summarization to InstructGPT, made it the standard RLHF optimizer.", "schulman2017ppo"], "how": "The critic reads the response so far and guesses the final score. When the guess jumps after a token, that token gets credit; when it drops, the token gets blame. That's how one score at the end turns into a different advantage for each token.", "when": "When you want per-token credit from one reward per response and can afford a second network, or when you can only sample once per prompt. It was the standard RLHF optimizer until critic-free group methods like GRPO spread.", "gives": ["Memory and simplicity. The critic is usually a model about the size of the policy, trained alongside it, and it has to learn from rewards that only arrive at the end. In RLHF, Ahmadian et al. found PPO's clipping fired on under 5% of each batch, and removing it didn't hurt.", "ahmadian2024backtobasics"]},
  "m-grpo": {"why": ["DeepSeek wanted PPO's stability for math reasoning without its critic, a second model about the policy's size that is hard to train when the reward arrives only at the last token. GRPO keeps PPO's clipping and swaps the critic for a group baseline: sample several answers to each problem and score each one against the rest of its group.", "shao2024deepseekmath"], "example": {"p": "A group of fresh answers to one prompt. Say the scorer gives the four summaries 5, 4, 2 and 1.", "rows": [["A", "scored 5, advantage +1.26"], ["B", "scored 4, advantage +0.63"], ["C", "scored 2, advantage −0.63"], ["D", "scored 1, advantage −1.26"], null, ["Prompt", "A harder paper, where all four summaries score 1"], ["A–D", "advantage 0 each"]], "note": "Each advantage is the score minus the group's mean (3), divided by the group's standard deviation (about 1.58). When every answer scores the same, nothing gets pushed, so prompts the model always passes or always fails teach it nothing."}, "when": "The default for reasoning RL since DeepSeek used it for R1, and most recent recipes in this explorer use it or a close variant. It suits tasks where answers can be checked cheaply, so scoring a whole group per problem costs little, and memory is better spent on the policy than on a critic.", "gives": "Per-token credit: every token in an answer shares one advantage, so the correct steps in a failed answer are pushed down along with the mistake. It also needs a group of samples per prompt, and the groups where every answer scores the same are generated for nothing."},
  "m-gspo": {"why": ["GRPO weighs each token by its own [[ratio|probability ratio]], but the reward belongs to the whole response. The Qwen team found these per-token ratios add noise that grows with response length and that clipping makes worse, sometimes collapsing training past recovery, especially in mixture-of-experts models. GSPO computes one ratio for the whole response and clips that, so the unit being corrected matches the unit being rewarded.", "zheng2025gspo"], "when": ["For long responses and mixture-of-experts models (which route each token through a few of many sub-networks), where per-token ratios are noisiest. It let Qwen drop Routing Replay, a workaround that had kept their MoE training stable at the cost of extra memory and communication. Qwen credits GSPO for part of the gains in its later Qwen3 models.", "zheng2025gspo"], "gives": ["Fine-grained control. A response is clipped or kept as a unit, so one badly off token can't be dropped on its own, and a response that drifts too far loses its gradient entirely, good tokens included. GSPO ends up clipping about a hundred times more tokens than GRPO, yet the Qwen team found it trained more efficiently.", "zheng2025gspo"]},
  "m-cispo": {"why": ["MiniMax noticed that PPO and GRPO's clipping was throwing away the tokens that mattered most for reasoning. Words like “However”, “Wait” and “Recheck” are rare in the base model, so their [[ratio|ratios]] jump once training starts favoring them. They got clipped after the first update and stopped contributing gradient for the rest of that batch. CISPO caps how much weight each token gets instead of dropping it.", "minimax2025m1"], "how": "A token that hits the clip still pushes, at the capped strength, instead of not pushing at all.", "when": ["For long reasoning runs where each batch is reused for several gradient steps, which is when tokens get clipped out. In MiniMax's comparison on Qwen2.5-32B, CISPO matched DAPO, a GRPO variant, on AIME 2024 math problems in half the training steps.", "minimax2025m1"], "gives": "Some of the brake. In PPO and GRPO, a token that has moved far enough stops being pushed for the rest of the batch. CISPO only caps the token's weight, so the push continues, just no harder, and the policy can keep moving in a direction the clip would have halted."},
  "m-offdistill": {"why": ["Distillation started as compression. Large models and ensembles predict well but cost too much to serve, so Hinton et al. trained a small model to match a big one's probabilities. Kim and Rush carried the idea to text generation by training the student on the teacher's own outputs. Their student ran ten times faster than its teacher with little loss in quality.", "kim2016seqkd"], "when": "To make small models from a big one, as DeepSeek-R1 and Qwen3 did, or to merge specialists into one model, as GLM-4.5 did. The teacher's text is generated once and reused, so after that it costs no more than SFT.", "gives": ["The student learns from text it wouldn't have written. When it makes an early mistake the teacher never makes, it ends up somewhere the training data never went, and errors compound over a long answer. It also tends to pick up the teacher's style more readily than its ability.", "lu2025onpolicy"]},
  "m-opd": {"why": ["Offline distillation trains on the teacher's text, but in use the student writes its own and wanders into situations that text never showed. GKD and MiniLLM, both in 2023, trained the student on its own samples with the teacher grading them. MiniLLM also changed the objective so the student stops putting probability on text the teacher considers unlikely.", "agarwal2023gkd"], "how": ["The per-token score adds up to a reverse KL, which is mode-seeking: the student is penalized for writing what the teacher wouldn't, and isn't asked to cover every way the teacher might have answered. It settles on one good way to respond.", "lu2025onpolicy"], "when": ["When a teacher already does the task well and you want that skill in the model you're training. It costs far less than RL for similar results: Lu reports Qwen3 reaching comparable reasoning scores with about a tenth of the GPU hours RL took.", "lu2025onpolicy"], "gives": "It needs the teacher running at every step and access to its probabilities. The student can at best reach the teacher, since whatever the teacher gets wrong is rewarded. And the teacher grades wording as well as reasoning, so its style comes along too."},
  "p-cai-0": {"role": ["The starting model is helpful but will go along with harmful requests. Here it critiques and rewrites its own answers to red-team prompts, drawing a new principle from the constitution for each pass, and a pretrained model is fine-tuned on the final revisions plus ordinary helpful answers. The report says the point is to shift the model's behavior cheaply before RL, so the RL stage needs less exploration and less training.", "bai2022constitutional"]},
  "p-cai-1": {"role": ["This is where AI labels replace human ones for harmlessness. The SL-CAI model writes two answers to each harmful prompt, and a separate feedback model, usually a plain pretrained model, is asked which is less harmful under one of 16 principles. Its probabilities for (A) and (B) become soft labels. These are mixed with human helpfulness comparisons to train one preference model, so RL is scored on both at once.", "bai2022constitutional"]},
  "p-cai-2": {"role": ["RL starts from the SL-CAI model, the same model that wrote the comparison pairs, so its early answers look like what the preference model was trained on. This stage is what makes the model reliably harmless: RL-CAI models were rated more harmless than both SL-CAI and RLHF models. Trained too long, they turned preachy, tacking boilerplate like “you are valid, valued, and cared for” onto answers.", "bai2022constitutional"]},
  "p-glm45-0": {"role": ["All three experts start from this model. A small set of long chain-of-thought answers gives it basic chat, step-by-step reasoning and tool use, so each expert has some footing in its domain before RL builds on it.", "glm2025glm45"]},
  "p-glm45-1": {"role": ["Each expert gets RL with rewards that suit its domain: checkable answers for reasoning, task success and passing tests for agents, reward models and rubric scoring for chat. The experts are a means to an end: their outputs become the training data for the next stage.", "glm2025glm45"]},
  "p-glm45-2": {"role": ["This is the merge. Millions of the experts' filtered outputs fine-tune the base model again, so one model learns what three specialists learned. Some answers keep their reasoning and some don't, so the merged model can think at length or reply directly; the report points out that small talk doesn't need a long think.", "glm2025glm45"]},
  "p-glm5-0": {"role": ["One SFT pass covers chat, reasoning and agent work, and sets up the thinking habits the RL stages build on: thinking before every tool call, keeping earlier reasoning across turns, switching thinking off per turn. When a trajectory contains a wrong step, the step stays in the text but is left out of the loss, so the model sees the mistake get fixed without being trained to make it.", "glm2026glm5"]},
  "p-glm5-1": {"role": ["The first of three RL stages that run one after another. It mixes math, science, code and tool-assisted reasoning in roughly equal parts, on problems GLM-4.7 rarely solves, each graded pass/fail. Its final checkpoint is kept: the last stage uses it as a teacher to restore reasoning that the later stages wear down.", "glm2026glm5"]},
  "p-glm5-2": {"role": ["Agent tasks take a long time per attempt, and with ordinary synchronous RL the GPUs sit idle waiting for the slowest one. Running generation and training separately keeps them busy, but some trajectories then come from an older version of the model. The token-level clipping and staleness cutoff keep those older trajectories from destabilizing training.", "glm2026glm5"]},
  "p-glm5-3": {"role": ["The last RL stage aims at everyday answer quality: fewer factual and instruction-following errors first, then tone and quality on tasks like writing and translation. The reward types cover for each other, since rules are precise but narrow, reward models are cheap but easier to game, and generative judges are harder to game but noisier. Human-written answers serve as style anchors, because training only on model text drifts toward a verbose, formulaic voice.", "glm2026glm5"]},
  "p-glm5-4": {"role": ["Training one skill after another wears down the ones before; the report calls it cumulative degradation. Here the student answers prompts drawn from earlier stages' RL sets, and those stages' final checkpoints grade its tokens, so it quickly recovers what Reasoning RL and General RL taught. The teachers are the model's own earlier selves, where Kimi K3 and Nemotron use separately trained specialists.", "glm2026glm5"]},
  "p-instructgpt-0": {"role": ["GPT-3 continues documents; it doesn't follow instructions. Labelers wrote demonstrations for about 13k prompts, and fine-tuning on them gives a model that at least tries to do what it's asked. Everything after builds on this model: the reward model starts as a copy of it, and PPO starts from it and is held near it by a [[kl|KL penalty]].", "ouyang2022instructgpt"]},
  "p-instructgpt-1": {"role": ["PPO will need a score for every answer the model writes during training, far more than people could rate. So labelers ranked 4 to 9 of the model's outputs for each of about 33k prompts, and a 6B reward model learned to predict their rankings. It's the SFT model with its next-token output replaced by a single score.", "ouyang2022instructgpt"]},
  "p-instructgpt-2": {"role": ["Here the model practices. It answers about 31k prompts, the reward model scores each answer, and PPO makes the higher-scoring answers more likely. A per-token [[kl|KL penalty]] against the SFT model keeps it from drifting toward text the reward model overrates. PPO alone made the model worse on some public NLP benchmarks, so the models called InstructGPT also mix in ordinary pretraining updates (PPO-ptx).", "ouyang2022instructgpt"]},
  "p-k2-0": {"role": ["This SFT sets up two things RL will need. It teaches tool use from tens of thousands of synthetic multi-turn trajectories, built with simulated users and tools covering thousands of real and over 20,000 synthetic tools, and kept only if an LLM judge finds they meet the task's rubric. It also trains on preference data so K2 can act as its own judge, which the self-critique reward in the RL stage relies on.", "kimi2025k2"]},
  "p-k2-1": {"role": ["One RL stage covers tasks that can be checked and tasks that can't. Math, code and similar tasks are scored by verifiers. For open-ended ones like creative writing, K2 compares its own responses in pairs against written rubrics. During RL that critic keeps being retrained on rollouts from the verifiable tasks, so its subjective judgments stay tied to something checkable as the policy changes.", "kimi2025k2"]},
  "p-k3-0": {"role": ["The report's reason is brief: give RL a good starting policy. Most of what's new over earlier Kimi models is coverage of complex agent tasks. This model also sets the yardstick for the next stage: how many tokens it uses on a problem becomes that problem's starting budget for the effort levels.", "kimi2026k3"]},
  "p-k3-1": {"role": ["SFT gives a start, and the report counts on RL for the harder reasoning and long agent work. Training separate experts lets each effort level be its own target: an attempt that runs over its token budget scores −1, however good it was. The nine experts become the teachers for the final stage.", "kimi2026k3"]},
  "p-k3-2": {"role": ["Nine experts are nine models; the report wants one. The student answers at a given effort level and is graded by the expert for that domain and level, so the effort setting survives the merge as a switch on one model. The [[opdreward|per-token reward]] plugs into the same RL machinery as the stage before, including pausing and resuming long agent rollouts.", "kimi2026k3"]},
  "p-llama3-0": {"role": ["Llama 3 uses its reward model to choose training data rather than as a reward to optimize against, since there's no PPO. It trains on all the human preference data collected so far, minus pairs whose responses are too similar. For some prompts annotators also improved the chosen answer, giving a three-way ranking: edited, then chosen, then rejected.", "llama2024llama3"]},
  "p-llama3-1": {"role": ["Each round, the latest model answers every human-annotated prompt [[ksamples|10 to 30 times]] and the reward model keeps the best answer. Those winners, plus synthetic and human-curated data, fine-tune the pretrained checkpoint. Because the targets are the model's own best attempts, the SFT data gets better each round as the model does.", "llama2024llama3"]},
  "p-llama3-2": {"role": ["SFT only says what to imitate; DPO also pushes away from worse answers. It trains mostly on the newest preference batches, collected with the previous round's best models, so the pairs look like what the current model writes. Meta tried PPO here and found DPO cheaper at this scale and better, especially at following instructions. Formatting tokens appear in both answers of a pair, so they're masked out of the loss.", "llama2024llama3"]},
  "p-nemotron-0": {"role": ["General SFT builds the base skills the rest of the pipeline sharpens: long-context reasoning, tool and terminal use, software fixes, math, chat and safety. It runs in two passes, the second adding long-context data up to 512K tokens. It also introduces a medium-effort reasoning mode that the RL stage later tunes.", "nvidia2026nemotron3ultra"]},
  "p-nemotron-1": {"role": ["One RL run trains the student on every environment at once, from terminal use and office work to math, chat and safety. Its result is the student that later stages distill into. Some specialists start from it, and it acts as its own teacher for areas no specialist covers.", "nvidia2026nemotron3ultra"]},
  "p-nemotron-2": {"role": ["With so many environments in one run, each domain gets only a few samples per batch, which dilutes its learning signal. Specialists fix that: each gets its own training pipeline to push one area, such as software engineering, search or office work, as far as it will go. Many were built in parallel on their own SFT data, which causes the problem the next stage handles.", "nvidia2026nemotron3ultra"]},
  "p-nemotron-3": {"role": ["Teachers trained on different SFT data reason differently, so the student's answers can look foreign to them, and a teacher grading text it would never write gives weak guidance. A very light SFT on data from the teachers' training sets moves the student's answers closer to what they expect. It helped most on agent tasks: BrowseComp rose to 44.4 after distillation with the warmup, versus 33.0 without.", "nvidia2026nemotron3ultra"]},
  "p-nemotron-4": {"role": ["This brings the specialists' skills back into one model. The RLVR stage gave sparse rewards that depend on the environment; here the matching teacher grades every token the student writes. It worked best where the teacher's edge shows up in choices the student already makes, like tool calls and multi-step execution, and least on reasoning the teacher learned from data the student never saw.", "nvidia2026nemotron3ultra"]},
  "p-nemotron-5": {"role": ["New teachers for coding, chat, software engineering, office work and tool use are branched from the distilled student, the first-round teachers are reused, and everything is distilled again. NVIDIA calls this co-evolution of student and teachers. Most scores rose again in round two, BrowseComp for one from 41.0 to 44.4.", "nvidia2026nemotron3ultra"]},
  "p-olmo3-0": {"role": ["This stage teaches the base model the shape of a reasoning answer: think out loud in a long trace, then answer. The traces are synthetic, written by open reasoning models such as QwQ-32B and DeepSeek R1 for math, code, chat and instruction-following prompts. By its end, imitation has mostly run its course, which is what the next stage is built around.", "olmo2025olmo3"]},
  "p-olmo3-1": {"role": ["Olmo found that more SFT on Qwen3 32B's thinking traces made its SFT model worse: it had already learned what those answers could teach. So this stage pairs each Qwen3 32B answer (chosen) with one from the much weaker Qwen3 0.6B (rejected) and trains on the difference. The same answers that hurt as SFT targets help as the better half of a [[pairs|pair]].", "olmo2025olmo3"]},
  "p-olmo3-2": {"role": ["RL comes last and starts from the DPO checkpoint. Its roughly 100k prompts cover math, code and instruction following, each checked by a program, plus general chat graded by an LM judge. Olmo ran the same RL from the SFT model too, and the DPO start came out ahead on the 7B model (one run each), so DPO stayed in the pipeline.", "olmo2025olmo3"]},
  "p-qwen3-0": {"role": ["This teaches the base model a pattern for long reasoning before RL takes over. The problems are filtered to ones a strong model couldn't answer without reasoning, and the responses, written by QwQ-32B, are filtered for wrong answers, repetition and guessing. Qwen keeps it deliberately small, few samples and few steps, to instill the patterns without limiting how far RL can take the model afterward.", "qwen2025qwen3"]},
  "p-qwen3-1": {"role": ["Most of the thinking mode's math and coding skill is built here: GRPO on 3,995 problems, each with a verifier. Qwen picked problems not used in the cold start, as hard as possible but still learnable by the cold-start model. That last condition matters for GRPO: if the model never solves a problem, every sample gets the same reward and there's nothing to compare.", "qwen2025qwen3"]},
  "p-qwen3-2": {"role": ["So far the model only answers by thinking at length. This SFT stage adds a second mode, answering directly, so one model can serve both. Thinking examples come from rejection sampling the Stage 2 model itself, so its reasoning isn't overwritten; non-thinking examples are curated across coding, writing, translation and more. A /think or /no_think flag in the prompt picks the mode. Cutting thinking off at a token budget also works as a result, without being trained directly.", "qwen2025qwen3"]},
  "p-qwen3-3": {"role": ["After fusion the model can switch modes but still slips: 88.7 on Qwen's in-house mode-switching test, rising to 98.9 after this stage. General RL over more than 20 tasks also improves instruction following, tool use and open-ended helpfulness in both modes. The trade-off is a small drop on the hardest math and coding benchmarks in thinking mode, which Qwen accepted for a more versatile model.", "qwen2025qwen3"]},
  "p-qwen3-4": {"role": ["Running all four stages for every small model would be expensive. Instead the smaller models (dense 0.6B to 14B, plus the 30B-A3B MoE) fine-tune on [[offline|text the large models wrote]] in both thinking and non-thinking modes. That gives them basic reasoning and the mode switch, the footing the on-policy phase needs.", "qwen2025qwen3"]},
  "p-qwen3-5": {"role": ["Offline text is the teacher's own answers, so the student never gets feedback on its own mistakes. Here the [[student|student]] writes responses in either mode and is trained to match the [[teacher|teacher's]] next-token probabilities (Qwen3-32B or Qwen3-235B-A22B) on them. On Qwen3-8B, starting from the same offline-distilled checkpoint, this beat RL on math and code with about a tenth of the GPU hours.", "qwen2025qwen3"]},
  "p-r1-0": {"role": ["DeepSeek's earlier R1-Zero ran RL straight from the base model. It learned to reason, but its output was hard to read and mixed languages. So R1 first fine-tunes DeepSeek-V3-Base on thousands of long reasoning examples in a clear, first-person style: humans rewrote raw traces, an LLM rewrote more in the same style, and humans checked the results. RL then starts from a model that already reasons in a form people can follow.", "deepseek2025r1"]},
  "p-r1-1": {"role": ["The small cold-start set costs reasoning ability: right after it, the model scored 59.0 on AIME 2024, against R1-Zero's 77.9. This GRPO stage on math, code and logic problems, graded by answer checkers, wins most of that back, to 74.0. A language-consistency reward, the share of words in the target language, keeps the reasoning in one language. DeepSeek reports it costs a little accuracy and keeps it because the output reads better.", "deepseek2025r1"]},
  "p-r1-3": {"role": ["The last stage tunes reasoning and general behavior together. Reasoning prompts keep their rule-based checks. General prompts are scored by a helpfulness reward model, which reads only the final summary, and a safety reward model, which reads the whole response. The preference rewards come in only for the last 400 of 1,700 steps, because training longer against them led to reward hacking. The gains are mostly on general benchmarks: about 25 points on AlpacaEval 2.0 and 17 on ArenaHard.", "deepseek2025r1"]},
  "p-r1-4": {"role": ["This carries R1's reasoning into models that are much cheaper to run: Qwen and Llama bases from 1.5B to 70B, fine-tuned on R1-written text with no RL. DeepSeek checked the alternative. A Qwen2.5-32B base given over 10K steps of large-scale RL ended up about level with QwQ-32B-Preview, while the [[offline|distilled]] 32B beat it on every benchmark they reported.", "deepseek2025r1"]},
};
const prose = s => s.replace(/\[\[([\w-]+)\|([^\]]+)\]\]/g, (m, k, t) => GLOSS[k] ? `<span class="pdef" data-def="${k}" tabindex="0" role="button">${t}</span>` : t);
function plainVal(v) {
  const para = x => Array.isArray(x) ? `<p>${prose(x[0])} ${citeTxt(x[1])}</p>` : `<p>${prose(x)}</p>`;
  if (typeof v === "string" || Array.isArray(v)) return para(v);
  return `${v.p ? para(v.p) : ""}<div class="ex">${v.rows.map(r => r ? `<div class="ex-r"><span class="ex-k">${r[0]}</span><span>${r[1]}</span></div>` : `<div class="ex-sep"></div>`).join("")}${v.note ? `<p class="note">${v.note}</p>` : ""}</div>`;
}
let plainOpen = false;                                       // the "More" fold stays as the reader left it
function plainHTML(n) {
  const p = PLAIN[n.id], fields = p ? (PLAIN_FIELDS[n.kind] || []).filter(([k]) => p[k]) : [];
  if (!fields.length) return "";
  const lead = (PLAIN_LEAD[state.lens] || []).find(k => fields.some(f => f[0] === k)) || fields[0][0];
  const [first, ...rest] = [fields.find(f => f[0] === lead), ...fields.filter(f => f[0] !== lead)];
  const block = ([k, head]) => `<div class="pl"><div class="pl-h">${head}</div>${plainVal(p[k])}</div>`;
  return `<h3>In plain terms</h3>${block(first)}${rest.length ? `<details class="pl-more"${plainOpen ? " open" : ""}><summary>More: ${rest.map(f => f[1].toLowerCase()).join(" · ")}</summary>${rest.map(block).join("")}</details>` : ""}`;
}
P.addEventListener("toggle", ev => { if (ev.target.classList?.contains("pl-more")) plainOpen = ev.target.open; }, true);

// Try prompts. go() sets up the view; a is the answer shown at the top of the panel (or of Compare);
// more names the panel section (its h3) that holds the detail; after() runs each time the answer is placed.
// The answer stays while the view it was written for is on screen, and drops once the reader moves on.
const flowNoRecipes = () => { if (state.lens !== "flow") applyLens("flow"); state.recipes = []; syncChips(); };
const TRY = [
  { id: "ratings", group: "start", q: "Where can expert ratings end up?",
    go: () => { flowNoRecipes(); select("d-ratings"); },
    a: "Only one place takes them as they are: a reward model can learn to predict the scores, and RL then trains against it. Everywhere else they need a transformation first: threshold them into good/bad labels for KTO, turn them into pairs for DPO and the other preference methods, or keep the top-rated responses as SFT data.",
    more: "How" },
  { id: "stages", group: "start", q: "How do the DeepSeek-R1 and Kimi K3 pipelines differ?",
    go: () => { state.sel = null; state.alias = null; state.recipes = ["r1", "k3"]; syncChips(); applyLens("pipes"); refresh(); renderPanel(); },
    a: "Both start with SFT, then run RL scored by verifiers. After that they split. DeepSeek-R1 alternates: it keeps the RL model's best outputs, fine-tunes a fresh base model on them, and runs RL again. Kimi K3 trains nine specialists with RL and folds them into one model with on-policy distillation, each specialist grading the student's tokens." },
  { id: "opd", group: "start", q: "Why does on-policy distillation come last?",
    go: () => { state.recipes = []; syncChips(); applyLens("pipes"); select("m-opd"); },
    a: "It needs a teacher that's already good, and the stages before it make the teachers. The lit boxes on the map are every on-policy distillation stage; each one sits at the end of its pipeline.",
    more: "Where it sits in a pipeline" },
  { id: "scorer", group: "deeper", q: "Same algorithm, different scorer: what changes for GRPO?",
    go: () => { state.recipes = []; syncChips(); applyLens("pipes"); select("p-r1-1"); },
    a: "Nothing in the update rule. The scorer decides where the feedback lands: a program verifier only checks the end result, adding a reward model gives one judgment on the whole response, and a process reward model (in DeepSeekMath) scores each reasoning step.",
    more: "How the scorer changes the feedback" },
  { id: "mech", group: "deeper", q: "Inside GRPO: what changes if you swap the baseline?",
    go: () => { flowNoRecipes(); select("m-grpo"); },
    after: () => { const card = P.querySelector(".mech"); if (card) { card.dataset.pin = "m-ppo"; card.dataset.show = "\u0000"; mechShow("m-ppo"); } },
    a: "The card below has PPO swapped in: a learned critic replaces the group mean, so one sample per prompt is enough and the advantage is per token, at the cost of a second network to train. (KL moves too; that's a separate choice.) Tap RLOO for the other option: keep the group, but leave each sample out of its own baseline.",
    more: "Inside one step" },
  { id: "cmp", group: "deeper", q: "Compare the RL update rules side by side",
    go: () => { flowNoRecipes(); select("f-reward"); openCompare("f-reward"); },
    a: "Every column gets the same prompt and the same four rewards, so the differences are in the five rows: samples per prompt, baseline, advantage, clipping, and where the KL penalty goes. Read across from REINFORCE, the reference column: PPO swaps the running average for a learned critic and adds clipping, RLOO and GRPO use a group of samples per prompt instead, and GSPO and CISPO mostly change what gets clipped." },
  { id: "relate", group: "deeper", q: "Which methods are special cases of others?",
    go: () => { flowNoRecipes(); setRel(true); select(null); },
    a: () => `<p>Six relations, drawn as gold ≈ arcs on the map. A special case is the general method with some settings fixed: rejection sampling is REINFORCE with a 0/1 reward that trains only on the passes.</p>
      <ul>${RELATIONS.map((r, i) => `<li><span class="glyph">≈</span>${nodeRef(r.from)} is ${r.rel} ${nodeRef(r.to)}${relCanCmp(r)
        ? ` <button class="ref cmp-rel" data-cmp-rel="${i}">compare</button>` : ""}</li>`).join("")}</ul>
      <p class="note">Related isn't interchangeable: each relation holds under its own assumptions.</p>` },
];
const TRY_BY = Object.fromEntries(TRY.map(t => [t.id, t]));
const viewKey = () => [panelKeyNow(), state.lens, state.compare ? state.compare.fam || (state.compare.mix ? "mix" : "pair-" + state.compare.rel) : ""].join("|");
function runTry(id) {
  const t = TRY_BY[id]; if (!t) return;
  state.tryOn = null;
  if (state.compare) closeCompare();
  t.go();
  state.tryOn = { id, key: viewKey() };
  placeTry(); syncHash();
}
function placeTry() {
  if (state.tryOn && state.tryOn.key !== viewKey()) { state.tryOn = null; syncHash(); }
  document.querySelectorAll(".try-ans").forEach(e => e.remove());
  P.querySelectorAll(".tryhl").forEach(e => e.classList.remove("tryhl"));
  const t = state.tryOn && TRY_BY[state.tryOn.id];
  if (!t) return;
  const html = `<div class="try-ans" role="note"><button class="try-x" data-try-x="1" aria-label="Dismiss this answer">✕</button>
    <div class="try-q">${t.q}</div>${typeof t.a === "function" ? t.a() : `<p>${t.a}</p>`}${t.more ? `<button class="try-more" data-try-more="1">Show the detail ↓</button>` : ""}</div>`;
  if (state.compare) { CMP.querySelector(".cmp-intro")?.insertAdjacentHTML("afterbegin", html); return; }
  const back = P.querySelector(".back");
  back ? back.insertAdjacentHTML("afterend", html) : P.insertAdjacentHTML("afterbegin", html);
  const h = tryHead(t);
  for (let el = h; el && (el === h || el.tagName !== "H3"); el = el.nextElementSibling) el.classList.add("tryhl");
  t.after?.();
}
const tryHead = t => t.more && [...P.querySelectorAll("h3")].find(h => h.textContent.trim().startsWith(t.more));
function dismissTry() { state.tryOn = null; placeTry(); syncHash(); }
function setRel(v) { state.showRel = v; $("reltoggle").classList.toggle("on", v); frame(); syncHash(); }
$("reltoggle").onclick = () => setRel(!state.showRel);
const syncChips = () => document.querySelectorAll("#recipes .chip").forEach(c => c.classList.toggle("on", state.recipes.includes(c.dataset.recipe)));

/* ============================================================
   MECHANISM CARDS
   One training step of an update rule, drawn with the same parts as
   the article's method figures: weights (network glyph; bright =
   trained), text (ruled cards; a stack = stored), numbers (chips),
   computation (plain box). Each family has one skeleton of rows;
   dashed rows are slots, the parts its methods choose differently,
   and a faint row is an empty slot. Hovering a substitute from the
   same family swaps it in and marks what changed.
   ============================================================ */
const SB = s => `<tspan baseline-shift="sub" font-size="0.75em">${s}</tspan>`;
const PI_T = `π${SB("θ")}`;
const MECH_R = [0.9, 0.2, 0.7, 0.0];                       // the same four rewards in every RL card
const SFT_TOK = [0.35, 0.15, 0.6, 0.2, 0.1, 0.85, 0.3, 0.15]; // every target token pushed up, harder where surprising
const OPD_TOK = [0.2, -0.45, 0.1, 0.25, -0.95, 0.15, -0.7, 0.2]; // the teacher disagrees at a few tokens

// ---- Definitions for the card's terms: hover, focus or tap a dotted label
const GLOSS = {
  policy: ["Policy", "The model being trained. The gradient changes only its weights."],
  frozen: ["Frozen", "Run during the step but never updated."],
  gradient: ["Gradient", "Which way to change the trained weights to lower the loss. The dashed line shows it flowing back only into models marked TRAINED."],
  loss: ["Loss", "The number training lowers. Its gradient says which way to change the weights."],
  logprob: ["Log-prob", "log π(y | x): how likely the model finds a response, the sum of its tokens' log-probabilities."],
  signal: ["Signal", "Which way each piece of text is pushed. Light means made more likely, hatched means made less likely; brighter means pushed harder."],
  reference: ["Reference model", "A frozen copy of the model from before this stage. The policy is measured against it to tell how far it has moved."],
  // scalar rewards
  samples: ["Samples", "How many responses the policy writes per prompt: one, or a group of G that can be compared with each other."],
  rollouts: ["Rollouts", "Responses the policy samples during training. With a group of G per prompt, the responses can serve as each other's baseline."],
  scorer: ["Scorer", "Whatever turns a response into a number: a reward model, an LLM judge, or a program that checks the answer."],
  reward: ["Reward r", "One number per response from the scorer. The same four rewards appear in every card so the methods can be compared."],
  baseline: ["Baseline b", "What each reward is compared against. Responses that beat it are pushed up and ones that fall short are pushed down. Subtracting it makes each step less noisy."],
  running: ["Running average", "The average reward over recent training steps. Cheap, but it doesn't know whether this prompt is easy or hard."],
  loo: ["Leave-one-out mean", "For each response, the mean reward of the other responses to the same prompt, so no response is compared against itself."],
  critic: ["Critic (value model)", "A second network, trained alongside the policy, that predicts the reward still to come from each point in the response. It gives every token its own advantage, at the cost of another model in memory."],
  groupnorm: ["Group mean ÷ std", "Subtract the mean reward of this prompt's G responses, then divide by their standard deviation. No critic needed, only several responses per prompt."],
  advantage: ["Advantage A", "How much better a response or token did than the baseline, A = r − b. Positive makes it more likely, negative less likely; the size sets how hard."],
  advnorm: ["Normalized advantage", "The advantage divided by the group's standard deviation, so a prompt whose rewards are bunched together gets as strong a signal as one whose rewards are spread out."],
  ratio: ["Probability ratio", "π_new / π_old for a token: how much more likely the current policy makes it than the policy that sampled it. It moves away from 1 when one batch of rollouts is reused for several gradient steps."],
  clip: ["Clipping", "Caps how far the probability ratio can move from 1 on one batch (often ±0.2), so one batch can't change the policy too much at once."],
  noclip: ["No clipping", "Each batch of rollouts is used for a single gradient step, so the policy that sampled it is the one being updated and there's no ratio to cap."],
  cliptok: ["Clip per token", "Each token's ratio is clipped on its own. Once a token's ratio leaves the range in the direction its advantage pushes, that token stops contributing gradient."],
  clipseq: ["Clip per sequence", "GSPO computes one ratio for the whole response (the geometric mean of its token ratios) and clips that, so the response is kept or dropped as a unit."],
  clipis: ["Clip the IS weights", "CISPO clips the importance-sampling weight and stops gradient through it, instead of dropping tokens whose ratio leaves the range. Every token keeps contributing; the clip only limits its weight."],
  kl: ["KL penalty", "A cost for drifting from the reference model, measured by the KL divergence between their next-token distributions. It keeps the policy near where it started, which limits how far it can go to exploit the scorer."],
  klreward: ["KL in the reward", "The penalty is subtracted from the reward before advantages are computed, as in InstructGPT-style PPO."],
  klloss: ["KL in the loss", "The penalty is a separate term added to the loss, as in GRPO, so it never mixes into the advantages."],
  kloptional: ["KL optional", "Often left out, especially with verifiable rewards. Dropping it also frees the reference model from memory."],
  // preferences
  pairs: ["Preference pair", "One prompt with two responses, one labeled chosen and one rejected."],
  unpaired: ["Good/bad labels", "KTO needs only a thumbs up or down on single responses, not two responses to the same prompt."],
  fresh: ["Fresh pairs", "Online DPO samples two new responses from the current policy each step and has a scorer pick the winner, so the pairs never go stale."],
  labeler: ["Labeler", "What decided which response is better: a person or model when the dataset was built, or a live scorer during training."],
  implied: ["Implied reward r̂", "These methods never train a reward model. A score computed from the policy's own log-probs plays that role, and the loss pushes the chosen response's score above the rejected one's."],
  logratio: ["Log-ratio to the reference", "log(π / π_ref): how much more likely the policy makes a response than the reference does. Raising it for chosen responses and lowering it for rejected ones is the whole update."],
  beta: ["β", "A scale on the implied reward. With a reference model, it sets how tightly the policy is held to it: smaller β lets it move further."],

const MECH_BASE = {

const MECH_CLIP = {
  none:    { t: "No clipping", s: "plain policy gradient", k: "none" },
  token:   { t: "Clip each token's ratio", s: "caps one batch's push", k: "per token" },

  weights: { t: "Clip the importance weights", s: "no token loses its gradient", k: "IS weights" },

// Advantages from the same rewards, so the baselines' differences are real numbers
function mechAdv(m) {
  if (m.samples === 1) {
    if (m.base === "critic") return { r: [0.7], tok: [0.12, 0.05, 0.3, -0.22, 0.08, 0.35, -0.12, 0.18] }; // illustrative
    return { r: [0.7], a: [0.7 - 0.5] };                                    // running average b = 0.5
  }
  const r = MECH_R, n = r.length, sum = r.reduce((x, y) => x + y, 0), mean = sum / n;
  if (m.base === "loo") return { r, a: r.map(x => x - (sum - x) / (n - 1)) };
  const sd = Math.sqrt(r.reduce((x, y) => x + (y - mean) ** 2, 0) / n);
  return { r, a: r.map(x => (x - mean) / sd) };
}
const fmtA = v => (v >= 0 ? "+" : "−") + (Math.abs(v) >= 1 ? Math.abs(v).toFixed(1) : Math.abs(v).toFixed(2).replace(/^0/, ""));
